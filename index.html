incipal \nChief Personnel Officers (PCPOs) regarding alterations? अगर किसी कर्मचारी की जन्म की सिफ़र् साल \nऔर महीने की जानकारी हो, तो उसकी सही जन्म-तिथि दर्ज करने का डिफ़ॉल्ट नियम क्या है, और बदलाव करने के \nमामले में प्रिसिपल चीफ़ पर्सनल ऑफि़सर्स (PCPOs) को दी गई अथॉरिटी पर क्या पाबंदी है?", "options": {"A": "The date is recorded as the 1st of that month; PCPOs possess the full administrative authority to \nrelax all timeline limits for Group 'C' employees. A) तारीख़ उस महीने की 1 तारीख़ दर्ज की जाती है; PCPOs \nके पास ग्रुप 'C' कर्मचारियों के लिए सभी समय-सीमाओं में छू ट देने का पूरा प्रशासनिक अधिकार होता है।", "B": "The date is recorded as the 31st of that month; PCPOs cannot decide cases involving Calcutta or \nPatna University matriculants. B) तारीख़ उस महीने की 31 तारीख़ दर्ज की जाती है; PCPOs कलकत्ता या पटना \nयूनिवसिटी से मैट्रिक पास करने वालों से जुड़े मामलों पर फ़ै सला नहीं ले सकते।", "C": "The date is recorded as the 16th of that month; the powers re-delegated to PCPOs explicitly \nexclude the power to relax the stipulated time limits and conditions for alterations. C) तारीख़ उस महीने \nकी 16 तारीख़ दर्ज की जाती है; PCPOs को दोबारा सौंपे गए अधिकारों में बदलाव के लिए तय समय-सीमा और शर्तों में छू ट \nदेने का अधिकार साफ़ तौर पर शामिल नहीं है।", "D": "The date is recorded as the 15th of that month; PCPOs may waive the probation period condition \nfor illiterate Group 'D' staff if a clerical error is proven. D) तारीख़ उस महीने की 15 तारीख़ दर्ज की जाती है; \nअगर कोई क्लर्क की गलती साबित हो जाती है, तो PCPOs अनपढ़ ग्रुप 'D' स्टाफ़ के लिए प्रोबेशन पीरियड की शर्त में छू ट दे \nसकते हैं।\nPage 15 of \n35"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 49, "question": "According to Rule 11(2), if a disciplinary authority proposes to impose a minor penalty to \nwithhold increments of pay, an inquiry in the major penalty format must mandatory be held if \nthe penalty meets which condition? नियम 11(2) के अनुसार, यदि अनुशासनात्मक प्राधिकरण वेतन वृद्धि \n(इंक्रीमेंट) रोकने जैसी मामूली सज़ा देने का प्रस्ताव करता है, तो किस स्थिति में 'बड़ी सज़ा' (मेजर पेनल्टी) वाली प्रक्रिया \nके तहत जांच करना अनिवार्य है?", "options": {"A": "Withholding of increments for any period exceeding one year A) एक साल से ज़्यादा समय के लिए वेतन \nवृद्धि रोकना", "B": "Withholding of increments that affects promotion pathways B) वेतन वृद्धि रोकना जिससे प्रमोशन के रास्ते \nप्रभावित हों", "C": "Likely to affect adversely the amount of pension payable, exceeds three years, or has cumulative \neffect C) जिससे मिलने वाली पेंशन की राशि पर बुरा असर पड़ने की संभावना हो, अवधि तीन साल से ज़्यादा हो, या उसका \nसंचयी (cumulative) असर हो", "D": "Imposed on a Group 'A' or Group 'B' officer without consulting the Commission D) कमीशन से \nसलाह लिए बिना ग्रुप 'A' या ग्रुप 'B' के अधिकारी पर सज़ा लगाना"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 50, "question": "What specific percentage of basic pay must be added to the basic pay of Running Staff to \ndetermine the 'pay element' for reckoning their pensionary emoluments? रनिग स्टाफ़ की पेंशन से \nजुड़ी राशि (pensionary emoluments) की गणना के लिए 'पे एलिमेंट' (pay element) तय करने हेतु, उनकी \nबेसिक पे में बेसिक पे का कितना प्रतिशत जोड़ा जाना चाहिए?", "options": {"A": "30 per centum A) 30 प्रतिशत", "B": "40 per centum B) 40 प्रतिशत", "C": "50 per centum C) 50 प्रतिशत", "D": "55 per centum D) 55 प्रतिशत"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 51, "question": "Retired Railway servants are entitled to receive an additional compassionate or age-related \nbasic pension upon crossing advanced age milestones. What is the correct percentage increase \ngranted to a pensioner who is 90 years or more but less than 95 years of age? रिटायर हो चुके रेलवे \nकर्मचारियों को एक निश्चित उम्र पार करने पर अतिरिक्त सहानुभूति-आधारित या उम्र से जुड़ी बेसिक पेंशन पाने का \nअधिकार होता है। 90 साल या उससे ज़्यादा, लेकिन 95 साल से कम उम्र के पेंशनभोगी को कितनी प्रतिशत बढ़ोतरी \nमिलती है?", "options": {"A": "20 percent of basic pension A) बेसिक पेंशन का 20 प्रतिशत", "B": "30 percent of basic pension B) बेसिक पेंशन का 30 प्रतिशत", "C": "40 percent of basic pension C) बेसिक पेंशन का 40 प्रतिशत", "D": "50 percent of basic pension D) बेसिक पेंशन का 50 प्रतिशत\nPage 16 of \n35"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 27 & 29 (Additional Pension Table), pp. 152, 159", "explanation_concept": "80 से <85 वर्ष: 20%; 85 से <90 वर्ष: 30%; 90 से <95 वर्ष: 40%; 95 से <100 वर्ष: 50%; 100 वर्ष या अधिक: 100% अतिरिक्त बेसिक पेंशन देय होती है।", "explanation_facts": "• 80 वर्ष की आयु पूरी होने के महीने के प्रथम दिन से यह अतिरिक्त पेंशन प्रारंभ हो जाती है।"}, {"id": 52, "question": "According to Para 8(d), what strict administrative time limits should be observed for \nproviding appointments once a candidate is eligible and suitable under Priority (i) cases \n(dependents of employees who die or are permanently crippled in the course of duty)? पैरा 8(d) \nके अनुसार, प्रायोरिटी (i) मामलों (कर्मचारियों के आश्रित जिनकी ड्यूटी के दौरान मृत्यु हो जाती है या जो हमेशा के लिए \nअपंग हो जाते हैं) के तहत कैं डिडेट के योग्य और उपयुक्त होने पर अपॉइंटमेंट देने के लिए कौन सी सख्त एडमिनिस्ट्रेटिव \nटाइम लिमिट का पालन किया जाना चाहिए?", "options": {"A": "Within a time limit of one month A) एक महीने की टाइम लिमिट के अंदर", "B": "Within a time limit of three months B) तीन महीने की टाइम लिमिट के अंदर", "C": "Within a time limit of six months C) छह महीने की टाइम लिमिट के अंदर", "D": "Before the end of the current financial year D) मौजूदा फाइनेंशियल ईयर के खत्म होने से पहले"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 53, "question": "When an executive authority conducts an assessment of vacancies to prepare a select list for \nnon-selection promotions, what specific timeline of anticipated vacancies must be factored in? \nजब कोई कार्यकारी अधिकारी 'नॉन-सिलेक्शन प्रमोशन' (बिना चयन-परीक्षा वाले प्रमोशन) के लिए चुनी गई उम्मीदवारों \nकी सूची तैयार करने के मकसद से खाली पदों का आकलन करता है, तो संभावित खाली पदों के लिए किस समय-सीमा \nको ध्यान में रखना ज़रूरी है?", "options": {"A": "Anticipated vacancies occurring during the next 6 months due to superannuation only. A) सिफ़र् \nरिटायरमेंट (superannuation) के कारण अगले 6 महीनों में होने वाली संभावित खाली जगहें।", "B": "Anticipated vacancies occurring during the next 15 months across all construction projects. B) \nसभी कं स्ट्रक्शन प्रोजेक्ट्स में अगले 15 महीनों के दौरान होने वाली संभावित खाली जगहें।", "C": "Existing vacancies plus those anticipated to occur during the next one year due to normal \nwastage, deputation, transfers, etc. C) मौजूदा खाली जगहें और साथ ही सामान्य कमी (normal wastage), \nडेपुटेशन, ट्रांसफर आदि के कारण अगले एक साल में होने वाली संभावित खाली जगहें।", "D": "Existing vacancies plus those expected to be newly sanctioned over the next two financial years. \nD) मौजूदा खाली जगहें और साथ ही अगले दो फाइनेंशियल वर्षों में नई मंज़ूर होने वाली संभावित जगहें।"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 24 (Selection vs Non-Selection), pp. 134-135", "explanation_concept": "गैर-चयन (Non-Selection) पद Seniority-cum-Suitability के आधार पर 1:1 के अनुपात में भरे जाते हैं। इसके लिए 12 माह (1 वर्ष) की रिक्तियों का आकलन किया जाता है।", "explanation_facts": "• चयन पदों (Selection Posts) हेतु 15 माह की रिक्तियों का आकलन 3x पात्रता दायरे के साथ किया जाता है और पैनल वैधता 2 वर्ष होती है।"}, {"id": 54, "question": "What is the standard maximum currency or life of an approved selection panel from the date \nof its approval, and what specific period can be excluded from this timeframe? किसी मंज़ूर किए \nगए सिलेक्शन पैनल की मंज़ूरी की तारीख से उसकी अधिकतम वैधता अवधि क्या होती है, और इस समय-सीमा में से \nकिस खास अवधि को हटाया जा सकता है?", "options": {"A": "1 year; any period covered by an employee being on deputation abroad A) 1 साल; विदेश में डेपुटेशन \nपर रहने वाले कर्मचारी की अवधि", "B": "2 years; any period covered by a Stay Order or injunction of a Court of Law B) 2 साल; कोर्ट के स्टे \nऑर्डर या निषेधाज्ञा (injunction) के तहत आने वाली अवधि", "C": "2 years; any period taken to complete supplementary selections C) 2 साल; सप्लीमेंट्री सिलेक्शन पूरे करने \nमें लगी अवधि", "D": "18 months; any period covered by an administrative training extension D) 18 महीने; एडमिनिस्ट्रेटिव \nट्रेनिग एक्सटेंशन के तहत आने वाली अवधि\nPage 17 of \n35"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 55, "question": "For medical officers in the railway service, what is the revised age of superannuation after the \nrecent enhancement from the baseline of 60 years? रेलवे सेवा में मेडिकल अधिकारियों के लिए, 60 साल \nकी शुरुआती उम्र सीमा में हालिया बढ़ोतरी के बाद रिटायरमेंट की नई उम्र क्या है?", "options": {"A": "65 years A. 65 साल", "B": "63 years B. 63 साल", "C": "61 years C. 61 साल", "D": "67 years D. 67 साल"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 27 & 29 (Retirement Rules), pp. 150, 159", "explanation_concept": "सामान्य सेवानिवृत्ति आयु 60 वर्ष है (30.05.1998 से लागू)। यदि जन्मतिथि महीने की 1 तारीख है, तो सेवानिवृत्ति पिछले माह के अंतिम दिन होगी; 2 या उसके बाद होने पर उसी माह के अंतिम दिन।", "explanation_facts": "• रेलवे मेडिकल अधिकारियों (IRMS डॉक्टर्स) की सेवानिवृत्ति आयु बढ़ाकर 65 वर्ष कर दी गई है।\n• पेंशन हेतु न्यूनतम अर्हकारी सेवा 10 वर्ष तथा वीआरएस हेतु 20 वर्ष है।"}, {"id": 56, "question": "Which of the following expenditures associated with the Staff Benefit Fund (SBF) must be \nmet from the Fund itself, rather than from general Railway Revenues. स्टाफ़ बेनिफि़ट फ़ं ड (SBF) से \nजुड़े इनमें से कौन से खर्च सामान्य रेलवे रेवेन्यू (राजस्व) के बजाय फ़ं ड से ही पूरे किए जाने चाहिए?", "options": {"A": "· A) Cost of stationery and printing charges of forms A) स्टेशनरी और फ़ॉर्म की छपाई का खर्च", "B": "Expenditures incurred on entertainment during SBF meetingsB) SBF की बैठकों के दौरान मनोरंजन पर \nहोने वाला खर्च", "C": "Maintenance expenses of Maternity Centres on the Railways.C) रेलवे में मैटरनिटी सेंटर्स (प्रसूति केंद्रों) \nके रखरखाव का खर्च", "D": "Contingent expenses and postage charges relating to the SBF.D) SBF से जुड़े आकस्मिक खर्च और \nडाक शुल्क"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 22 (Staff Benefit Fund), pp. 126-127", "explanation_concept": "SBF की स्थापना 1931 में हुई। प्रतिवर्ष ₹800 प्रति कर्मचारी की दर से आवंटन किया जाता है (RBE 157/2022)। यह मुख्य रूप से अराजपत्रित कर्मचारियों एवं आरपीएफ के कल्याण हेतु है।", "explanation_facts": "• निलंबित/सेवानिवृत्त कर्मचारी SBF बैठकों में भाग नहीं ले सकते।\n• SBF बैठकों के दौरान मनोरंजन पर होने वाला खर्च SBF फंड से ही वहन किया जाता है।\n• PCPO को छात्रवृत्ति व चिकित्सा मदों को छोड़कर 25% तक पुनर्विनियोजन का अधिकार है।"}, {"id": 57, "question": "When a railway servant is judicially or administratively constrained by a pending \ndepartmental disciplinary case, what specific type of pensionary disbursement is legally \nauthorized to be sanctioned? जब कोई रेलवे कर्मचारी किसी लंबित विभागीय अनुशासनात्मक मामले के कारण \nन्यायिक या प्रशासनिक रूप से बाध्य होता है, तो किस विशेष प्रकार के पेंशन भुगतान को मंज़ूरी देने का कानूनी अधिकार \nहोता है?", "options": {"A": "Absolute Pension A. पूर्ण पेंशन", "B": "Provisional Pension B. अनंतिम पेंशन", "C": "Standard Gratuity-Linked Pension C. मानक ग्रेच्युटी-लिक्ड पेंशन", "D": "None of these D. इनमें से कोई नहीं\nPage 18 of \n35"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 58, "question": "When a non-gazetted Railway employee is transferred from one foreign Railway or Division \nback to their original parent division after a Vigilance or Disciplinary case, what mandatory \nwaiting periods apply for cases culminating in minor and major penalties, respectively? जब \nकिसी नॉन-गजेटेड रेलवे कर्मचारी का विजिलेंस या अनुशासनात्मक मामले के बाद किसी दूसरे रेलवे या डिवीज़न से उसके \nमूल डिवीज़न में तबादला किया जाता है, तो क्रमशः मामूली और गंभीर दंड वाले मामलों के लिए कौन-सी अनिवार्य प्रतीक्षा \nअवधि लागू होती है?", "options": {"A": "1 year for a minor penalty and 3 years for a major penalty, starting from the date the offense was \ninitially detected. A) मामूली दंड के लिए 1 साल और गंभीर दंड के लिए 3 साल, जिसकी गिनती अपराध का पता चलने \nकी तारीख से शुरू होती है।", "B": "2 years for a minor penalty and 5 years for a major penalty, calculated from the date the formal \ncharge sheet was issued. B) मामूली दंड के लिए 2 साल और गंभीर दंड के लिए 5 साल, जिसकी गिनती औपचारिक \nचार्ज शीट जारी होने की तारीख से की जाती है।", "C": "A lapse of at least 3 years for a minor penalty and at least 6 years for a major penalty, beyond the \ndate of completion of the period of punishment. C) दंड की अवधि पूरी होने की तारीख के बाद, मामूली दंड के लिए \nकम से कम 3 साल और गंभीर दंड के लिए कम से कम 6 साल का समय बीत जाना चाहिए।", "D": "No waiting period is prescribed for either penalty, provided the General Manager gives a personal \nexemption order. D) किसी भी दंड के लिए कोई प्रतीक्षा अवधि तय नहीं है, बशर्ते जनरल मैनेजर व्यक्तिगत छू ट का आदेश \nदें।"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 6 (Types of Penalties - Rule 6), pp. 53-55", "explanation_concept": "Rule 6 के अंतर्गत कुल 11 शास्तियाँ हैं: 6 लघु शास्तियाँ (Minor) और 5 दीर्घ शास्तियाँ (Major)।", "explanation_facts": "• 6 लघु शास्तियाँ: 1. परिनिंदा (Censure), 2. पदोन्नति रोकना, 3. वेतन से वसूली, 3(a). पास/पीटीओ रोकना, 3(b). समय-वेतनमान में निचले स्तर पर अवनति (बिना संचयी प्रभाव, अधिकतम 3 वर्ष), 4. वेतन वृद्धि रोकना।\n• 5 दीर्घ शास्तियाँ: 5. संचयी प्रभाव से अवनति, 6. निचले ग्रेड/पद पर अवनति, 7. अनिवार्य सेवानिवृत्ति, 8. सेवा से हटाना (Removal - नॉट डिस्क्वालिफाइड), 9. बर्खास्तगी (Dismissal - भविष्य में सरकारी सेवा हेतु अयोग्य)।"}, {"id": 59, "question": "If an employee proceeds on paid leave immediately before retirement after holding a higher \nappointment in an officiating capacity, what mandatory condition must stand fulfilled for \nthem to get the benefit of that higher pay as emoluments? अगर कोई कर्मचारी ऑफिसिएटिग कै पेसिटी में \nहायर पोस्ट पर रहने के बाद रिटायरमेंट से ठीक पहले पेड लीव पर जाता है, तो उसे उस हायर पे का फायदा एमोल्युमेंट के \nतौर पर पाने के लिए कौन सी ज़रूरी शर्त पूरी होनी चाहिए?", "options": {"A": "It must be certified that they would have continued to hold the higher appointment but for \nproceeding on leave. A) यह सटिफाइड होना चाहिए कि अगर वह छु ट्टी पर नहीं जाता तो हायर पोस्ट पर बना रहता।", "B": "They must have held that higher post in a continuous substantive capacity for at least three full \nyears. B) उसे कम से कम पूरे तीन साल तक लगातार सब्सटेंटिव कै पेसिटी में उस हायर पोस्ट पर रहना होगा।", "C": "The higher appointment must be explicitly regularized by the General Manager prior to the \ncommencement of leave. C) हायर अपॉइंटमेंट को छु ट्टी शुरू होने से पहले जनरल मैनेजर द्वारा साफ तौर पर रेगुलर किया \nजाना चाहिए।", "D": "No certificate is required; officiating pay is automatically carried forward if drawn on the final \nworking day. D) किसी सटिफिके ट की ज़रूरत नहीं है; अगर आखिरी वकिग डे पर ऑफिसिएटिग पे लिया जाता है तो वह \nअपने आप आगे बढ़ जाता है।\nPage 19 of \n35"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 60, "question": "Can a railway servant placed under suspension act as a defence helper for another railway \nemployee facing departmental enquiry proceedings? क्या सस्पेंड किया गया रेलवे कर्मचारी, विभागीय जांच \nका सामना कर रहे किसी दूसरे रेलवे कर्मचारी के लिए 'डिफें स हेल्पर' (बचाव पक्ष का सहायक) के तौर पर काम कर \nसकता है?", "options": {"A": "No, suspended employees are barred from participating in any official enquiry panels. A) नहीं, \nसस्पेंड किए गए कर्मचारियों को किसी भी आधिकारिक जांच पैनल में शामिल होने की मनाही होती है।", "B": "Yes, but only with the written, prior authorization of the General Manager. B) हाँ, लेकिन के वल जनरल \nमैनेजर की लिखित और पहले से ली गई मंज़ूरी के साथ।", "C": "Yes, there is no bar to a railway servant placed under suspension acting as a defence helper. C) हाँ, \nसस्पेंड किए गए रेलवे कर्मचारी के 'डिफें स हेल्पर' के तौर पर काम करने पर कोई रोक नहीं है।", "D": "Yes, but only if they are not drawing any subsistence allowance.D) हाँ, लेकिन के वल तभी जब वे कोई \nनिर्वाह भत्ता (subsistence allowance) न ले रहे हों।"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 6 (Suspension - Rules 4 & 5 / MC 64), pp. 53-54", "explanation_concept": "मास्टर सर्कुलर 64 के अनुसार निलंबन कोई दंड (Penalty) नहीं है, बल्कि एक प्रशासनिक व्यवस्था (Administrative Measure) है।", "explanation_facts": "• पुलिस हिरासत या आपराधिक मामले में 48 घंटे रहने पर माना गया निलंबन (Deemed Suspension - Rule 5(2)) लागू होता है।\n• निलंबन की पहली समीक्षा 90 दिनों के भीतर तथा विस्तार एक बार में अधिकतम 180 दिनों के लिए होता है।\n• निलंबित कर्मचारी किसी अन्य कर्मचारी का 'डिफेंस हेल्पर' बन सकता है।"}, {"id": 61, "question": "Under the geographical and linguistic classification of the Official Languages Rules, to which \nspecific region is the state of Gujarat assigned? 190. राजभाषा नियमों के तहत भौगोलिक और भाषाई \nवर्गीकरण में, गुजरात राज्य को किस विशिष्ट क्षेत्र में रखा गया है?", "options": {"A": "Region \"A\" (\"क\" क्षेत्र) A. क्षेत्र \"A\" (\"क\" क्षेत्र)", "B": "Region \"B\" (\"ख\" क्षेत्र) B. क्षेत्र \"B\" (\"ख\" क्षेत्र)", "C": "Region \"C\" (\"ग\" क्षेत्र) C. क्षेत्र \"C\" (\"ग\" क्षेत्र)", "D": "None of the above D. इनमें से कोई नहीं"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 1 & Official Languages Rules 1976", "explanation_concept": "राजभाषा नियम 1976 के अनुसार राज्यों को तीन क्षेत्रों (क, ख, ग) में बाँटा गया है। गुजरात, महाराष्ट्र, पंजाब और चंडीगढ़ 'ख' क्षेत्र में आते हैं। अंडमान और निकोबार द्वीप समूह विशिष्ट रूप से 'क' क्षेत्र में आता है।", "explanation_facts": "• क्षेत्र 'क': बिहार, हरियाणा, हिमाचल प्रदेश, मध्य प्रदेश, राजस्थान, उत्तर प्रदेश, उत्तराखंड, झारखंड, छत्तीसगढ़, दिल्ली एवं अंडमान-निकोबार।\n• क्षेत्र 'ख': गुजरात, महाराष्ट्र, पंजाब, और यू.टी. चंडीगढ़, दमन-दीव, दादरा-नगर हवेली।\n• क्षेत्र 'ग': शेष सभी राज्य एवं संघ राज्य क्षेत्र (तमिलनाडु पर यह नियम लागू नहीं होते)।"}, {"id": 62, "question": "For the purpose of calculating retirement and death benefits under the pension rules, how is \nthe \"Average Emoluments\" framework determined? पेंशन नियमों के तहत रिटायरमेंट और मृत्यु लाभों की \nगणना के लिए, \"औसत परिलब्धियों\" (Average Emoluments) का निर्धारण कै से किया जाता है?", "options": {"A": "With reference to the emoluments drawn by a Railway servant during the last three years of \nservice. A) रेलवे कर्मचारी द्वारा सेवा के अंतिम तीन वर्षों के दौरान प्राप्त परिलब्धियों के आधार पर।", "B": "With reference to the cumulative basic pay earned during the entire temporary or officiating \nservice. B) पूरी अस्थायी या कार्यवाहक सेवा के दौरान अजित कु ल मूल वेतन के आधार पर।", "C": "With reference to the emoluments drawn by a Railway servant during the last twelve months of \nservice. C) रेलवे कर्मचारी द्वारा सेवा के अंतिम बारह महीनों के दौरान प्राप्त परिलब्धियों के आधार पर।", "D": "With reference to the emoluments drawn by a Railway servant during the last ten months of his \nservice. D) रेलवे कर्मचारी द्वारा अपनी सेवा के अंतिम दस महीनों के दौरान प्राप्त परिलब्धियों के आधार पर।"}, "answer": "D", "explanation_ref": "Establishment Book 2026, Ch. 27 (Pension Calculation), p. 151", "explanation_concept": "पेंशन की गणना अंतिम 10 महीनों के औसत बेसिक वेतन अथवा अंतिम बेसिक वेतन (जो भी कर्मचारी के हित में हो) के 50% के रूप में की जाती है।", "explanation_facts": "• 7वें CPC के अनुसार न्यूनतम पेंशन ₹9,000 + DA तथा अधिकतम ₹1,25,000 + DA प्रतिमाह है।\n• रनिंग स्टाफ हेतु पेंशन परिलब्धियों की गणना में 55% पे एलिमेंट जोड़ा जाता है।"}, {"id": 63, "question": "राजभाषा अधिनियम 1963 में कितनी धाराएँ हैं?How many section are there in the Official Language \nAct 1963?", "options": {"A": "(क) 7 (A) 7", "B": "(ख) 8 (B) 8", "C": "(ग) 9(C) 9", "D": "(घ) 10 (D) 10\nPage 20 of \n35"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 64, "question": "Under what specific condition is a technical resignation allowed to be accepted from a \nGovernment servant who applied for an outside post before joining the Government service, \neven though the application was not routed through the proper channel? किस खास स्थिति में किसी \nसरकारी कर्मचारी से 'तकनीकी इस्तीफ़ा' (technical resignation) स्वीकार किया जा सकता है, जिसने सरकारी सेवा \nमें शामिल होने से पहले किसी बाहरी पद के लिए आवेदन किया था, भले ही वह आवेदन सही प्रक्रिया (proper \nchannel) से न भेजा गया हो?", "options": {"A": "The employee must serve out a minimum probationary period of two years before tendering the \nresignation. A) इस्तीफ़ा देने से पहले कर्मचारी को कम से कम दो साल की प्रोबेशन अवधि (परिवीक्षा काल) पूरी करनी \nहोगी।", "B": "The details of the application must be intimated immediately upon joining, a specific request \nmust be made at the time of resignation, and the authority must be satisfied that the application \nwould have been forwarded if they were in service at that time. B) नौकरी में शामिल होने पर तुरंत आवेदन की \nजानकारी देनी होगी, इस्तीफ़ा देते समय एक खास अनुरोध करना होगा, और संबंधित अधिकारी को इस बात का यकीन होना \nचाहिए कि अगर कर्मचारी उस समय सेवा में होता, तो आवेदन आगे भेज दिया जाता।", "C": "The employee must pay back the total cost of training incurred by the parent department prior to \ntheir release. C) नौकरी छोड़ने से पहले कर्मचारी को मूल विभाग द्वारा ट्रेनिग पर हुए कु ल खर्च का भुगतान करना होगा।", "D": "The outside selection must be verified and approved personally by the President of India or the \nMinistry of External Affairs. D) बाहरी चयन की पुष्टि और मंज़ूरी व्यक्तिगत रूप से भारत के राष्ट्रपति या विदेश मंत्रालय \nद्वारा की जानी चाहिए।"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 65, "question": "As per the Factories Act, 1948, a suitable room or rooms (crèche) for the use of children under \nthe age of six years must be provided and maintained if more than how many women workers \nare ordinarily employed? 208. फै क्ट्रीज़ एक्ट, 1948 के अनुसार, छह साल से कम उम्र के बच्चों के इस्तेमाल के \nलिए एक उपयुक्त कमरा या कमरे (क्रे च) की व्यवस्था और रखरखाव तब करना ज़रूरी है, जब आम तौर पर कितनी महिला \nवर्क र काम पर रखी गई हों?", "options": {"A": "20 women workers A) 20 महिला वर्क र", "B": "30 women workers B) 30 महिला वर्क र", "C": "50 women workers C) 50 महिला वर्क र", "D": "100 women workers D) 100 महिला वर्क र"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 17 (Factories Act, 1948), pp. 100-102", "explanation_concept": "कारखाना अधिनियम 1948 (01.04.1949 से लागू) के तहत किसी वयस्क श्रमिक के लिए अधिकतम 48 घंटे प्रति सप्ताह और 9 घंटे प्रतिदिन कार्य निर्धारित है। 5 घंटे लगातार कार्य के बाद 30 मिनट का विश्राम अनिवार्य है।", "explanation_facts": "• क्रेच (शिशुगृह): 30 से अधिक महिला श्रमिक होने पर (धारा 48)।\n• कैंटीन: 250 से अधिक श्रमिक (धारा 46)।\n• एम्बुलेंस रूम: 500 से अधिक श्रमिक (धारा 45)।\n• सेफ्टी ऑफिसर: 1000 या अधिक श्रमिक होने पर (धारा 40B)।"}, {"id": 66, "question": "According to the standard scale of minor penalties defined under the Railway Servants \n(Discipline and Appeal) Rules, 1968, what is the precise number of distinct minor penalties \navailable to the disciplinary authority? रेलवे कर्मचारी (अनुशासन और अपील) नियम, 1968 के तहत बताई \nगई मामूली दंड की मानक श्रेणी के अनुसार, अनुशासनात्मक अधिकारी के पास अलग-अलग मामूली दंडों की सटीक \nसंख्या कितनी है?", "options": {"A": "02(A) 02", "B": "05(B) 05", "C": "06(C) 06", "D": "07(D) 07\nPage 21 of \n35"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 6 (Types of Penalties - Rule 6), pp. 53-55", "explanation_concept": "Rule 6 के अंतर्गत कुल 11 शास्तियाँ हैं: 6 लघु शास्तियाँ (Minor) और 5 दीर्घ शास्तियाँ (Major)।", "explanation_facts": "• 6 लघु शास्तियाँ: 1. परिनिंदा (Censure), 2. पदोन्नति रोकना, 3. वेतन से वसूली, 3(a). पास/पीटीओ रोकना, 3(b). समय-वेतनमान में निचले स्तर पर अवनति (बिना संचयी प्रभाव, अधिकतम 3 वर्ष), 4. वेतन वृद्धि रोकना।\n• 5 दीर्घ शास्तियाँ: 5. संचयी प्रभाव से अवनति, 6. निचले ग्रेड/पद पर अवनति, 7. अनिवार्य सेवानिवृत्ति, 8. सेवा से हटाना (Removal - नॉट डिस्क्वालिफाइड), 9. बर्खास्तगी (Dismissal - भविष्य में सरकारी सेवा हेतु अयोग्य)।"}, {"id": 67, "question": "Following the withdrawal of the Grade Pay ceiling limit of ₹4,200/- under the \n\"Education\" head (Item 4(1)), which rule determines the allocation \npriority for the technical/professional education scholarship scheme? \n\"शिक्षा\" हेड (आइटम 4(1)) के तहत ₹4,200/- की ग्रेड पे सीलिग लिमिट (अधिकतम सीमा) को हटाने के बाद, कौन \nसा नियम तकनीकी/प्रोफे शनल शिक्षा स्कॉलरशिप स्कीम के लिए प्राथमिकता तय करता है?", "options": {"A": "Preference is given exclusively to the wards of gazetted officers. A) सिफ़र् गजेटेड अधिकारियों के बच्चों \nको प्राथमिकता दी जाती है।", "B": "Preference is given based on higher Grade Pay rankings. B) ज़्यादा ग्रेड पे रैंकिग के आधार पर प्राथमिकता \nदी जाती है।", "C": "The scheme is open to all non-gazetted Railway Servants, with precedence given to staff in lower \nGrade Pay. C) यह स्कीम सभी नॉन-गजेटेड रेलवे कर्मचारियों के लिए है, जिसमें कम ग्रेड पे वाले कर्मचारियों को प्राथमिकता \nदी जाती है।", "D": "Funds are divided equally among all applicants regardless of Grade Pay. D) ग्रेड पे की परवाह किए \nबिना सभी आवेदकों के बीच फं ड बराबर बांटा जाता है।"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 68, "question": "Which section of the Official Language Act relates to the constitution the committee of \nparliament on Official Language? राजभाषा अधिनियम का कौन-सा खंड राजभाषा पर संसद की समिति के \nगठन से संबंधित है?", "options": {"A": "Section-3 (A) सेक्शन-3", "B": "सेक्शन-4 (B) Section-4", "C": "सेक्शन-5(C)Section-5", "D": "सेक्शन-6 (D) Section-6"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 1 (Rajbhasha) / Section 4, OL Act 1963", "explanation_concept": "संसदीय राजभाषा समिति में कुल 30 सदस्य होते हैं (20 लोकसभा + 10 राज्यसभा)। यह अपनी रिपोर्ट राष्ट्रपति को सौंपती है।", "explanation_facts": "• केंद्रीय हिंदी समिति के अध्यक्ष प्रधानमंत्री होते हैं।\n• रेलवे हिंदी सलाहकार समिति के अध्यक्ष रेल मंत्री होते हैं।"}, {"id": 69, "question": "Which of the following non-contiguous Union Territories or island administrative zones is \nuniquely classified as belonging to Region \"A\" (\"क\" क्षेत्र) under Official Language regulations? \n195. राजभाषा नियमों के तहत, निम्नलिखित में से किस गैर-संलग्न केंद्र शासित प्रदेश या द्वीप प्रशासनिक क्षेत्र को विशेष \nरूप से \"क्षेत्र 'क'\" (Region \"A\") के अंतर्गत वर्गीकृ त किया गया है?", "options": {"A": "Lakshadweep(A) लक्षद्वीप", "B": "Puducherry(B) पुडुचेरी", "C": "Andaman and Nicobar Islands(C) अंडमान और निकोबार द्वीप समूह", "D": "Daman and Diu(D) दमन और दीव"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 1 & Official Languages Rules 1976", "explanation_concept": "राजभाषा नियम 1976 के अनुसार राज्यों को तीन क्षेत्रों (क, ख, ग) में बाँटा गया है। गुजरात, महाराष्ट्र, पंजाब और चंडीगढ़ 'ख' क्षेत्र में आते हैं। अंडमान और निकोबार द्वीप समूह विशिष्ट रूप से 'क' क्षेत्र में आता है।", "explanation_facts": "• क्षेत्र 'क': बिहार, हरियाणा, हिमाचल प्रदेश, मध्य प्रदेश, राजस्थान, उत्तर प्रदेश, उत्तराखंड, झारखंड, छत्तीसगढ़, दिल्ली एवं अंडमान-निकोबार।\n• क्षेत्र 'ख': गुजरात, महाराष्ट्र, पंजाब, और यू.टी. चंडीगढ़, दमन-दीव, दादरा-नगर हवेली।\n• क्षेत्र 'ग': शेष सभी राज्य एवं संघ राज्य क्षेत्र (तमिलनाडु पर यह नियम लागू नहीं होते)।"}, {"id": 70, "question": "राजभाषा अधिनियम, 1963 की धारा 7 का संबंध निम्नलिखित में से किससे है?Section 7 of the Official \nLanguages Act ,1963 is concerned with which one of the following?", "options": {"A": "Implementation of official language in Departments (A) विभागों में राजभाषा का कार्यान्वयन", "B": "Implementation of official language in central government offices (B) केंद्र सरकार के कार्यालयों में \nराजभाषा का कार्यान्वयन", "C": "Optional use of Hindi or official language in judgement etc., of High Courts (C) उच्च न्यायालयों के \nनिर्णयों आदि में हिदी या राजभाषा का वैकल्पिक प्रयोग", "D": "Power to make rules (D) नियम बनाने की शक्ति\nPage 22 of \n35"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 1 (Rajbhasha) & OL Act 1963", "explanation_concept": "धारा 7 उच्च न्यायालयों के निर्णयों/आदेशों में हिन्दी या राज्य की राजभाषा के वैकल्पिक प्रयोग से संबंधित है।", "explanation_facts": "• राजभाषा अधिनियम 1963 में कुल 9 धाराएँ हैं।\n• धारा 3(3) 26 जनवरी 1965 से प्रभावी हुई (14 प्रकार के दस्तावेज़ द्विभाषी अनिवार्य)।\n• धारा 4: संसदीय राजभाषा समिति का गठन।"}, {"id": 71, "question": "Within what mandatory timeframe must a borrowing authority obtain a regular employee's \nformal exercise of option regarding their pay regulation (whether to draw ex-cadre scale or \nparent cadre pay plus allowance) after they join the ex-cadre post? किसी रेगुलर कर्मचारी के एक्स-\nकै डर पोस्ट पर आने के बाद, उसे अपने पे रेगुलेशन (चाहे एक्स-कै डर स्के ल या पैरेंट कै डर पे प्लस अलाउंस लेना हो) के \nबारे में ऑप्शन का फॉर्मल इस्तेमाल करने की इजाज़त कितने ज़रूरी टाइमफ्रे म के अंदर देनी होगी?", "options": {"A": "Within one month from the date of joining the ex-cadre post. A) एक्स-कै डर पोस्ट पर आने की तारीख से \nएक महीने के अंदर।", "B": "Within two months from the date of joining the ex-cadre post. B) एक्स-कै डर पोस्ट पर आने की तारीख से \nदो महीने के अंदर।", "C": "Within three months from the issuance of the initial deputation notification. C) शुरुआती डेपुटेशन \nनोटिफिके शन जारी होने के तीन महीने के अंदर।", "D": "Simultaneously on the exact date of physical reporting at the borrowing unit. D) बॉरोइंग यूनिट में \nफिजिकल रिपोटिग की सही तारीख पर ही।"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 72, "question": "If a senior employee fails a suitability test but passes it when called up again after a time lapse \nof one year, what seniority/promotion privilege are they granted over a junior who passed the \ntest earlier? अगर कोई सीनियर कर्मचारी योग्यता परीक्षा में फे ल हो जाता है, लेकिन एक साल बाद दोबारा बुलाए जाने \nपर पास हो जाता है, तो उसे उस जूनियर के मुकाबले क्या सीनियरिटी/प्रमोशन का फ़ायदा मिलता है जिसने वह परीक्षा \nपहले ही पास कर ली थी?", "options": {"A": "They are given retrospective pay arrears from the date the junior was originally promoted. A) उन्हें \nउस तारीख़ से बकाया वेतन (एरियर) दिया जाता है जिस तारीख़ को जूनियर को असल में प्रमोट किया गया था।", "B": "They must be given preference for promotion over their junior who is still waiting to be promoted \nfor want of a vacancy. B) उन्हें अपने उस जूनियर के मुकाबले प्रमोशन में प्राथमिकता दी जानी चाहिए जो अभी भी वैकें सी \nन होने के कारण प्रमोशन का इंतज़ार कर रहा है।", "C": "They forfeit their parent cadre seniority entirely and are placed at the bottom of the current select \nlist. C) वे अपनी मूल कै डर की सीनियरिटी पूरी तरह खो देते हैं और उन्हें मौजूदा सिलेक्ट लिस्ट में सबसे नीचे रखा जाता है।", "D": "They must be immediately given a proforma intermediate promotion to a selection grade post.D) \nउन्हें तुरंत सिलेक्शन ग्रेड पोस्ट पर प्रोफ़ॉर्मा इंटरमीडिएट प्रमोशन दिया जाना चाहिए।"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 5 (Leave Rules, Para 523), pp. 34-35", "explanation_concept": "LAP प्रति वर्ष 30 दिन (15-15 दिन 1 जनवरी और 1 जुलाई को) जमा होती है। अधिकतम संचय सीमा 300 + 15 दिन है।", "explanation_facts": "• स्कूल/वेकेशन स्टाफ को प्रति वर्ष केवल 10 दिन LAP मिलती है।\n• एक समय में भारत में अधिकतम 180 दिन (सामान्यतः 120 दिन) तक स्वीकृत हो सकती है।"}, {"id": 73, "question": "If a borrowing organization wishes to extend the tenure of an officer beyond the initially \nprescribed period, how many months before the expiry of the tenure must it initiate formal \naction to seek concurrence? यदि कोई उधार लेने वाला संगठन किसी अधिकारी के कार्यकाल को प्रारंभिक \nनिर्धारित अवधि से आगे बढ़ाना चाहता है, तो कार्यकाल की समाप्ति से कितने महीने पहले उसे सहमति लेने के लिए \nऔपचारिक कारर्वाई शुरू करनी होगी?", "options": {"A": "One month ए) एक महीना", "B": "Three months बी) तीन महीने", "C": "Six months सी) छह महीने", "D": "Nine months डी) नौ महीने\nPage 23 of \n35"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 74, "question": "An applicant responding to the Scouts & Guides quota advertisement presents three \nadditional certificates for participating in National Events (beyond the minimum eligibility) \nand one certificate for participating in District Rallies. According to the master circular's \nmarking evaluation parameters, what total number of marks will be awarded to this candidate \nspecifically under these two sub-categories? स्काउट्स और गाइड्स कोटा विज्ञापन के जवाब में एक आवेदक \nनेशनल इवेंट्स में भाग लेने के लिए तीन अतिरिक्त सटिफिके ट (न्यूनतम योग्यता से अधिक) और डिस्ट्रिक्ट रैलियों में भाग \nलेने के लिए एक सटिफिके ट पेश करता है। मास्टर सकु र् लर के माकिग मूल्यांकन पैरामीटर के अनुसार, इस उम्मीदवार को \nविशेष रूप से इन दो उप-श्रेणियों के तहत कु ल कितने अंक दिए जाएं गे?", "options": {"A": "10 Marks A) 10 अंक", "B": "17 Marks B) 17 अंक", "C": "20 Marks C) 20 अंक", "D": "07 Marks D) 07 अंक"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 75, "question": "Under the rules governing the recovery and adjustment of dues, what specific advance timeline \nis mandated for the Head of Office to begin assessing non-accommodation Government or \nRailway dues before an employee's superannuation? बकाया राशि की वसूली और समायोजन से जुड़े \nनियमों के तहत, किसी कर्मचारी की सेवानिवृत्ति (superannuation) से पहले, आवास-संबंधी नहीं बल्कि अन्य सरकारी \nया रेलवे बकाया राशि का आकलन शुरू करने के लिए कार्यालय प्रमुख (Head of Office) के लिए क्या समय-सीमा \nअनिवार्य है?", "options": {"A": "One year before the date on which the Railway servant is due to retire. A) रेलवे कर्मचारी के सेवानिवृत्त \nहोने की तारीख से एक साल पहले।", "B": "Eight months before the date on which the Railway servant is due to retire. B) रेलवे कर्मचारी के \nसेवानिवृत्त होने की तारीख से आठ महीने पहले।", "C": "Six months before the date on which the Railway servant is due to retire. C) रेलवे कर्मचारी के \nसेवानिवृत्त होने की तारीख से छह महीने पहले।", "D": "Three months before the date on which the Railway servant is due to retire. D) रेलवे कर्मचारी के \nसेवानिवृत्त होने की तारीख से तीन महीने पहले।"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 27 & 29 (Retirement Rules), pp. 150, 159", "explanation_concept": "सामान्य सेवानिवृत्ति आयु 60 वर्ष है (30.05.1998 से लागू)। यदि जन्मतिथि महीने की 1 तारीख है, तो सेवानिवृत्ति पिछले माह के अंतिम दिन होगी; 2 या उसके बाद होने पर उसी माह के अंतिम दिन।", "explanation_facts": "• रेलवे मेडिकल अधिकारियों (IRMS डॉक्टर्स) की सेवानिवृत्ति आयु बढ़ाकर 65 वर्ष कर दी गई है।\n• पेंशन हेतु न्यूनतम अर्हकारी सेवा 10 वर्ष तथा वीआरएस हेतु 20 वर्ष है।"}, {"id": 76, "question": "Under the 7th Central Pay Commission (CPC) framework, which specific pay level is explicitly \ndesignated for the post of Chief Office Superintendent? 7 वें केंद्रीय वेतन आयोग (CPC) के ढांचे के \nतहत, 'चीफ ऑफिस सुपरिटेंडेंट' के पद के लिए विशेष रूप से कौन सा वेतन स्तर (पे लेवल) निर्धारित किया गया है?", "options": {"A": "Level-6 A. लेवल-6", "B": "Level 5 B. लेवल-5", "C": "Level 7 C. लेवल-7", "D": "Level 8 D. लेवल-8\nPage 24 of \n35"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 77, "question": "Under Para 3(i), what is the correct delegation of powers for deciding/finalising belated \nrequests for CGA that are submitted beyond 20 years and up to 25 years from the date of \ndeath or medical invalidation? पैरा 3(i) के तहत, मृत्यु या मेडिकल आधार पर अयोग्य घोषित होने की तारीख से \n20 साल बाद और 25 साल तक जमा किए गए CGA (अनुकं पा के आधार पर नियुक्ति) के देर से आए अनुरोधों पर \nनिर्णय लेने/उन्हें अंतिम रूप देने के लिए शक्तियों का सही प्रत्यायोजन (delegation) क्या है?", "options": {"A": "DRMs / CWMs / HODs at their own level A) DRM / CWM / HOD अपने स्तर पर", "B": "General Managers at their Personal level only (cannot be delegated further) B) महाप्रबंधक (GM) \nके वल अपने व्यक्तिगत स्तर पर (इसे आगे प्रत्यायोजित नहीं किया जा सकता)", "C": "Principal Chief Personnel Officers (PCPOs) with financial concurrence C) वित्तीय सहमति के साथ \nप्रधान मुख्य कामिक अधिकारी (PCPO)", "D": "Ministry of Railways on personal recommendations of the GMs D) GM की व्यक्तिगत सिफारिशों पर रेल \nमंत्रालय"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 9 (CGA Guidelines), pp. 68-71", "explanation_concept": "अनुकंपा नियुक्ति (CGA) लेवल-1 से लेवल-6 तक DRM/CWM द्वारा तथा लेवल-7 (जैसे SSE) हेतु GM द्वारा अनुमोदित होती है। सामान्यतः लेवल-7 में CGA से बचा जाता है।", "explanation_facts": "• समय सीमा: 0-5 वर्ष: DRM/CWM; 5-20 वर्ष: GM; 20 से 25 वर्ष: GM (व्यक्तिगत स्तर पर); 25 वर्ष से अधिक: रेलवे बोर्ड।\n• विधवा को उपयुक्तता परीक्षा हेतु 4 अवसर तथा आश्रित वार्ड को 3 अवसर दिए जाते हैं।\n• नाबालिग आश्रित को बालिग होने के 2 वर्ष के भीतर आवेदन करना अनिवार्य है।"}, {"id": 78, "question": "According to Master Circular No. 36, how is the phrase \"from the date it becomes due\" legally \nconstrued for calculating the time limit of an arrear claim resulting from an official \nrepresentation or judicial intervention? मास्टर सकु र् लर नंबर 36 के अनुसार, आधिकारिक अभ्यावेदन \n(representation) या न्यायिक हस्तक्षेप के परिणामस्वरूप बकाया दावे की समय-सीमा की गणना के लिए \"जिस \nतारीख से यह देय होता है\" (from the date it becomes due) वाक्यांश का कानूनी अर्थ कै से निकाला जाता है?", "options": {"A": "The original calendar date of the month in which the employee's regular pay structure was \ndisrupted. A) उस महीने की मूल कै लेंडर तारीख जिसमें कर्मचारी का नियमित वेतन ढांचा बाधित हुआ था।", "B": "The actual physical date on which the affected employee officially registers their claim with the \nCash Section. B) वह वास्तविक तारीख जिस दिन प्रभावित कर्मचारी आधिकारिक तौर पर कै श सेक्शन में अपना दावा दर्ज \nकराता है।", "C": "The date of administrative orders issued pursuant to the directions of the Court/Tribunal or the \ndecision of the competent authority on a representation. C) कोर्ट/ट्रिब्यूनल के निर्देशों या अभ्यावेदन पर सक्षम \nप्राधिकारी के निर्णय के अनुसार जारी प्रशासनिक आदेशों की तारीख।", "D": "The first working day of the financial year succeeding the period when the monetary discrepancy \noriginally transpired. D) उस अवधि के बाद आने वाले वित्तीय वर्ष का पहला कार्य दिवस जब मौद्रिक विसंगति मूल रूप से \nहुई थी।"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 79, "question": "When compiling a standard selection panel for a normal avenue of promotion, what is the \nmaximum marks distribution framework for the factors considered by the Selection Board? . \nप्रमोशन के सामान्य तरीके के लिए एक स्टैंडर्ड सिलेक्शन पैनल बनाते समय, सिलेक्शन बोर्ड द्वारा ध्यान में रखे जाने वाले \nकारकों के लिए अधिकतम अंक वितरण का ढांचा क्या है?", "options": {"A": "Professional ability (60 marks), Record of service (20 marks), Seniority (20 marks) A) प्रोफे शनल \nक्षमता (60 अंक), सविस रिकॉर्ड (20 अंक), सीनियरिटी (20 अंक)", "B": "Professional ability (50 marks), Record of service (30 marks), Seniority (20 marks) B) प्रोफे शनल \nक्षमता (50 अंक), सविस रिकॉर्ड (30 अंक), सीनियरिटी (20 अंक)", "C": "Professional ability (50 marks), Record of service (50 marks) C) प्रोफे शनल क्षमता (50 अंक), सविस \nरिकॉर्ड (50 अंक)", "D": "Professional ability (40 marks), Record of service (30 marks), Seniority (30 marks) D) प्रोफे शनल \nक्षमता (40 अंक), सविस रिकॉर्ड (30 अंक), सीनियरिटी (30 अंक)\nPage 25 of \n35"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 80, "question": "What is the policy regarding the maximum level restriction in the Pay Matrix up to which a \nnon-gazetted Railway servant is eligible to draw monetary compensation (National Holiday \nAllowance) for attending to duties on a National Holiday? वेतन मैट्रिक्स में अधिकतम स्तर के प्रतिबंध के \nसंबंध में क्या नीति है, जिस तक एक अराजपत्रित रेलवे कर्मचारी राष्ट्रीय अवकाश पर कर्तव्यों में भाग लेने के लिए मौद्रिक \nमुआवजा (राष्ट्रीय अवकाश भत्ता) प्राप्त करने के लिए पात्र है?", "options": {"A": "Up to Level 6 in the Pay Matrix ए) वेतन मैट्रिक्स में लेवल 6 तक", "B": "Not exceeding Level 8 in the Pay Matrix बी) वेतन मैट्रिक्स में लेवल 8 से अधिक नहीं", "C": "Up to Level 10 in the Pay Matrix सी) वेतन मैट्रिक्स में लेवल 10 तक", "D": "There is no level restriction for any non-gazetted staff member डी) किसी भी अराजपत्रित स्टाफ सदस्य के \nलिए कोई स्तर प्रतिबंध नहीं है"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 81, "question": "If the training period of a direct recruit is curtailed due to administrative requirements or \nservice exigencies, how is their date of entry for seniority purposes determined? अगर प्रशासनिक \nज़रूरतों या सेवा की आपातकालीन स्थितियों के कारण किसी सीधे भर्ती किए गए कर्मचारी की ट्रेनिग की अवधि कम कर \nदी जाती है, तो सीनियरिटी के लिए उनकी सविस में शामिल होने की तारीख कै से तय की जाती है?", "options": {"A": "It is calculated from the actual date they physically reported and joined the working post early. \nA) इसकी गिनती उस असल तारीख से की जाती है जब उन्होंने फिजिकली रिपोर्ट किया और जल्दी काम संभाल लिया।", "B": "It shall be the date they would have normally come to a working post after completing the full \nprescribed training period. B) यह वह तारीख होगी जब वे तय ट्रेनिग अवधि पूरी करने के बाद सामान्य रूप से काम \nसंभालते।", "C": "It is retroactively pushed back to the first date they reported to the training institute or school. C) \nइसे पीछे की तारीख से उस दिन पर सेट किया जाता है जब उन्होंने ट्रेनिग इंस्टीट्यूट या स्कू ल में पहली बार रिपोर्ट किया था।", "D": "It is fixed from the first day of the calendar year in which their recruitment batch concluded. D) \nइसे उस कै लेंडर वर्ष के पहले दिन से तय किया जाता है जिसमें उनकी भर्ती का बैच पूरा हुआ था।"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 33 (Seniority Rules / IREM Vol-I Ch. III), pp. 173-174", "explanation_concept": "एक ही तिथि पर कार्यभार ग्रहण करने पर पदोन्नत कर्मचारी (Promotee) को सीधी भर्ती (Direct Recruit) वाले से ऊपर रखा जाता है (Alternate sequence)।", "explanation_facts": "• आरआरबी/आरआरसी के माध्यम से चयनित कर्मचारियों में यदि ट्रेनिंग अनिवार्य है, तो ट्रेनिंग स्कूल की अंतिम परीक्षा का मेरिट क्रम वरिष्ठता तय करता है।"}, {"id": 82, "question": "What is the mandatory holding period required for the full restoration of the commuted \nportion of an employee's monthly pension? कर्मचारी की मासिक पेंशन के कम्यूटेड हिस्से को पूरी तरह बहाल \nकरने के लिए ज़रूरी अनिवार्य होल्डिंग अवधि क्या है?", "options": {"A": "Ten years from the date of final superannuation A) अंतिम सेवानिवृत्ति की तारीख से दस साल", "B": "Twelve years from the date the pension payment order is issued B) पेंशन भुगतान आदेश जारी होने की \nतारीख से बारह साल", "C": "Fifteen years from the date the reduction of pension on account of commutation becomes \noperative C) कम्यूटेशन के कारण पेंशन में कटौती लागू होने की तारीख से पंद्रह साल", "D": "Twenty years from the date the lump-sum payment is credited D) एकमुश्त भुगतान जमा होने की तारीख \nसे बीस साल\nPage 26 of \n35"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 83, "question": "How is the period handled if a Railway servant, during the last ten months of service, is absent \non extraordinary leave (EOL) or is under suspension, and the period does not count as \nservice? अगर कोई रेलवे कर्मचारी अपनी सविस के आखिरी दस महीनों के दौरान एक्स्ट्राऑडिनरी लीव (EOL) पर \nरहता है या सस्पेंशन में रहता है, और उस समय को सविस में नहीं गिना जाता है, तो उस समय को कै से मैनेज किया जाता \nहै?", "options": {"A": "The period is calculated as zero pay, dropping the overall average emoluments proportionally. A) \nइस समय को ज़ीरो पे (बिना वेतन) वाला माना जाता है, जिससे कु ल औसत वेतन (एवरेज एमोल्यूमेंट्स) आनुपातिक रूप से कम \nहो जाता है।", "B": "The period is regularized retrospectively as active service by a compulsory waiver from the CPO. \nB) CPO से अनिवार्य छू ट (वेवर) लेकर इस समय को पिछली तारीख से एक्टिव सविस के तौर पर रेगुलराइज़ किया जाता है।", "C": "The period of leave or suspension is disregarded, and an equal period before the ten months is \nincluded instead. C) छु ट्टी या सस्पेंशन के समय को नज़रअंदाज़ कर दिया जाता है, और इसके बजाय दस महीनों से पहले \nकी उतनी ही अवधि को शामिल किया जाता है।", "D": "The entire ten-month block is discarded, and the average is calculated from the preceding \nfinancial year. D) पूरे दस महीने के ब्लॉक को हटा दिया जाता है, और औसत की गणना पिछले फाइनेंशियल ईयर से की \nजाती है।"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 6 (Suspension - Rules 4 & 5 / MC 64), pp. 53-54", "explanation_concept": "मास्टर सर्कुलर 64 के अनुसार निलंबन कोई दंड (Penalty) नहीं है, बल्कि एक प्रशासनिक व्यवस्था (Administrative Measure) है।", "explanation_facts": "• पुलिस हिरासत या आपराधिक मामले में 48 घंटे रहने पर माना गया निलंबन (Deemed Suspension - Rule 5(2)) लागू होता है।\n• निलंबन की पहली समीक्षा 90 दिनों के भीतर तथा विस्तार एक बार में अधिकतम 180 दिनों के लिए होता है।\n• निलंबित कर्मचारी किसी अन्य कर्मचारी का 'डिफेंस हेल्पर' बन सकता है।"}, {"id": 84, "question": "When a railway servant is judicially or administratively constrained by a pending \ndepartmental disciplinary case, what specific type of pensionary disbursement is legally \nauthorized to be sanctioned? जब कोई रेलवे कर्मचारी किसी लंबित विभागीय अनुशासनात्मक मामले के कारण \nन्यायिक या प्रशासनिक रूप से बाधित होता है, तो किस विशिष्ट प्रकार के पेंशन संवितरण को मंजूरी देने के लिए कानूनी \nरूप से अधिकृ त किया जाता है?", "options": {"A": "Absolute Pension(ए) पूर्ण पेंशन", "B": "Provisional Pension(बी) अनंतिम पेंशन", "C": "Standard Gratuity-Linked Pension(सी) मानक ग्रेच्युटी-लिक्ड पेंशन", "D": "None of these(डी) इनमें से कोई नहीं"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 85, "question": "संसद की राजभाषा समिति अपनी रिपोर्ट किसे सौंपती है?The Committee of Parliament on Official \nLanguage submits its report to whom?", "options": {"A": "Prime Minister(A) प्रधानमंत्री", "B": "राष्ट्रपति (B) President", "C": "गृह मंत्री(C) Home Minister", "D": "उपराष्ट्रपति(D) Vice President\nPage 27 of \n35"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 86, "question": "According to the joint survey guidelines, what is the mandatory minimum staff concentration \nand composition required for a divisional unit (e.g., Diesel/Electrical Loco Sheds) to engage \napprentices? 185. संयुक्त सर्वेक्षण दिशानिर्देशों के अनुसार, किसी डिवीज़नल यूनिट (जैसे, डीज़ल/इलेक्ट्रिकल लोको \nशेड) में अप्रेंटिस को शामिल करने के लिए कर्मचारियों की न्यूनतम संख्या और संरचना क्या होनी चाहिए?", "options": {"A": "200 staff members, including both skilled and unskilled categories A. 200 कर्मचारी, जिसमें कु शल और \nअकु शल दोनों तरह के कर्मचारी शामिल हों", "B": "500 staff members, based strictly on skilled strength excluding unskilled workers/supervisors B. \n500 कर्मचारी, जो पूरी तरह से कु शल कर्मचारियों की संख्या पर आधारित हों (इसमें अकु शल कर्मचारी/सुपरवाइज़र शामिल नहीं \nहैं)", "C": "500 staff members, including supervisors and skilled technicians C. 500 कर्मचारी, जिसमें सुपरवाइज़र \nऔर कु शल तकनीशियन शामिल हों", "D": "1000 staff members, covering all administrative and technical staff D. 1000 कर्मचारी, जिसमें सभी \nप्रशासनिक और तकनीकी कर्मचारी शामिल हों"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 87, "question": "what is the policy regarding the frequency of confirmation during a Railway servant's career, \nand how is confirmation affected by the availability of permanent posts? रेलवे कर्मचारी के करियर के \nदौरान कन्फर्मेशन (पक्की नियुक्ति) की फ्रीक्वेंसी के बारे में क्या पॉलिसी है, और स्थायी पदों की उपलब्धता से कन्फर्मेशन \nपर क्या असर पड़ता है?", "options": {"A": "Confirmation occurs at every promotional stage; it is strictly dependent on the availability of \npermanent posts in that specific grade. A) कन्फर्मेशन हर प्रमोशन स्टेज पर होता है; यह पूरी तरह से उस खास ग्रेड में \nस्थायी पदों की उपलब्धता पर निर्भर करता है।", "B": "Confirmation is done twice—once at entry and once upon reaching Group 'C' status; it is entirely \ndelinked from successful probation. B) कन्फर्मेशन दो बार किया जाता है—एक बार एं ट्री के समय और एक बार ग्रुप \n'C' का दर्जा मिलने पर; इसका सफल प्रोबेशन से कोई लेना-देना नहीं होता है।", "C": "Confirmation is made only once in the service of a Railway servant at the entry grade; it is \ncompletely delinked from the availability of permanent posts in the grade. C) रेलवे कर्मचारी की सविस में \nकन्फर्मेशन सिफ़र् एक बार एं ट्री ग्रेड पर किया जाता है; इसका उस ग्रेड में स्थायी पदों की उपलब्धता से कोई लेना-देना नहीं होता \nहै।", "D": "Confirmation is handled annually based on seniority; it requires an open vacancy and can be \nbypassed with a General Manager's waiver. D) कन्फर्मेशन सीनियरिटी के आधार पर सालाना किया जाता है; इसके \nलिए खुली वैकें सी की ज़रूरत होती है और जनरल मैनेजर की छू ट से इसे टाला जा सकता है।"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 2 & Ch. 34 (Master Circular 19), p. 175", "explanation_concept": "पुष्टिकरण (Confirmation) कर्मचारी के पूरे सेवाकाल में केवल एक बार एंट्री ग्रेड पर सफल परिवीक्षा (Probation) के बाद किया जाता है और यह स्थायी पदों की उपलब्धता से पूरी तरह अलग (delinked) है।", "explanation_facts": "• जूनियर अकाउंट्स असिस्टेंट्स (JAA) को कन्फर्मेशन हेतु Appendix-II-A परीक्षा पास करना अनिवार्य है।"}, {"id": 88, "question": "What is the statutory ceiling on the maximum number of continuous days of leave (of any \npermissible kind) that can be progressively sanctioned to a railway servant at a single point in \ntime? रेलवे कर्मचारी को एक बार में लगातार कितने दिनों की छु ट्टी (किसी भी स्वीकार्य प्रकार की) मंज़ूर की जा सकती \nहै, इसकी कानूनी सीमा क्या है?", "options": {"A": "One year(A) एक साल", "B": "Two years(B) दो साल", "C": "Six months(C) छह महीने", "D": "Five years(D) पाँच साल\nPage 28 of \n35"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 89, "question": "According to Para 5(iv), what is the general protocol regarding CGA into the Senior Section \nEngineer (SSE) grade (Level-7)? पैरा 5(iv) के अनुसार, सीनियर सेक्शन इंजीनियर (SSE) ग्रेड (लेवल-7) में \nCGA के लिए सामान्य प्रोटोकॉल क्या है?", "options": {"A": "It is freely permitted for any candidate holding a regular engineering diploma. A) रेगुलर इंजीनियरिग \nडिप्लोमा रखने वाले किसी भी उम्मीदवार के लिए इसकी खुली अनुमति है।", "B": "It is ordinarily to be avoided and requires a candidate to be a first-class engineering graduate, \npass a lower Group 'C' test on the first attempt, and clear an SAG Committee. B) आम तौर पर इससे बचा \nजाता है और इसके लिए उम्मीदवार का फर्स्ट-क्लास इंजीनियरिग ग्रेजुएट होना, पहले प्रयास में निचला ग्रुप 'C' टेस्ट पास करना \nऔर SAG कमेटी से मंज़ूरी लेना ज़रूरी है।", "C": "It can be sanctioned directly at the Divisional level by the DRM without referencing \nHeadquarters. C) इसे हेडक्वार्टर को भेजे बिना DRM द्वारा सीधे डिवीज़नल स्तर पर मंज़ूर किया जा सकता है।", "D": "It is completely banned across all Zonal Railways effective from 2024. D) 2024 से सभी ज़ोनल रेलवे \nमें इस पर पूरी तरह से रोक लगा दी गई है।"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 9 (CGA Guidelines), pp. 68-71", "explanation_concept": "अनुकंपा नियुक्ति (CGA) लेवल-1 से लेवल-6 तक DRM/CWM द्वारा तथा लेवल-7 (जैसे SSE) हेतु GM द्वारा अनुमोदित होती है। सामान्यतः लेवल-7 में CGA से बचा जाता है।", "explanation_facts": "• समय सीमा: 0-5 वर्ष: DRM/CWM; 5-20 वर्ष: GM; 20 से 25 वर्ष: GM (व्यक्तिगत स्तर पर); 25 वर्ष से अधिक: रेलवे बोर्ड।\n• विधवा को उपयुक्तता परीक्षा हेतु 4 अवसर तथा आश्रित वार्ड को 3 अवसर दिए जाते हैं।\n• नाबालिग आश्रित को बालिग होने के 2 वर्ष के भीतर आवेदन करना अनिवार्य है।"}, {"id": 90, "question": "Which of the following elements is strictly classified as a \"prohibited deduction\" that cannot \nbe recovered at all from a railway employee's subsistence allowance during their period of \nsuspension? इनमें से किस मद को सख्ती से \"निषिद्ध कटौती\" (prohibited deduction) के रूप में वर्गीकृ त किया \nगया है, जिसे निलंबन की अवधि के दौरान रेलवे कर्मचारी के निर्वाह भत्ते (subsistence allowance) से बिल्कु ल भी \nवसूल नहीं किया जा सकता है?", "options": {"A": "Income Tax where due A) देय आयकर (Income Tax where due)", "B": "Amounts due on court attachments B) न्यायालय द्वारा कु र्की/अटैचमेंट पर देय राशि (Amounts due on court \nattachments)", "C": "Station debits and workshop debits C) स्टेशन डेबिट और वर्क शॉप डेबिट (Station debits and workshop \ndebits)", "D": "Hospital diet charges D) अस्पताल के आहार शुल्क (Hospital diet charges)"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 6 (Subsistence Allowance, Rule 1342 R-II), p. 53", "explanation_concept": "निलंबन के प्रथम 3 माह में अंतिम प्राप्त बेसिक वेतन का 50% + आनुपातिक DA मिलता है। 3 माह बाद प्रशासनिक देरी पर 25% तक बढ़ाया (75% तक) या कर्मचारी की गलती पर 25% तक घटाया जा सकता है।", "explanation_facts": "• वर्जित कटौतियाँ: न्यायालय कुर्की (Court attachment), PF/NPS अंशदान, और निलंबन अवधि का बोनस काटना सख्त मना है।\n• अनुमत कटौतियाँ: हाउस रेंट, बिजली/पानी, रेलवे ऋण/सोसायटी कटौती।"}, {"id": 91, "question": "When an employee is irregularly retained in service beyond the age of superannuation, how \nmust the excess period of stay be finalized under the codal provisions of Rule 1801(d) R-II? जब \nकिसी कर्मचारी को रिटायरमेंट की उम्र के बाद भी सेवा में अनियमित रूप से बनाए रखा जाता है, तो नियम 1801(d) R-\nII के प्रावधानों के तहत उस अतिरिक्त समय को कै से निपटाया जाना चाहिए?", "options": {"A": "The period is treated as active re-employment, and a mandatory reference must be sent to the \nRailway Board for financial regularization. A) इस अवधि को सक्रिय पुननियुक्ति (active re-employment) \nमाना जाता है, और वित्तीय नियमितीकरण के लिए रेलवे बोर्ड को अनिवार्य रूप से रेफरेंस भेजा जाना चाहिए।", "B": "The period is regularized as extraordinary leave, allowing the employee to keep any pay and \nallowances disbursed during that timeframe. B) इस अवधि को असाधारण छु ट्टी (extraordinary leave) के रूप \nमें नियमित किया जाता है, जिससे कर्मचारी उस समय के दौरान मिले वेतन और भत्तों को अपने पास रख सकता है।", "C": "The period is treated as a minor administrative oversight, allowing the Zonal Railway to write off \nthe salary paid to avoid recovery hardships. C) इस अवधि को एक छोटी प्रशासनिक चूक माना जाता है, जिससे \nज़ोनल रेलवे वसूली की कठिनाइयों से बचने के लिए भुगतान किए गए वेतन को राइट-ऑफ (माफ़) कर सकता है।", "D": "The period is treated as completely irregular, requiring the recovery of all pay and allowances \nallowed during the over-stay, and the case must be finalized by the Railways at their own end. D) इस \nअवधि को पूरी तरह से अनियमित माना जाता है, जिसके लिए अतिरिक्त समय के दौरान दिए गए सभी वेतन और भत्तों की वसूली \nआवश्यक है, और मामले को रेलवे द्वारा अपने स्तर पर ही निपटाया जाना चाहिए।\nPage 29 of \n35"}, "answer": "D", "explanation_ref": "Establishment Book 2026, Ch. 27 & 29 (Retirement Rules), pp. 150, 159", "explanation_concept": "सामान्य सेवानिवृत्ति आयु 60 वर्ष है (30.05.1998 से लागू)। यदि जन्मतिथि महीने की 1 तारीख है, तो सेवानिवृत्ति पिछले माह के अंतिम दिन होगी; 2 या उसके बाद होने पर उसी माह के अंतिम दिन।", "explanation_facts": "• रेलवे मेडिकल अधिकारियों (IRMS डॉक्टर्स) की सेवानिवृत्ति आयु बढ़ाकर 65 वर्ष कर दी गई है।\n• पेंशन हेतु न्यूनतम अर्हकारी सेवा 10 वर्ष तथा वीआरएस हेतु 20 वर्ष है।"}, {"id": 92, "question": "Under Para 2(ii), if a widow requests that the CGA case be kept open for her minor son, what \nis the maximum time limit within which the minor son must attain majority from the date of \nthe death event? पैरा 2(ii) के तहत, अगर कोई विधवा अनुरोध करती है कि CGA के स उसके नाबालिग बेटे के लिए \nखुला रखा जाए, तो मौत की तारीख से कितने समय के भीतर नाबालिग बेटे का बालिग होना ज़रूरी है?", "options": {"A": "Within 2 years A) 2 साल के भीतर", "B": "Within 3 years B) 3 साल के भीतर", "C": "Within 5 years C) 5 साल के भीतर", "D": "Within 7 years D) 7 साल के भीतर"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 9 (CGA Guidelines), pp. 68-71", "explanation_concept": "अनुकंपा नियुक्ति (CGA) लेवल-1 से लेवल-6 तक DRM/CWM द्वारा तथा लेवल-7 (जैसे SSE) हेतु GM द्वारा अनुमोदित होती है। सामान्यतः लेवल-7 में CGA से बचा जाता है।", "explanation_facts": "• समय सीमा: 0-5 वर्ष: DRM/CWM; 5-20 वर्ष: GM; 20 से 25 वर्ष: GM (व्यक्तिगत स्तर पर); 25 वर्ष से अधिक: रेलवे बोर्ड।\n• विधवा को उपयुक्तता परीक्षा हेतु 4 अवसर तथा आश्रित वार्ड को 3 अवसर दिए जाते हैं।\n• नाबालिग आश्रित को बालिग होने के 2 वर्ष के भीतर आवेदन करना अनिवार्य है।"}, {"id": 93, "question": "If a permanent railway servant who has been selected as an apprentice is placed under \nsuspension, how is their subsistence allowance regulated? अगर किसी स्थायी रेलवे कर्मचारी को, जिसे \nअप्रेंटिस के तौर पर चुना गया है, सस्पेंड कर दिया जाता है, तो उनके निर्वाह भत्ते (subsistence allowance) का हिसाब \nकै से लगाया जाता है?", "options": {"A": "They are paid on the basis of their stipend as an apprentice. A) उन्हें अप्रेंटिस के तौर पर मिलने वाले \nस्टाइपेंड के आधार पर भुगतान किया जाता है।", "B": "They receive no allowance since apprentices are not regular employees. B) उन्हें कोई भत्ता नहीं मिलता \nक्योंकि अप्रेंटिस नियमित कर्मचारी नहीं होते हैं।", "C": "They are deemed to be reverted to their substantive posts and paid on the basis of their pay in that \nsubstantive post. C) उन्हें उनके मूल पद (substantive post) पर वापस भेजा हुआ माना जाता है और उस मूल पद के \nवेतन के आधार पर भुगतान किया जाता है।", "D": "They receive a fixed 50% of the minimum scale of the apprentice cadre. D) उन्हें अप्रेंटिस कै डर के \nन्यूनतम वेतनमान का निश्चित 50% मिलता है।"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 6 (Subsistence Allowance, Rule 1342 R-II), p. 53", "explanation_concept": "निलंबन के प्रथम 3 माह में अंतिम प्राप्त बेसिक वेतन का 50% + आनुपातिक DA मिलता है। 3 माह बाद प्रशासनिक देरी पर 25% तक बढ़ाया (75% तक) या कर्मचारी की गलती पर 25% तक घटाया जा सकता है।", "explanation_facts": "• वर्जित कटौतियाँ: न्यायालय कुर्की (Court attachment), PF/NPS अंशदान, और निलंबन अवधि का बोनस काटना सख्त मना है।\n• अनुमत कटौतियाँ: हाउस रेंट, बिजली/पानी, रेलवे ऋण/सोसायटी कटौती।"}, {"id": 94, "question": "A Government servant submits a resignation after being selected for another Government \npost. Which situation would NOT ordinarily qualify the resignation as a technical resignation \nunder the consolidated guidelines?2. एक सरकारी कर्मचारी किसी दूसरे सरकारी पद के लिए चुने जाने के बाद \nइस्तीफ़ा देता है। इनमें से कौन सी स्थिति आम तौर पर कं बाइंड गाइडलाइंस के तहत इस्तीफ़े को 'टेक्निकल इस्तीफ़ा' नहीं \nमानेगी?", "options": {"A": "The employee applied through proper channel for another Government post and was selected.A. \nकर्मचारी ने दूसरे सरकारी पद के लिए सही चैनल के ज़रिए अप्लाई किया और चुना गया।", "B": "The employee had applied for the other Government post before joining the present service, and \nsubsequently intimated the details of that application immediately after joining.B. कर्मचारी ने मौजूदा \nसविस जॉइन करने से पहले दूसरे सरकारी पद के लिए अप्लाई किया था, और जॉइन करने के तुरंत बाद उस एप्लीके शन की \nजानकारी दी।", "C": "The employee had applied for another Government post before joining the present service, but the \napplication was not routed through proper channel, and at the time of resignation he specifically \nrequests that his earlier application be treated as the basis of technical resignation.C. कर्मचारी ने मौजूदा \nसविस जॉइन करने से पहले दूसरे सरकारी पद के लिए अप्लाई किया था, लेकिन एप्लीके शन सही चैनल के ज़रिए नहीं भेजा गया \nथा, और इस्तीफ़ा देते समय वह खास तौर पर अनुरोध करता है कि उसके पहले वाले एप्लीके शन को टेक्निकल इस्तीफ़े का \nआधार माना जाए।", "D": "The accepting authority satisfies itself that, had the employee been in service on the date of \napplication, the application would have been forwarded through proper channel.D. मंज़ूरी देने वाली \nअथॉरिटी इस बात से संतुष्ट हो जाती है कि अगर कर्मचारी एप्लीके शन की तारीख को सविस में होता, तो एप्लीके शन सही चैनल \nके ज़रिए भेजा जाता।\nPage 30 of \n35"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 95, "question": "According to Part B of Master Circular No. 53, what is the uniform rate at which Family \nPension is calculated relative to an employee's basic pay, and what is its absolute upper ceiling \neffective from 01/01/2016? मास्टर सकु र् लर नंबर 53 के भाग B के अनुसार, कर्मचारी के मूल वेतन (बेसिक पे) के \nआधार पर पारिवारिक पेंशन की गणना किस समान दर से की जाती है, और 01/01/2016 से इसकी अधिकतम सीमा \n(अपर सीलिग) क्या है?", "options": {"A": "50% of basic pay; upper ceiling of Rs. 1,25,000/- per month A) मूल वेतन का 50%; अधिकतम सीमा \n₹1,25,000 प्रति माह", "B": "30% of basic pay; upper ceiling of Rs. 2,50,000/- per month B) मूल वेतन का 30%; अधिकतम सीमा \n₹2,50,000 प्रति माह", "C": "40% of basic pay; upper ceiling of Rs. 1,50,000/- per month C) मूल वेतन का 40%; अधिकतम सीमा \n₹1,50,000 प्रति माह", "D": "33% of basic pay; upper ceiling of Rs. 2,25,000/- per month D) मूल वेतन का 33%; अधिकतम सीमा \n₹2,25,000 प्रति माह"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 27 (Family Pension Rules, Rule 75), p. 152", "explanation_concept": "सामान्य पारिवारिक पेंशन मूल वेतन का 30% होती है (अधिकतम ₹75,000/- + DA)। सेवा के दौरान मृत्यु पर वर्धित पारिवारिक पेंशन (Enhanced Family Pension - 50%) 10 वर्ष तक देय है।", "explanation_facts": "• पारिवारिक पेंशन योजना 01.01.1964 से प्रारंभ हुई।\n• 01.10.2019 से 7 वर्ष की न्यूनतम सेवा की शर्त समाप्त कर दी गई है।"}, {"id": 96, "question": "If a pensionable Railway servant is under suspension and a disciplinary inquiry is actively in \nprogress against them, how must their case be handled on their due date of superannuation? \nअगर कोई पेंशन पाने वाला रेलवे कर्मचारी सस्पेंड है और उसके खिलाफ डिसिप्लिनरी जांच चल रही है, तो उसके \nसुपरएनुएशन की ड्यू डेट पर उसके के स को कै से हैंडल किया जाना चाहिए?", "options": {"A": "They must be retired on the due date of superannuation, even if the inquiries into the charges are \nstill in progress. A) उन्हें सुपरएनुएशन की ड्यू डेट पर रिटायर कर दिया जाना चाहिए, भले ही आरोपों की जांच अभी भी \nचल रही हो।", "B": "Their retirement must be automatically deferred until they are fully exonerated or penalised. B) \nजब तक वे पूरी तरह से बरी नहीं हो जाते या उन पर पेनल्टी नहीं लग जाती, तब तक उनका रिटायरमेंट ऑटोमैटिकली टाल दिया \nजाना चाहिए।", "C": "They must be summarily dismissed from service the day before their superannuation date. C) उन्हें \nसुपरएनुएशन की तारीख से एक दिन पहले सविस से तुरंत निकाल दिया जाना चाहिए।", "D": "They can only be retired if the President of India or the Minister in charge gives written \nclearance. D) उन्हें तभी रिटायर किया जा सकता है जब भारत के राष्ट्रपति या इंचार्ज मंत्री लिखित मंज़ूरी दें।"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 6 (Suspension - Rules 4 & 5 / MC 64), pp. 53-54", "explanation_concept": "मास्टर सर्कुलर 64 के अनुसार निलंबन कोई दंड (Penalty) नहीं है, बल्कि एक प्रशासनिक व्यवस्था (Administrative Measure) है।", "explanation_facts": "• पुलिस हिरासत या आपराधिक मामले में 48 घंटे रहने पर माना गया निलंबन (Deemed Suspension - Rule 5(2)) लागू होता है।\n• निलंबन की पहली समीक्षा 90 दिनों के भीतर तथा विस्तार एक बार में अधिकतम 180 दिनों के लिए होता है।\n• निलंबित कर्मचारी किसी अन्य कर्मचारी का 'डिफेंस हेल्पर' बन सकता है।"}, {"id": 97, "question": "What is the statutory limit on the Commutation of Pension allowed for a Railway servant, and \nafter how many years from the date it becomes operative will the commuted portion be fully \nrestored? एक रेलवे कर्मचारी के लिए पेंशन के संराशीकरण की वैधानिक सीमा क्या है, और इसके लागू होने की \nतारीख से कितने वर्षों के बाद संराशीकृ त भाग पूरी तरह से बहाल हो जाएगा?", "options": {"A": "An amount not exceeding 33% of pension; restored on completion of 12 years. ए) पेंशन की 33% से \nअधिक राशि नहीं; 12 वर्ष पूरे होने पर बहाल किया गया।", "B": "An amount not exceeding 50% of pension; restored on completion of 15 years. बी) पेंशन की 50% से \nअधिक राशि नहीं; 15 वर्ष पूरे होने पर बहाल किया गया।", "C": "An amount not exceeding 40% of pension; restored on completion of 15 years. सी) पेंशन की 40% \nसे अधिक राशि नहीं; 15 वर्ष पूरे होने पर बहाल किया गया।", "D": "An amount not exceeding 40% of pension; restored on completion of 10 years. डी) पेंशन की 40% से \nअधिक राशि नहीं; 10 वर्ष पूरे होने पर बहाल किया गया।\nPage 31 of \n35"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 27 (Commutation of Pension), p. 152", "explanation_concept": "रेलवे कर्मचारी अपनी मूल पेंशन का अधिकतम 40% संराशित (कम्यूट) करवा सकता है। संराशित भाग का पुनर्स्थापन (Restoration) 15 वर्ष बाद स्वतः हो जाता है।", "explanation_facts": "• सेवानिवृत्ति के 1 वर्ष के भीतर आवेदन करने पर बिना मेडिकल परीक्षण के कम्यूटेशन स्वीकृत होता है।\n• सुपरएनुएशन पर कम्यूटेशन सेवानिवृत्ति की तारीख के अगले दिन से पूरी तरह लागू (absolute) होता है।"}, {"id": 98, "question": "Under the restriction timeframes for Revision (Rule 25), what is the maximum limitation \nwindow within which an appellate authority (other than the President) can initiate a revision \nto impose or enhance a penalty to the detriment of the employee? रिविज़न (नियम 25) के लिए तय \nसमय-सीमा के तहत, वह अधिकतम समय-सीमा क्या है जिसके भीतर एक अपीलीय प्राधिकरण (राष्ट्रपति के अलावा) \nकर्मचारी के नुकसान के लिए कोई दंड लगाने या उसे बढ़ाने के लिए रिविज़न शुरू कर सकता है?", "options": {"A": "Not more than three months after the date of the order to be revised A) जिस आदेश का रिविज़न किया \nजाना है, उसकी तारीख के तीन महीने के भीतर", "B": "Not more than six months after the date of the order to be revised B) जिस आदेश का रिविज़न किया जाना \nहै, उसकी तारीख के छह महीने के भीतर", "C": "Not more than one year after the date of the order to be revised C) जिस आदेश का रिविज़न किया जाना है, \nउसकी तारीख के एक साल के भीतर", "D": "There is no restriction of any time limit for enhancing a penalty under revision D) रिविज़न के तहत \nदंड बढ़ाने के लिए समय-सीमा की कोई पाबंदी नहीं है"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 99, "question": "Which Article within Part V of the Constitution of India contains the definitive constitutional \nprovisions regulating the language to be used in the Parliament? 192. भारत के संविधान के भाग V में \nकौन-सा अनुच्छेद संसद में इस्तेमाल होने वाली भाषा को नियंत्रित करने वाले निश्चित संवैधानिक प्रावधानों को शामिल \nकरता है?", "options": {"A": "Article-125(A) अनुच्छेद-125", "B": "Article-120(B) अनुच्छेद-120", "C": "Article-126(C) अनुच्छेद-126", "D": "Article-123(D) अनुच्छेद-123"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 100, "question": "A permanent Railway servant who has completed 30 years of qualifying service may elect to \nseek voluntary retirement by giving three months' notice. However, what administrative \nrestriction applies if the employee is currently under suspension? एक स्थायी रेलवे कर्मचारी जिसने 30 \nवर्ष की अर्हक सेवा पूरी कर ली है, वह तीन महीने का नोटिस देकर स्वैच्छिक सेवानिवृत्ति लेने का विकल्प चुन सकता है। \nहालाँकि, यदि कर्मचारी वर्तमान में निलंबित है तो कौन सा प्रशासनिक प्रतिबंध लागू होता है?", "options": {"A": "The notice period is automatically extended from three months to six full months. ए) नोटिस की \nअवधि स्वचालित रूप से तीन महीने से छह पूरे महीने तक बढ़ जाती है।", "B": "The retirement is processed normally, but 50% of their gratuity is withheld until final clearance. \nबी) सेवानिवृत्ति की प्रक्रिया सामान्य रूप से की जाती है, लेकिन उनकी ग्रेच्युटी का 50% अंतिम मंजूरी तक रोक दिया जाता है।", "C": "It shall be open to the appointing authority to withhold permission to such a railway servant to \nretire. सी) नियुक्ति प्राधिकारी ऐसे रेलवे कर्मचारी को सेवानिवृत्त होने की अनुमति रोकने के लिए स्वतंत्र होगा।", "D": "The retirement notice becomes completely void ab-initio, and they must reapply after full \nreinstatement. डी) सेवानिवृत्ति नोटिस शुरू से ही पूरी तरह से शून्य हो जाता है, और उन्हें पूर्ण बहाली के बाद फिर से आवेदन \nकरना होगा।\nPage 32 of \n35"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 6 (Suspension - Rules 4 & 5 / MC 64), pp. 53-54", "explanation_concept": "मास्टर सर्कुलर 64 के अनुसार निलंबन कोई दंड (Penalty) नहीं है, बल्कि एक प्रशासनिक व्यवस्था (Administrative Measure) है।", "explanation_facts": "• पुलिस हिरासत या आपराधिक मामले में 48 घंटे रहने पर माना गया निलंबन (Deemed Suspension - Rule 5(2)) लागू होता है।\n• निलंबन की पहली समीक्षा 90 दिनों के भीतर तथा विस्तार एक बार में अधिकतम 180 दिनों के लिए होता है।\n• निलंबित कर्मचारी किसी अन्य कर्मचारी का 'डिफेंस हेल्पर' बन सकता है।"}, {"id": 101, "question": "A Government servant has acquired a lien on a post. Which of the following statements most \naccurately reflects the position regarding retention of lien? एक सरकारी कर्मचारी ने किसी पद पर लियन \n(अधिकार) हासिल कर लिया है। लियन बनाए रखने की स्थिति के बारे में नीचे दिए गए बयानों में से कौन-सा सबसे सही \nहै?", "options": {"A": "Lien automatically ceases whenever the employee proceeds on leave or is placed under \nsuspension.. जब भी कर्मचारी छु ट्टी पर जाता है या उसे सस्पेंड (निलंबित) किया जाता है, तो लियन अपने आप खत्म हो जाता \nहै।", "B": "The employee retains lien while performing the duties of the post, on foreign service, while \nholding a temporary post or officiating in another post, during leave and during suspension, subject \nto the conditions prescribed in the rules.B. नियमों में बताई गई शर्तों के अधीन, कर्मचारी पद के कर्तव्यों का पालन \nकरते समय, फॉरेन सविस (विदेश सेवा) पर रहते हुए, अस्थायी पद पर रहते हुए या किसी अन्य पद पर काम करते हुए, छु ट्टी के \nदौरान और सस्पेंशन के दौरान अपना लियन बनाए रखता है।", "C": "Once an employee holds a temporary post or officiates in another post, lien automatically \ntransfers to that temporary/officiating post.C. जैसे ही कोई कर्मचारी किसी अस्थायी पद पर होता है या किसी अन्य \nपद पर काम करता है, लियन अपने आप उस अस्थायी/कामचलाऊ पद पर ट्रांसफर हो जाता है।", "D": "A Government servant can simultaneously retain lien on two different substantive posts if both \nposts are under the Central Government.D. एक सरकारी कर्मचारी एक ही समय में दो अलग-अलग स्थायी पदों पर \nलियन बनाए रख सकता है, अगर दोनों पद केंद्र सरकार के अधीन हों।"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 41 (Lien - Rule 240/241 IREC Vol-1), pp. 206-208", "explanation_concept": "धारणाधिकार (Lien) किसी पद पर स्थायी नियुक्ति होने पर मिलता है। कर्मचारी अवकाश, निलंबन, प्रतिनियुक्ति या बाह्य सेवा के दौरान भी अपने मूल पद पर लियन बनाए रखता है।", "explanation_facts": "• एक समय में कर्मचारी का केवल एक ही स्थायी पद पर लियन हो सकता है।\n• सीधी भर्ती द्वारा अन्य विभाग में जाने पर मूल कैडर में लियन अधिकतम 2 वर्ष (विशेष परिस्थितियों में 3 वर्ष) तक सुरक्षित रहता है।"}, {"id": 102, "question": "Under the normal retirement rules, what specific standard protocol dictates the exact date of \nretirement if a Railway servant's date of birth falls on the 1st of a month? 57. सामान्य रिटायरमेंट \nनियमों के तहत, अगर किसी रेलवे कर्मचारी की जन्मतिथि महीने की 1 तारीख को आती है, तो रिटायरमेंट की सही तारीख \nतय करने के लिए कौन सा खास नियम लागू होता है?", "options": {"A": "The afternoon of the last day of that same month. A) उसी महीने के आखिरी दिन की दोपहर।", "B": "The forenoon of the first working day of the next month. B) अगले महीने के पहले कामकाजी दिन की \nसुबह।", "C": "The afternoon of the last day of the preceding month. C) पिछले महीने के आखिरी दिन की दोपहर।", "D": "The afternoon of the 15th day of that same month. D) उसी महीने के 15वें दिन की दोपहर।"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 103, "question": "Under the guidelines harmonized with the General Financial Rules (GFR 2017), what is the \nmandatory time limitation window for a Railway servant to prefer a claim for Travelling \nAllowance (TA) on tour, transfer, or retirement before it is forfeited or deemed relinquished? \nजनरल फाइनेंशियल रूल्स (GFR 2017) के साथ तालमेल बिठाते हुए बनाई गई गाइडलाइंस के तहत, टूर, ट्रांसफर या \nरिटायरमेंट पर ट्रैवलिग अलाउंस (TA) का क्लेम करने के लिए रेलवे कर्मचारी के पास कितना अनिवार्य समय होता है, \nजिसके बाद क्लेम ज़ब्त या छोड़ा हुआ मान लिया जाएगा?", "options": {"A": "Within 30 days succeeding the date of completion of the journey. A) यात्रा पूरी होने की तारीख के बाद \n30 दिनों के भीतर।", "B": "Within 60 days succeeding the date of completion of the journey. B) यात्रा पूरी होने की तारीख के बाद \n60 दिनों के भीतर।", "C": "Within 90 days succeeding the date of delivery of personal effects at the new station. C) नए स्टेशन \nपर निजी सामान पहुँचने की तारीख के बाद 90 दिनों के भीतर।", "D": "Within 1 year from the date the official journey was authorized by the Controlling Officer. D) \nकं ट्रोलिग ऑफिसर द्वारा आधिकारिक यात्रा को मंज़ूरी मिलने की तारीख से 1 साल के भीतर।\nPage 33 of \n35"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 10
