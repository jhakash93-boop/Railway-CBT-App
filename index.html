4, "question": "What is the strict statutory limitation period during which an eligible retired Railway servant \ncan submit an application to commute a percentage of their pension without being subjected to \na mandatory medical examination? वह कौन-सी सख्त कानूनी समय-सीमा है जिसके भीतर एक पात्र सेवानिवृत्त \nरेलवे कर्मचारी बिना अनिवार्य मेडिकल जांच के अपनी पेंशन का एक हिस्सा कम्यूट (एकमुश्त राशि में बदलना) करने के \nलिए आवेदन कर सकता है?", "options": {"A": "Within three months from the date of retirement A) सेवानिवृत्ति की तारीख से तीन महीने के भीतर", "B": "Within six months from the date of retirement B) सेवानिवृत्ति की तारीख से छह महीने के भीतर", "C": "Within one year from the date of retirement C) सेवानिवृत्ति की तारीख से एक साल के भीतर", "D": "Within two years from the date of retirement D) सेवानिवृत्ति की तारीख से दो साल के भीतर"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 105, "question": "When a railway servant has been placed under suspension pending an investigation in a \ndepartmental proceeding, what is the ordinary maximum duration that the total period of \nsuspension (covering both investigation and disciplinary proceedings) should not exceed? जब \nकिसी रेलवे कर्मचारी को विभागीय कार्यवाही में जांच पूरी होने तक सस्पेंड (निलंबित) किया जाता है, तो सस्पेंशन की \nकु ल अवधि (जिसमें जांच और अनुशासनात्मक कार्यवाही दोनों शामिल हैं) सामान्य तौर पर अधिकतम कितने समय से \nज़्यादा नहीं होनी चाहिए?", "options": {"A": "Three months A) तीन महीने", "B": "Six months B) छह महीने", "C": "Nine months C) नौ महीने", "D": "One year D) एक साल"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 6 (Suspension - Rules 4 & 5 / MC 64), pp. 53-54", "explanation_concept": "मास्टर सर्कुलर 64 के अनुसार निलंबन कोई दंड (Penalty) नहीं है, बल्कि एक प्रशासनिक व्यवस्था (Administrative Measure) है।", "explanation_facts": "• पुलिस हिरासत या आपराधिक मामले में 48 घंटे रहने पर माना गया निलंबन (Deemed Suspension - Rule 5(2)) लागू होता है।\n• निलंबन की पहली समीक्षा 90 दिनों के भीतर तथा विस्तार एक बार में अधिकतम 180 दिनों के लिए होता है।\n• निलंबित कर्मचारी किसी अन्य कर्मचारी का 'डिफेंस हेल्पर' बन सकता है।"}, {"id": 106, "question": "Which Standard Form (SF) must be used invariably by the disciplinary authority when issuing \na specific order to revoke a suspension? सस्पेंशन (निलंबन) रद्द करने का विशेष आदेश जारी करते समय \nअनुशासनात्मक प्राधिकरण को अनिवार्य रूप से किस स्टैंडर्ड फ़ॉर्म (SF) का उपयोग करना चाहिए?", "options": {"A": "Standard Form No. 1 (SF-1) A) स्टैंडर्ड फ़ॉर्म नंबर 1 (SF-1)", "B": "Standard Form No. 3 (SF-3) B) स्टैंडर्ड फ़ॉर्म नंबर 3 (SF-3)", "C": "Standard Form No. 4 (SF-4) C) स्टैंडर्ड फ़ॉर्म नंबर 4 (SF-4)", "D": "Standard Form No. 5 (SF-5) D) स्टैंडर्ड फ़ॉर्म नंबर 5 (SF-5)"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 6 (Standard Forms SF-1 to 14), p. 56", "explanation_concept": "D&AR के तहत: SF-1 (निलंबन आदेश), SF-2 (माना गया निलंबन), SF-3 (निर्वाह भत्ता), SF-4 (निलंबन बहाली/रद्द), SF-5 (दीर्घ शास्ति आरोप पत्र), SF-7 (जांच अधिकारी नियुक्ति), SF-8 (प्रस्तुति अधिकारी), SF-11 (लघु शास्ति आरोप पत्र)।", "explanation_facts": "• SF-11(b): लघु शास्ति में जांच कराने का प्रस्ताव।\n• SF-14: सेवानिवृत्त रेल सेवक के विरुद्ध जांच का मानक फॉर्म।"}, {"id": 107, "question": "According to Master Circular No. 37, how are Non-Selection posts fundamentally required to \nbe filled, and on what dual basis is an employee's qualification determined? मास्टर सकु र् लर नंबर 37 \nके अनुसार, नॉन-सिलेक्शन पोस्ट (गैर-चयन पद) को मूल रूप से कै से भरा जाना चाहिए, और कर्मचारी की योग्यता किस \nदोहरे आधार पर तय की जाती है?", "options": {"A": "Filled by the promotion of the senior-most suitable Railway employees; determined on the basis \nof the record of service and/or departmental tests. A) सबसे वरिष्ठ उपयुक्त रेलवे कर्मचारियों के प्रमोशन से भरा \nजाता है; सविस रिकॉर्ड और/या विभागीय परीक्षाओं के आधार पर तय होता है।", "B": "Filled by the quickest available temporary local arrangement; determined by the personal \ndiscretion of the Head of the Department. B) सबसे तेज़ी से उपलब्ध अस्थायी स्थानीय व्यवस्था से भरा जाता है; \nविभाग के प्रमुख के व्यक्तिगत विवेक से तय होता है।", "C": "Filled strictly on the basis of overall competitive merit; determined by a Limited Departmental \nCompetitive Examination (LDCE) and a viva-voce test. C) पूरी तरह से ओवरऑल कॉम्पिटिटिव मेरिट के आधार \nपर भरा जाता है; लिमिटेड डिपार्टमेंटल कॉम्पिटिटिव एग्जामिनेशन (LDCE) और वाइवा-वोस टेस्ट से तय होता है।", "D": "Filled on a strict rotational quota system among eligible branches; determined exclusively by \nlength of service in the parent unit. D) पात्र शाखाओं के बीच सख्त रोटेशनल कोटा सिस्टम पर भरा जाता है; के वल \nमूल यूनिट में सविस की अवधि से तय होता है।\nPage 34 of \n35"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 24 (Selection vs Non-Selection), pp. 134-135", "explanation_concept": "गैर-चयन (Non-Selection) पद Seniority-cum-Suitability के आधार पर 1:1 के अनुपात में भरे जाते हैं। इसके लिए 12 माह (1 वर्ष) की रिक्तियों का आकलन किया जाता है।", "explanation_facts": "• चयन पदों (Selection Posts) हेतु 15 माह की रिक्तियों का आकलन 3x पात्रता दायरे के साथ किया जाता है और पैनल वैधता 2 वर्ष होती है।"}, {"id": 108, "question": "What are the standard minimum qualifying marks prescribed for general community \ncandidates in the Practical and Oral segments, respectively, of a standard Trade Test? एक स्टैंडर्ड \nट्रेड टेस्ट के प्रैक्टिकल और ओरल हिस्सों में, जनरल कै टेगरी के कैं डिडेट्स के लिए क्रमशः कितने मिनिमम क्वालिफाइंग \nमार्क्स तय किए गए हैं?", "options": {"A": "30 marks out of 60 and 11 marks out of 40 A) 60 में से 30 मार्क्स और 40 में से 11 मार्क्स", "B": "36 marks out of 60 and 15 marks out of 40 B) 60 में से 36 मार्क्स और 40 में से 15 मार्क्स", "C": "40 marks out of 60 and 20 marks out of 40 C) 60 में से 40 मार्क्स और 40 में से 20 मार्क्स", "D": "35 marks out of 60 and 16 marks out of 40 D) 60 में से 35 मार्क्स और 40 में से 16 मार्क्स"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 24 (Trade Test / MC 43), p. 136", "explanation_concept": "ट्रेड टेस्ट में कुल 100 अंक होते हैं: प्रैक्टिकल 60 अंक (उत्तीर्णांक 36 यानी 60%) और सर्विस रिकॉर्ड 40 अंक (उत्तीर्णांक 15 यानी 37.5%); कुल उत्तीर्णांक 51% (सामान्य) एवं 41% (SC/ST) होता है।", "explanation_facts": "• 07.08.2003 से ट्रेड टेस्ट में वाइवा-वोस (मौखिक) समाप्त कर दिया गया है।"}, {"id": 109, "question": "What is the statutory ceiling on the maximum number of continuous days of leave (of any \npermissible kind) that can be progressively sanctioned to a railway servant at a single point in \ntime? 173. रेलवे कर्मचारी को एक बार में लगातार कितने दिनों की छु ट्टी (किसी भी प्रकार की स्वीकृ त छु ट्टी) दी जा \nसकती है, इसकी अधिकतम कानूनी सीमा क्या है?", "options": {"A": "One year A. एक वर्ष", "B": "Two years B. दो वर्ष", "C": "Five years C. पाँच वर्ष", "D": "Six months D. छह महीने"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 110, "question": "What are the standard percentage rates and corresponding absolute maximum monetary \nceilings prescribed for drawing Deputation (Duty) Allowance within the same station and \ninvolving a change of station, respectively? एक ही स्टेशन के भीतर और स्टेशन बदलने पर डेपुटेशन (ड्यूटी) \nअलाउंस लेने के लिए तय मानक प्रतिशत दरें और अधिकतम मौद्रिक सीमाएँ क्या हैं?", "options": {"A": "5% of basic pay subject to a maximum of Rs. 2,500 p.m., and 10% subject to a maximum of Rs. \n5,000 p.m. A) बेसिक पे का 5% (अधिकतम 2,500 रुपये प्रति माह) और 10% (अधिकतम 5,000 रुपये प्रति माह)।", "B": "7.5% of basic pay subject to a maximum of Rs. 4,500 p.m., and 12.5% subject to a maximum of \nRs. 9,000 p.m. B) बेसिक पे का 7.5% (अधिकतम 4,500 रुपये प्रति माह) और 12.5% (अधिकतम 9,000 रुपये प्रति \nमाह)।", "C": "5% of basic pay subject to a maximum of Rs. 4,500 p.m., and 10% subject to a maximum of Rs. \n9,000 p.m. C) बेसिक पे का 5% (अधिकतम 4,500 रुपये प्रति माह) और 10% (अधिकतम 9,000 रुपये प्रति माह)।", "D": "10% of basic pay subject to a maximum of Rs. 9,000 p.m., and 15% subject to a maximum of Rs. \n12,000 p.m. D) बेसिक पे का 10% (अधिकतम 9,000 रुपये प्रति माह) और 15% (अधिकतम 12,000 रुपये प्रति \nमाह)।\nPage 35 of \n35"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}]}, {"id": "os_ldce_2026", "title": "Office Superintendent (OS) LDCE", "subtitle": "Exam Date: 09-Aug-2026 Shift 1 | Set A | Level-6", "total_questions": 110, "questions": [{"id": 1, "question": "Under the Railway Leave Rules, what is the maximum admissible period of Child Care Leave \n(CCL), and who is the Lowest competent authority to sanction CCL for employees according \nto the Schedule of Powers ?/ रेलवे की छु ट्टी के नियमों के तहत, चाइल्ड के यर लीव (CCL) की अधिकतम अवधि \nक्या है, और 'शेड्यूल ऑफ़ पावर्स' के अनुसार कर्मचारियों के लिए CCL मंज़ूर करने वाला सबसे निचला सक्षम \nअधिकारी कौन है?", "options": {"A": "365 Days; Junior Scale Officer/365 दिन; कनिष्ठ स्के ल अधिकारी", "B": "730 Days; Senior Scale Officer /730 दिन; वरिष्ठ स्के ल अधिकारी", "C": "730 Days; Divisional Railway Manager (DRM) Only/730 दिन; के वल मंडल रेल प्रबंधक (DRM)", "D": "365 Days; General Manager (GM) Only/365 दिन; के वल महाप्रबंधक (GM"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 5 (Leave Rules, Para 551-E), pp. 40-41", "explanation_concept": "Child Care Leave (CCL) महिला एवं एकल पुरुष रेल कर्मचारियों को पूरे सेवाकाल में अधिकतम 730 दिन (2 वर्ष) के लिए 2 जीवित बच्चों हेतु (18 वर्ष तक, दिव्यांग बच्चों के लिए कोई आयु सीमा नहीं) देय है।", "explanation_facts": "• पहले 365 दिनों के लिए 100% वेतन और अगले 365 दिनों के लिए 80% वेतन देय (7वें CPC अनुसार)।\n• एक कैलेंडर वर्ष में अधिकतम 3 स्पेल (एकल महिला हेतु 6 स्पेल); न्यूनतम स्पेल 5 दिन का होता है।"}, {"id": 2, "question": "The Running staff may not be called to go out before availing ____ Hrs. rest unless it is \nabsolutely necessary in cse of accident and breach./ रनिग स्टाफ़ को ____ घंटे का आराम लिए बिना ड्यूटी \nपर नहीं बुलाया जा सकता, सिवाय तब जब दुर्घटना या किसी नियम के उल्लंघन की स्थिति में ऐसा करना बिल्कु ल ज़रूरी \nहो।", "options": {"A": "12 Hrs./12 घंटे", "B": "08 Hrs./08 घंटे", "C": "16 Hrs./16 घंटे", "D": "6 Hrs./06 घंटे"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 3, "question": "What does ARPAN stand for in Indian Railways?/भारतीय रेलवे में ARPAN का पूर्ण रूप क्या है?", "options": {"A": "Advanced Railway Protection Access Network", "B": "Annual Railway Pension Access Network", "C": "Advanced Railway Pension Access Network", "D": "Advanced Railway Passenger Access Network"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 4, "question": "In which of the following category, there is 100% direct recruitment/ इनमें से किस श्रेणी में 100% \nसीधी भर्ती होती है?", "options": {"A": "Staff Nurse/स्टाफ नर्स", "B": "Lab Assistant/लैब सहायक", "C": "Both/दोनों", "D": "None of these/इनमें से कोई नहीं"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 5, "question": "As per 7th CPC, ex-gratia payment amount is?/7 वें CPC के अनुसार, अनुग्रह भुगतान (ex-gratia \npayment) की राशि क्या है?", "options": {"A": "20 Lakh", "B": "10 Lakh", "C": "25 Lakh", "D": "50 Lakh\nPage 1 of \n22"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 6, "question": "For the purpose of Night Duty Allowance (NDA) in Indian Railways, a \"Full Night\" means the \nperiod between ______ to ______?/ भारतीय रेलवे में नाइट ड्यूटी भत्ता (Night Duty Allowance - NDA) \nके लिए \"पूर्ण रात्रि (Full Night)\" का अर्थ ______ से ______ तक की अवधि है?", "options": {"A": "20:00 hrs to 04:00 hrs/ 20:00 बजे से 04:00 बजे तक", "B": "22:00 hrs to 06:00 hrs/ \n22:00 बजे से 06:00 बजे तक", "C": "21:00 hrs to 05:00 hrs/ 21:00 बजे से 05:00 बजे तक", "D": "23:00 hrs to 07:00 hrs/ 23:00 बजे से 07:00 बजे तक"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 7, "question": "Minimum eductional qualification for widow in Compassionate ground appointment is?/ दया के \nआधार पर नियुक्ति के लिए विधवा की न्यूनतम शैक्षिक योग्यता क्या है?", "options": {"A": "8th pass/8वीं पास", "B": "10th pass/10 वीं पास", "C": "12th Pass/12 वीं पास", "D": "Qualification is not required./योग्यता की आवश्यकता नहीं है।"}, "answer": "D", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह या बेसिक पे का 15% (जो कम हो)।\n• विधवा पास योजना 12.03.1987 से लागू हुई।\n• ग्रुप 'C' कर्मचारी को 5 वर्ष सेवा तक 1 सेट तथा 5 वर्ष बाद 3 सेट सुविधा पास प्रतिवर्ष मिलते हैं।"}, {"id": 8, "question": "What are criteria for CGA candidate to be considered for the categroy of Station Master- \nLevel-6/स्टेशन मास्टर - लेवल-6 की कै टेगरी के लिए CGA कैं डिडेट को कं सीडर करने के क्या क्राइटेरिया हैं?", "options": {"A": "Graduate with 50% in tier I and 70% in Tier II/टियर I में 50% और टियर II में 70% के साथ ग्रेजुएट", "B": "Graduate with 50% in tier I and 60% in Tier II/टियर I में 50% और टियर II में 60% के साथ ग्रेजुएट", "C": "Graduate with 50% in tier I and 65% in Tier II/टियर I में 50% और टियर II में 65% के साथ ग्रेजुएट", "D": "None of these/इनमें से कोई नहीं"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 9 (CGA Guidelines), pp. 68-71", "explanation_concept": "अनुकंपा नियुक्ति (CGA) लेवल-1 से लेवल-6 तक DRM/CWM द्वारा तथा लेवल-7 (जैसे SSE) हेतु GM द्वारा अनुमोदित होती है। सामान्यतः लेवल-7 में CGA से बचा जाता है।", "explanation_facts": "• समय सीमा: 0-5 वर्ष: DRM/CWM; 5-20 वर्ष: GM; 20 से 25 वर्ष: GM (व्यक्तिगत स्तर पर); 25 वर्ष से अधिक: रेलवे बोर्ड।\n• विधवा को उपयुक्तता परीक्षा हेतु 4 अवसर तथा आश्रित वार्ड को 3 अवसर दिए जाते हैं।\n• नाबालिग आश्रित को बालिग होने के 2 वर्ष के भीतर आवेदन करना अनिवार्य है।"}, {"id": 9, "question": "National Pension System (NPS) was introduced from which date, and after how many years \ncan a subscriber make the first partial withdrawal? What is the maximum percentage that can \nbe withdrawn?/ राष्ट्रीय पेंशन प्रणाली (NPS) किस तिथि से लागू हुई तथा पहली आंशिक निकासी (Partial \nWithdrawal) कितने वर्ष बाद की जा सकती है? अधिकतम कितना प्रतिशत निकाला जा सकता है?", "options": {"A": "01.01.2004 – After 3 years – 25% of own contribution/01.01.2004 – 3 वर्ष बाद – स्वयं के अंशदान का 25%", "B": "01.04.2004 – After 5 years – 20% of total corpus/01.04.2004 – 5 वर्ष बाद – कु ल कॉर्पस का 20%", "C": "01.01.2005 – After 3 years – 50% of own contribution/01.01.2005 – 3 वर्ष बाद – स्वयं के अंशदान का 50%", "D": "01.04.2005 – After 10 years – 40% of total corpus/01.04.2005 – 10 वर्ष बाद – कु ल कॉर्पस का 40%"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 29 (NPS Structure), p. 160", "explanation_concept": "NPS 01.01.2004 से लागू हुआ। कर्मचारी अंशदान 10% (बेसिक + DA) तथा सरकार का अंशदान 14% है (01.04.2019 से)। सेवानिवृत्ति पर अधिकतम 60% एकमुश्त टैक्स-फ्री निकाला जा सकता है और न्यूनतम 40% वार्षिकी (Annuity) हेतु अनिवार्य है।", "explanation_facts": "• NPS का विनियामक निकाय PFRDA है।"}, {"id": 10, "question": "The Group A officers of Indian Railways are recruited through/ भारतीय रेलवे के ग्रुप ए अधिकारियों \nकी भर्ती किसके द्वारा की जाती है?", "options": {"A": "Union Public Service Commission/संघ लोक सेवा आयोग", "B": "Staff Selection Commission/कर्मचारी चयन आयोग", "C": "Combined Graduate Level Exam/संयुक्त स्नातक स्तरीय परीक्षा", "D": "None of these/इनमें से कोई नहीं\nPage 2 of \n22"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 11, "question": "What IRPSM and IREPS stand for?/IRPSM और IREPS का पूर्ण रूप क्या है?", "options": {"A": "IRPSM – Indian Railway Personnel Service Management; \nIREPS – Indian Railway Electronic Payment System", "B": "IRPSM – Integrated Railway Planning & Safety Management; \nIREPS – Indian Railway Public Service", "C": "IRPSM – Indian Railways Project Sanction Management System; \nIREPS – Indian Railways E-Procurement System", "D": "IRPSM – Indian Railway Project Monitoring Scheme; \nIREPS – Integrated Railway Engineering Procurement System"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 12, "question": "How many dependants can be included in the Privilege Pass of a Railway employee?/ रेलवे \nकर्मचारी के प्रिविलेज पास (Privilege Pass) में अधिकतम कितने आश्रित (Dependants) शामिल किए जा सकते \nहैं?", "options": {"A": "2", "B": "3", "C": "4", "D": "5"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह या बेसिक पे का 15% (जो कम हो)।\n• विधवा पास योजना 12.03.1987 से लागू हुई।\n• ग्रुप 'C' कर्मचारी को 5 वर्ष सेवा तक 1 सेट तथा 5 वर्ष बाद 3 सेट सुविधा पास प्रतिवर्ष मिलते हैं।"}, {"id": 13, "question": "The seniority of candidates recruited through RRB & Sent for Initial Training is fixed on the \nbasis of?/RRB के ज़रिए भर्ती किए गए और शुरुआती ट्रेनिग के लिए भेजे गए उम्मीदवारों की सीनियरिटी किस आधार \nपर तय की जाती है?", "options": {"A": "RRB Merit/RRB मेरिट", "B": "Date of joining working post/कार्यरत पद पर कार्यभार संभालने की तिथि", "C": "Merit at the end of Initial Training/प्रारंभिक प्रशिक्षण के अंत में योग्यता", "D": "None of these/इनमें से कोई नहीं"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 33 (Seniority Rules / IREM Vol-I Ch. III), pp. 173-174", "explanation_concept": "एक ही तिथि पर कार्यभार ग्रहण करने पर पदोन्नत कर्मचारी (Promotee) को सीधी भर्ती (Direct Recruit) वाले से ऊपर रखा जाता है (Alternate sequence)।", "explanation_facts": "• आरआरबी/आरआरसी के माध्यम से चयनित कर्मचारियों में यदि ट्रेनिंग अनिवार्य है, तो ट्रेनिंग स्कूल की अंतिम परीक्षा का मेरिट क्रम वरिष्ठता तय करता है।"}, {"id": 14, "question": "How much continuous service is required for a Casual Labourer in Open Line and Project \nareas for granting Temporary Status in Indian Railways?/ भारतीय रेलवे में कै जुअल लेबर को अस्थायी \nदर्जा (Temporary Status) प्रदान करने हेतु ओपन लाइन एवं प्रोजेक्ट में कितनी निरंतर सेवा आवश्यक है?", "options": {"A": "90 days in Open Line and 180 days in Project/ओपन लाइन में 90 दिन तथा प्रोजेक्ट में 180 दिन", "B": "120 days in Open Line and 180 days in Project/ओपन लाइन में 120 दिन तथा प्रोजेक्ट में 180 दिन", "C": "180 days in Open Line and 360 days in Project/ओपन लाइन में 180 दिन तथा प्रोजेक्ट में 360 दिन", "D": "240 days in Open Line and 360 days in Project/ओपन लाइन में 240 दिन तथा प्रोजेक्ट में 360 दिन"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 15, "question": "What is the full form of RDSO and where is its Headquarters located?/RDSO का पूर्ण रूप (Full \nForm) क्या है तथा इसका मुख्यालय (Headquarters) कहाँ स्थित है", "options": {"A": "Research Designs and Standards Organisation – Lucknow / रिसर्च डिज़ाइन्स एं ड स्टैंडड्र्स ऑर्गेनाइजेशन – \nलखनऊ", "B": "Railway Development & Safety Organisation – New Delhi / रेलवे डेवलपमेंट एं ड सेफ्टी ऑर्गेनाइजेशन – नई \nदिल्ली", "C": "Railway Design & Standard Office – Mumbai / रेलवे डिज़ाइन एं ड स्टैंडर्ड ऑफिस – मुंबई", "D": "Research Department of Safety Operations – Chennai / रिसर्च डिपार्टमेंट ऑफ सेफ्टी ऑपरेशन्स – चेन्नई\nPage 3 of \n22"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 16, "question": "Under Indian Railways rules, Transport Allowance (TA) is NOT admissible to a Railway \nemployee during leave or sick list if the absence spans_____/ भारतीय रेलवे नियमों के अनुसार, यदि कोई \nरेलवे कर्मचारी छु ट्टी (Leave) पर है या बीमार सूची (Sick List) में है, तो उसे किस स्थिति में परिवहन भत्ता \n(Transport Allowance) देय नहीं होगा?", "options": {"A": "More than 15 consecutive days/लगातार 15 दिनों से अधिक", "B": "A full calendar month/पूरा एक कै लेंडर महीना (Full Calendar Month)", "C": "More than 30 consecutive days/लगातार 30 दिनों से अधिक", "D": "More than 60 days in a calendar year/एक कै लेंडर वर्ष में 60 दिनों से अधिक"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 17, "question": "Including Dependants, how many members can be included in Privilege Pass?/ आश्रितों को \nमिलाकर, प्रिविलेज पास में कितने सदस्य शामिल किए जा सकते हैं?", "options": {"A": "5 Members/5 सदस्य", "B": "2 Members/2 सदस्य", "C": "3 Members/3 सदस्य", "D": "4 Members/4 सदस्य"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह या बेसिक पे का 15% (जो कम हो)।\n• विधवा पास योजना 12.03.1987 से लागू हुई।\n• ग्रुप 'C' कर्मचारी को 5 वर्ष सेवा तक 1 सेट तथा 5 वर्ष बाद 3 सेट सुविधा पास प्रतिवर्ष मिलते हैं।"}, {"id": 18, "question": "Factory Act come into force on _____?/फ़ै क्ट्री एक्ट कब लागू हुआ?", "options": {"A": "01.04.1944", "B": "01.04.1948", "C": "01.04.1949", "D": "01.04.1947"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 17 (Factories Act, 1948), pp. 100-102", "explanation_concept": "कारखाना अधिनियम 1948 (01.04.1949 से लागू) के तहत किसी वयस्क श्रमिक के लिए अधिकतम 48 घंटे प्रति सप्ताह और 9 घंटे प्रतिदिन कार्य निर्धारित है। 5 घंटे लगातार कार्य के बाद 30 मिनट का विश्राम अनिवार्य है।", "explanation_facts": "• क्रेच (शिशुगृह): 30 से अधिक महिला श्रमिक होने पर (धारा 48)।\n• कैंटीन: 250 से अधिक श्रमिक (धारा 46)।\n• एम्बुलेंस रूम: 500 से अधिक श्रमिक (धारा 45)।\n• सेफ्टी ऑफिसर: 1000 या अधिक श्रमिक होने पर (धारा 40B)।"}, {"id": 19, "question": "Leave on Half Average pay can be granted for _______ Months at a time./ आधी औसत वेतन वाली \nछु ट्टी एक बार में ______ महीनों के लिए दी जा सकती है।", "options": {"A": "12 Months/12 महीने", "B": "24 Months/24 महीने", "C": "6 Months/06 महीने", "D": "15 Months/15 महीने"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 5 (Leave Rules, Para 523), pp. 34-35", "explanation_concept": "LAP प्रति वर्ष 30 दिन (15-15 दिन 1 जनवरी और 1 जुलाई को) जमा होती है। अधिकतम संचय सीमा 300 + 15 दिन है।", "explanation_facts": "• स्कूल/वेकेशन स्टाफ को प्रति वर्ष केवल 10 दिन LAP मिलती है।\n• एक समय में भारत में अधिकतम 180 दिन (सामान्यतः 120 दिन) तक स्वीकृत हो सकती है।"}, {"id": 20, "question": "How many days of Ex-India Leave can be sanctioned by a JAG/SS (IC) Officer to the Non-\nGazetted (NG) staff under his control?/JAG/SS (IC) अधिकारी अपने नियंत्रणाधीन अराजपत्रित (NG) \nकर्मचारियों को कितने दिनों तक Ex-India Leave स्वीकृ त कर सकता है?", "options": {"A": "120 Days/120 दिन", "B": "45 Days/45 दिन", "C": "60 Days/60 दिन", "D": "90 Days/90 दिन"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 21, "question": "राजभाषा नियम, 1976 के अनुसार गुजरात राज्य किस क्षेत्र (Region) में शामिल है?", "options": {"A": "क्षेत्र 'क'", "B": "क्षेत्र 'ख'", "C": "क्षेत्र 'ग'", "D": "विशेष क्षेत्र\nPage 4 of \n22"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 22, "question": "What is the currency (validity) period of a Select List for Non-selection post in Indian \nRailways?/भारतीय रेलवे में नॉन-सिलेक्शन पोस्ट के लिए सिलेक्ट लिस्ट की वैधता अवधि क्या है?", "options": {"A": "6 months /6 माह", "B": "1 year /1 वर्ष", "C": "2 years /2 वर्ष", "D": "None of these/इनमें से कोई नहीं"}, "answer": "D", "explanation_ref": "Establishment Book 2026, Ch. 24 (Selection vs Non-Selection), pp. 134-135", "explanation_concept": "गैर-चयन (Non-Selection) पद Seniority-cum-Suitability के आधार पर 1:1 के अनुपात में भरे जाते हैं। इसके लिए 12 माह (1 वर्ष) की रिक्तियों का आकलन किया जाता है।", "explanation_facts": "• चयन पदों (Selection Posts) हेतु 15 माह की रिक्तियों का आकलन 3x पात्रता दायरे के साथ किया जाता है और पैनल वैधता 2 वर्ष होती है।"}, {"id": 23, "question": "What is the maximum percentage of pension that can be commuted by a Railway employee at \nthe time of retirement?/ सेवानिवृत्ति के समय रेलवे कर्मचारी अपनी पेंशन का अधिकतम कितना प्रतिशत कम्यूट \n(Commutation) कर सकता है?", "options": {"A": "0.25", "B": "0.3", "C": "0.4", "D": "0.6"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 27 & 29 (Retirement Rules), pp. 150, 159", "explanation_concept": "सामान्य सेवानिवृत्ति आयु 60 वर्ष है (30.05.1998 से लागू)। यदि जन्मतिथि महीने की 1 तारीख है, तो सेवानिवृत्ति पिछले माह के अंतिम दिन होगी; 2 या उसके बाद होने पर उसी माह के अंतिम दिन।", "explanation_facts": "• रेलवे मेडिकल अधिकारियों (IRMS डॉक्टर्स) की सेवानिवृत्ति आयु बढ़ाकर 65 वर्ष कर दी गई है।\n• पेंशन हेतु न्यूनतम अर्हकारी सेवा 10 वर्ष तथा वीआरएस हेतु 20 वर्ष है।"}, {"id": 24, "question": "What is the maximum period for which Daily Allowance (DA) under Travelling Allowance \n(TA) can be claimed by a Railway employee at one outstation during a tour?/भारतीय रेलवे में किसी \nएक बाहरी स्टेशन (Outstation) पर दौरे (Tour) के दौरान यात्रा भत्ता (TA) के अंतर्गत दैनिक भत्ता (DA) अधिकतम \nकितने दिनों तक देय होता है?", "options": {"A": "90 Days", "B": "180 Days", "C": "360 Days", "D": "120 Days"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 25, "question": "In which case of minor penalty DAR action, inquiry is necessary?/ मामूली दंड (minor penalty) \nवाले DAR मामले में किस स्थिति में जांच ज़रूरी है?", "options": {"A": "Promotion is adversly affected/प्रमोशन पर बुरा असर पड़ता है।", "B": "Pension is adversly affected/पेंशन पर बुरा असर पड़ता है।", "C": "Both A&B/A और B दोनों", "D": "None of these/इनमें से कोई नहीं"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 26, "question": "Which of the following rules under D&AR specify the penalties?/D&AR के अंतर्गत निम्नलिखित में \nसे कौन सा नियम दंड निदिष्ट करता है?", "options": {"A": "Rule 9/नियम 9", "B": "Rule 11/नियम 11", "C": "Rule 6/नियम 6", "D": "None of these/इनमें से कोई नहीं\nPage 5 of \n22"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 27, "question": "Under which provision of the Indian Railway Establishment Code (IREC), Volume-I are the \nrules relating to the Staff Benefit Fund (SBF) contained/ भारतीय रेलवे स्थापना संहिता (IREC), खंड-I \nके किस प्रावधान में Staff Benefit Fund (SBF) से संबंधित नियम दिए गए हैं?", "options": {"A": "Chapter VI / अध्याय-VI", "B": "Chapter VIII / अध्याय-VIII", "C": "Chapter X / अध्याय-X", "D": "Chapter XII / अध्याय-XII"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 22 (Staff Benefit Fund), pp. 126-127", "explanation_concept": "SBF की स्थापना 1931 में हुई। प्रतिवर्ष ₹800 प्रति कर्मचारी की दर से आवंटन किया जाता है (RBE 157/2022)। यह मुख्य रूप से अराजपत्रित कर्मचारियों एवं आरपीएफ के कल्याण हेतु है।", "explanation_facts": "• निलंबित/सेवानिवृत्त कर्मचारी SBF बैठकों में भाग नहीं ले सकते।\n• SBF बैठकों के दौरान मनोरंजन पर होने वाला खर्च SBF फंड से ही वहन किया जाता है।\n• PCPO को छात्रवृत्ति व चिकित्सा मदों को छोड़कर 25% तक पुनर्विनियोजन का अधिकार है।"}, {"id": 28, "question": "Who is the competent Authority to Sanction Special Supernumerary post at Divisional level \n?/डिविजनल लेवल पर स्पेशल सुपरन्यूमरेरी पोस्ट को मंज़ूरी देने के लिए सक्षम अधिकारी कौन है?", "options": {"A": "ADRM/अपर मंडल रेल प्रबंधक", "B": "Branch officer /शाखा अधिकारी", "C": "DRM/मंडल रेल प्रबंधक", "D": "Sr.DPO/वरिष्ठ मंडल कामिक अधिकारी"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 29, "question": "Under which rule, fixation of initial substantive pay is allowed?/ किस नियम के तहत शुरुआती मूल \nवेतन (initial substantive pay) तय करने की अनुमति है?", "options": {"A": "1313 (FR-22)", "B": "1314 (FR-22A)", "C": "1312 (FR-21)", "D": "1311 (FR-20)"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 30, "question": "As per 7th CPC, which of the following relates to drawal of pay in revised pay structure & \nexercise option./7वें CPC के अनुसार, संशोधित वेतन संरचना में वेतन लेने और विकल्प चुनने से संबंधित कौन-सी \nबात है?", "options": {"A": "Rule 3, 4/नियम 3, 4", "B": "Rule 5, 6/नियम 5,6", "C": "Rule 7, 8/नियम 7,8", "D": "Rule 10, 11/नियम 10,11"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 31, "question": "What is the minimum qualifying service and the rate of Compassionate Allowance admissible \nto a railway servant who is removed or dismissed from service?/ प्रश्न: रेलवे सेवा से पदच्युत \n(Dismissed) या सेवा से हटाए गए (Removed) कर्मचारी को अनुकं पा भत्ता (Compassionate Allowance) \nप्रदान करने हेतु न्यूनतम अर्हकारी सेवा तथा देय अनुकं पा भत्ते की अधिकतम दर क्या है?", "options": {"A": "5 years qualifying service and 50% of pension/5 वर्ष की अर्हकारी सेवा तथा पेंशन का 50%", "B": "10 years qualifying service and up to 2/3 (66 ⅔%) of pension/gratuity admissible on \ncompensation pension/10 वर्ष की अर्हकारी सेवा तथा क्षतिपूति पेंशन (Compensation Pension) पर देय \nपेंशन/ग्रेच्युटी का अधिकतम 2/3 (66⅔%)", "C": "15 years qualifying service and 75% of pension/15 वर्ष की अर्हकारी सेवा तथा पेंशन का 75%", "D": "20 years qualifying service and 100% of pension/20 वर्ष की अर्हकारी सेवा तथा पेंशन का 100%\nPage 6 of \n22"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह या बेसिक पे का 15% (जो कम हो)।\n• विधवा पास योजना 12.03.1987 से लागू हुई।\n• ग्रुप 'C' कर्मचारी को 5 वर्ष सेवा तक 1 सेट तथा 5 वर्ष बाद 3 सेट सुविधा पास प्रतिवर्ष मिलते हैं।"}, {"id": 32, "question": "What percentage of surrender money value should be sent to Rly Board vacancy Bank as per \nnormal surrender post? / सामान्य सरेंडर पोस्ट के अनुसार, सरेंडर मनी वैल्यू का कितना प्रतिशत रेलवे बोर्ड वैकें सी \nबैंक को भेजा जाना चाहिए?", "options": {"A": "0.1", "B": "0.15", "C": "0.25", "D": "0.5"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 33, "question": "In which year was the Family Pension Scheme introduced for Central Government employees, \nincluding Indian Railways?/ केंद्रीय सरकारी कर्मचारियों, जिनमें भारतीय रेलवे के कर्मचारी भी शामिल हैं, के लिए \nपरिवार पेंशन योजना (Family Pension Scheme) किस वर्ष प्रारंभ की गई थी?", "options": {"A": "1956", "B": "1967", "C": "1964", "D": "1986"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 27 (Family Pension Rules, Rule 75), p. 152", "explanation_concept": "सामान्य पारिवारिक पेंशन मूल वेतन का 30% होती है (अधिकतम ₹75,000/- + DA)। सेवा के दौरान मृत्यु पर वर्धित पारिवारिक पेंशन (Enhanced Family Pension - 50%) 10 वर्ष तक देय है।", "explanation_facts": "• पारिवारिक पेंशन योजना 01.01.1964 से प्रारंभ हुई।\n• 01.10.2019 से 7 वर्ष की न्यूनतम सेवा की शर्त समाप्त कर दी गई है।"}, {"id": 34, "question": "How many PNM meetings with each Unions are held in a year at Divisional Level?/ डिविजनल \nलेवल पर हर यूनियन के साथ साल में कितनी PNM बैठकें होती हैं?", "options": {"A": "2", "B": "3", "C": "6", "D": "8"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 35, "question": "संसद की राजभाषा समिती में कितने लोकसभा सदस्य होंगे?", "options": {"A": "20", "B": "10", "C": "30", "D": "40"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 36, "question": "Settlement Dues Payment in cases of Voluntary Retirement (VR), Death, and Resignation (For \nNon-Disputed cases only) should be finalized within what period as per the Charter of \nCommitment?/'कमिटमेंट चार्टर' के अनुसार, स्वैच्छिक सेवानिवृत्ति (VR), मृत्यु और इस्तीफ़े के मामलों में (के वल \nबिना विवाद वाले मामलों के लिए) सेटलमेंट की बकाया राशि का भुगतान कितने समय के भीतर पूरा हो जाना चाहिए?", "options": {"A": "120 Days/120 दिन", "B": "45 Days/45 दिन", "C": "60 Days/60 दिन", "D": "90 Days/90 दिन"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 27 & 29 (Retirement Rules), pp. 150, 159", "explanation_concept": "सामान्य सेवानिवृत्ति आयु 60 वर्ष है (30.05.1998 से लागू)। यदि जन्मतिथि महीने की 1 तारीख है, तो सेवानिवृत्ति पिछले माह के अंतिम दिन होगी; 2 या उसके बाद होने पर उसी माह के अंतिम दिन।", "explanation_facts": "• रेलवे मेडिकल अधिकारियों (IRMS डॉक्टर्स) की सेवानिवृत्ति आयु बढ़ाकर 65 वर्ष कर दी गई है।\n• पेंशन हेतु न्यूनतम अर्हकारी सेवा 10 वर्ष तथा वीआरएस हेतु 20 वर्ष है।"}, {"id": 37, "question": "Who is the authority to change recruitment rules in Railway?/ रेलवे में भर्ती के नियमों में बदलाव करने \nका अधिकार किसके पास है?", "options": {"A": "GM/महाप्रबंधक", "B": "RRB/रेलवे भर्ती बोर्ड", "C": "Railway Board/रेलवे बोर्ड", "D": "None of these/इनमें से कोई नहीं\nPage 7 of \n22"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 38, "question": "Level ______ Officers are entitled for First Class-A On Duty pass with 1-AC Authority/ लेवल \n______ के अधिकारी 1-AC अथॉरिटी के साथ फर्स्ट क्लास-A ऑन ड्यूटी पास के हकदार हैं", "options": {"A": "9", "B": "12", "C": "11", "D": "10"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह या बेसिक पे का 15% (जो कम हो)।\n• विधवा पास योजना 12.03.1987 से लागू हुई।\n• ग्रुप 'C' कर्मचारी को 5 वर्ष सेवा तक 1 सेट तथा 5 वर्ष बाद 3 सेट सुविधा पास प्रतिवर्ष मिलते हैं।"}, {"id": 39, "question": "When was the UMID card scheme introduced on Indian Railways?/ भारतीय भारतीय रेलवे में UMID \nकार्ड योजना कब शुरू की गई थी?", "options": {"A": "2018", "B": "2019", "C": "2020", "D": "none of these / इनमें से कोई नहीं"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 40 (IT Applications - UMID), p. 194", "explanation_concept": "UMID (Unique Medical Identity Card) की शुरुआत 2019 में हुई। यह रेलवे कर्मचारियों, पेंशनरों और पात्र आश्रितों को कैशलेस चिकित्सा उपचार प्रदान करने हेतु स्मार्ट मेडिकल आईडी कार्ड है।", "explanation_facts": "• UMID कार्ड में बायोमेट्रिक, विशिष्ट चिकित्सा पात्रता तथा आश्रितों का विवरण शामिल होता है।"}, {"id": 40, "question": "In Continuous roster, 'Long on' means period of duty over ______ hrs./ कं टीन्यूअस रोस्टर में, 'लॉन्ग \nऑन' का मतलब ______ घंटे से ज़्यादा की ड्यूटी अवधि है।", "options": {"A": "8 Hrs", "B": "10 Hrs", "C": "12 Hrs", "D": "15 Hrs"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 41, "question": "Anticipated vacancies for next ____ months is considered for Selection Post./ सिलेक्शन पोस्ट के \nलिए अगले ____ महीनों में संभावित रिक्तियों पर विचार किया जाता है।", "options": {"A": "15 Months/15 महीने", "B": "12 Months/12 महीने", "C": "24 Months/24 महीने", "D": "None of these/इनमें से कोई नहीं"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 42, "question": "In the selection for a Non-Safety Category post in Indian Railways, SC/ST candidates must \nsecure at least what percentage of marks to be considered under the \"Best Among the Failures \nScheme\" ?/भारतीय रेल में Non-Safety Category पदों के चयन में, SC/ST अभ्यथियों को \"Best Among the \nFailures Scheme\" सिद्धांत के अंतर्गत विचार किए जाने के लिए न्यूनतम कितने प्रतिशत अंक प्राप्त करना आवश्यक \nहै?", "options": {"A": "10% /10 प्रतिशत", "B": "20% /20 प्रतिशत", "C": "30% /30 प्रतिशत", "D": "40% /40 प्रतिशत"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 43, "question": "As per classification of Capital & Work Expenditure, Plan Head for Staff Welfare is ?/ पूंजी और \nकार्य व्यय के वर्गीकरण के अनुसार, कर्मचारी कल्याण के लिए योजना मद (Plan Head) क्या है?", "options": {"A": "42", "B": "51", "C": "53", "D": "61\nPage 8 of \n22"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 44, "question": "(A) As per the old pension scheme, the minimum monthly pension payable as per 7th CPC is \nRs. 9000/-. \n(B) The amount of pension shall not be less than 50% of the last month's pay at the time of \nretirement or the average of last 10 month's pay, whichever is more. \n/\"(A) पुरानी पेंशन योजना के अनुसार, 7वें CPC के तहत मिलने वाली न्यूनतम मासिक पेंशन ₹9,000 है। \n(B) पेंशन की राशि रिटायरमेंट के समय पिछले महीने के वेतन के 50% या पिछले 10 महीनों के वेतन के औसत, इनमें \nसे जो भी ज़्यादा हो, उससे कम नहीं होगी।\"", "options": {"A": "Only (A) is correct/के वल (A) सही है।", "B": "Only (B) is correct/के वल (B) सही है।", "C": "Both (A) & (B) are correct/(A) और (B) दोनों सही हैं।", "D": "Both (A) & (B) are wrong/(A) और (B) दोनों गलत हैं।"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 45, "question": "Compassionate Ground Appointment (CGA) is offered against which quota?/ अनुकं पा नियुक्ति \n(CGA) किस कोटे के अंतर्गत प्रदान की जाती है?", "options": {"A": "Promotion Quota/पदोन्नति कोटा", "B": "Direct Recruitment Quota/सीधी भर्ती कोटा", "C": "Cultural Quota/सांस्कृ तिक कोटा", "D": "Sports Quota/खेल कोटा"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह या बेसिक पे का 15% (जो कम हो)।\n• विधवा पास योजना 12.03.1987 से लागू हुई।\n• ग्रुप 'C' कर्मचारी को 5 वर्ष सेवा तक 1 सेट तथा 5 वर्ष बाद 3 सेट सुविधा पास प्रतिवर्ष मिलते हैं।"}, {"id": 46, "question": "how many years old Compassionate Ground Appointment (CGA) cases can be sanctioned by \nDRM/CWM?/DRM/CWM द्वारा कितने वर्ष पुराने अनुकं पा नियुक्ति (CGA) मामलों को स्वीकृ त किया जा सकता \nहै?", "options": {"A": "Up to 25 years/25 वर्ष तक", "B": "Up to 10 years/10 वर्ष तक", "C": "Up to 15 years/15 वर्ष तक", "D": "Up to 20 years/20 वर्ष तक"}, "answer": "D", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह या बेसिक पे का 15% (जो कम हो)।\n• विधवा पास योजना 12.03.1987 से लागू हुई।\n• ग्रुप 'C' कर्मचारी को 5 वर्ष सेवा तक 1 सेट तथा 5 वर्ष बाद 3 सेट सुविधा पास प्रतिवर्ष मिलते हैं।"}, {"id": 47, "question": "Leave Note Due' may be granted to a permanent Railway servant subject to the condition that \n(A) It shall be limited to LHAP he/she is likely to ear thereafter; \n(B) 'Leave Note Due' during the entire service shall be limited to a maximum of 365 days on \nmedical certificate. \n/स्थायी रेलवे कर्मचारी को 'लीव नॉट ड्यू' (Leave Not Due) इस शर्त पर दी जा सकती है कि: \n(A) यह उस LHAP (अर्ध-वेतन अवकाश) तक सीमित होगी जो उसे भविष्य में मिलने की संभावना है; \n(B) पूरी सेवा के दौरान 'लीव नॉट ड्यू' मेडिकल सटिफिके ट के आधार पर अधिकतम 365 दिनों तक सीमित होगी।", "options": {"A": "Only (A) is correct/के वल (A) सही है।", "B": "Only (B) is correct/के वल (B) सही है।", "C": "Both (A) & (B) are correct/(A) और (B) दोनों सही हैं।", "D": "Both (A) & (B) are wrong/(A) और (B) दोनों गलत हैं।\nPage 9 of \n22"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 5 (Leave Rules, Para 526), pp. 34-35", "explanation_concept": "LHAP प्रति वर्ष 20 दिन की दर से (10-10 दिन 1 जनवरी और 1 जुलाई को अग्रिम) खाते में जमा होती है। संचय (accumulation) की कोई अधिकतम सीमा नहीं है।", "explanation_facts": "• 2 दिन की LHAP को मेडिकल सर्टिफिकेट पर 1 दिन की कम्यूटेड लीव (पूर्ण वेतन पर) में बदला जा सकता है।\n• एक बार में अधिकतम 24 माह तक स्वीकृत की जा सकती है।"}, {"id": 48, "question": "Which standard form is used for the appointment of inquiry officer under Railway Servants \n(D&AR) Rules?/रेलवे कर्मचारी (D&AR) नियमों के तहत जांच अधिकारी की नियुक्ति के लिए किस मानक प्रपत्र \n(standard form) का उपयोग किया जाता है?", "options": {"A": "SF-3", "B": "SF-4", "C": "SF-5", "D": "SF-7"}, "answer": "D", "explanation_ref": "Establishment Book 2026, Ch. 6 (Standard Forms SF-1 to 14), p. 56", "explanation_concept": "D&AR के तहत: SF-1 (निलंबन आदेश), SF-2 (माना गया निलंबन), SF-3 (निर्वाह भत्ता), SF-4 (निलंबन बहाली/रद्द), SF-5 (दीर्घ शास्ति आरोप पत्र), SF-7 (जांच अधिकारी नियुक्ति), SF-8 (प्रस्तुति अधिकारी), SF-11 (लघु शास्ति आरोप पत्र)।", "explanation_facts": "• SF-11(b): लघु शास्ति में जांच कराने का प्रस्ताव।\n• SF-14: सेवानिवृत्त रेल सेवक के विरुद्ध जांच का मानक फॉर्म।"}, {"id": 49, "question": "What is the percentage of reservation for Economically Weaker Sections (EWS) in Direct \nRecruitment in Indian Railways?/ भारतीय रेलवे में प्रत्यक्ष भर्ती (Direct Recruitment) में आथिक रूप से \nकमजोर वर्ग (EWS) के लिए आरक्षण का प्रतिशत कितना है?", "options": {"A": "0.05", "B": "0.1", "C": "0.15", "D": "0.075"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 50, "question": "An unmarried Railway employee is eligible for Child Care Leave (CCL) under which of the \nfollowing conditions/ अविवाहित (Unmarried) रेल कर्मचारी निम्नलिखित में से किन परिस्थितियों में Child \nCare Leave (CCL) प्राप्त करने का पात्र है? \nA. An unmarried Railway employee is eligible for CCL for taking care of a legally adopted \nchild./अविवाहित रेल कर्मचारी विधिवत गोद लिए गए बच्चे की देखभाल के लिए CCL का पात्र है। \nB. An unmarried Railway employee is eligible for CCL if he/she is a single parent/legal \nguardian of the child, subject to the prescribed rules./ यदि अविवाहित रेल कर्मचारी बच्चे का एकल \nअभिभावक (Single Parent) या विधिक संरक्षक (Legal Guardian) है, तो वह निर्धारित नियमों के अधीन CCL \nका पात्र है।", "options": {"A": "Only Statement A is Correct /के वल कथन A सही है", "B": "Only Statement B is Correct /के वल कथन B सही है", "C": "Both A and B are Correct /कथन A एवं B दोनों सही हैं", "D": "Neither A nor B is Correct /A और B दोनों गलत हैं"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 5 (Leave Rules, Para 551-E), pp. 40-41", "explanation_concept": "Child Care Leave (CCL) महिला एवं एकल पुरुष रेल कर्मचारियों को पूरे सेवाकाल में अधिकतम 730 दिन (2 वर्ष) के लिए 2 जीवित बच्चों हेतु (18 वर्ष तक, दिव्यांग बच्चों के लिए कोई आयु सीमा नहीं) देय है।", "explanation_facts": "• पहले 365 दिनों के लिए 100% वेतन और अगले 365 दिनों के लिए 80% वेतन देय (7वें CPC अनुसार)।\n• एक कैलेंडर वर्ष में अधिकतम 3 स्पेल (एकल महिला हेतु 6 स्पेल); न्यूनतम स्पेल 5 दिन का होता है।"}, {"id": 51, "question": "Participation in illegal strike by employees is tantamount to a break in service and it can be \ncondoned only by the _______/कर्मचारियों द्वारा गैर-कानूनी हड़ताल में भाग लेना सेवा में रुकावट के समान है और \nइसे के वल _______ द्वारा ही माफ किया जा सकता है।", "options": {"A": "General Manager/महाप्रबंधक", "B": "Railway Board/रेलवे बोर्ड", "C": "President/राष्ट्रपति", "D": "None of these/इनमें से कोई नहीं\nPage 10 of \n22"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 52, "question": "In the HRMS Pass Module, what happens to an issued e-Pass/PTO if Booked train Ticket is \ncancelled by the employee? /HRMS पास मॉड्यूल में, अगर कर्मचारी बुक किया हुआ ट्रेन टिकट कैं सिल कर देता \nहै, तो जारी किए गए ई-पास/PTO का क्या होता है?", "options": {"A": "The Pass is automatically restored / पास अपने आप पुनः बहाल हो जाता है", "B": "The Pass UPN (Unique Pass Number) must be manually re-activated/unlocked via the HRMS portal \n/ एचआरएमएस पोर्टल के माध्यम से पास यूपीएन को मैन्युअल रूप से पुन: सक्रिय/अनलॉक करना होगा", "C": "The Pass lapses and cannot be used again / पास समाप्त हो जाता है और इसे दोबारा उपयोग नहीं किया जा सकता है", "D": "The employee must apply for a new Pass from the Pass Clerk / कर्मचारी को पास क्लर्क से नए पास के लिए \nआवेदन करना होगा"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह या बेसिक पे का 15% (जो कम हो)।\n• विधवा पास योजना 12.03.1987 से लागू हुई।\n• ग्रुप 'C' कर्मचारी को 5 वर्ष सेवा तक 1 सेट तथा 5 वर्ष बाद 3 सेट सुविधा पास प्रतिवर्ष मिलते हैं।"}, {"id": 53, "question": "Who designed and developed the HRMS application for Indian Railways?/ भारतीय रेलवे के लिए \nHRMS एप्लिके शन को किस ने डिज़ाइन और विकसित किया है?", "options": {"A": "CRIS (Centre for Railway Information Systems) / क्रिस (सेंटर फॉर रेलवे इंफॉर्मेशन सिस्टम्स)", "B": "IRCTC / आईआरसीटीसी", "C": "NIC (National Informatics Centre) / एनआईसी (राष्ट्रीय सूचना विज्ञान केंद्र)", "D": "RVNL / आरवीएनएल"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 40 (IT Applications - HRMS), p. 194", "explanation_concept": "HRMS (Human Resource Management System) का विकास CRIS द्वारा किया गया है। यह रेलवे कर्मचारियों के संपूर्ण सेवा प्रबंधन और ई-पास/लीव/एपीएआर हेतु ऑनलाइन पोर्टल है।", "explanation_facts": "• CRIS की स्थापना 1986 में हुई, मुख्यालय चाणक्यपुरी, नई दिल्ली में है।\n• HRMS ई-पास/पीटीओ मॉड्यूल 10 अगस्त 2022 से पूरे भारतीय रेल में पूर्णतः लागू है।"}, {"id": 54, "question": "How many MACPs can be granted to a Railway Employee during entire service/ रेलवे कर्मचारी ment, Training etc.' is available in which of the \nfollowing code/manual /' भर्ती, प्रशिक्षण आदि' से संबंधित अध्याय निम्नलिखित में से किस कोड/मैनुअल में \nउपलब्ध है?", "options": {"A": "IREM-I/भारतीय रेलवे स्थापना नियमावली-I", "B": "IREM-II/भारतीय रेलवे स्थापना नियमावली-II", "C": "IREC-I/भारतीय रेल स्थापना कोड-I", "D": "IREC-II/भारतीय रेल स्थापना कोड-II"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 71, "question": "संविधान के भाग XVII मे कितने अनुच्छेद है?", "options": {"A": "14", "B": "15", "C": "36", "D": "9\nPage 14 of \n22"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 72, "question": "Consider following statements and choose correct option. \nA. APAR has to be written for Level 1 employee in specified standard form. \nB. NPA is not a special pay./नीचे दिए गए कथनों पर विचार करें और सही विकल्प चुनें। \nA. लेवल 1 के कर्मचारी के लिए APAR एक तय स्टैंडर्ड फ़ॉर्म में लिखा जाना चाहिए। \nB. NPA कोई स्पेशल पे नहीं है।", "options": {"A": "A and B both are true/A और B दोनों सही हैं।", "B": "A and B both are false./A और B दोनों गलत हैं।", "C": "A is true but B is false/A सही है लेकिन B गलत है।", "D": "A is false but B is true./A गलत है लेकिन B सही है।"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 6 (Standard Forms SF-1 to 14), p. 56", "explanation_concept": "D&AR के तहत: SF-1 (निलंबन आदेश), SF-2 (माना गया निलंबन), SF-3 (निर्वाह भत्ता), SF-4 (निलंबन बहाली/रद्द), SF-5 (दीर्घ शास्ति आरोप पत्र), SF-7 (जांच अधिकारी नियुक्ति), SF-8 (प्रस्तुति अधिकारी), SF-11 (लघु शास्ति आरोप पत्र)।", "explanation_facts": "• SF-11(b): लघु शास्ति में जांच कराने का प्रस्ताव।\n• SF-14: सेवानिवृत्त रेल सेवक के विरुद्ध जांच का मानक फॉर्म।"}, {"id": 73, "question": "During the entire service how many occasions can a Railway employee avail Leave encashment \n?/पूरी सविस के दौरान एक रेलवे कर्मचारी कितनी बार लीव एनकै शमेंट ले सकता है?", "options": {"A": "4 time", "B": "5 time", "C": "6 time", "D": "8 time"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 5 (Leave Encashment Rules), pp. 44-45", "explanation_concept": "सेवा के दौरान पूरे सेवाकाल में अधिकतम 60 दिन (एक बार में 10 दिन) का नकदीकरण पास/पीटीओ के साथ लिया जा सकता है, दो नकदीकरणों के बीच न्यूनतम 2 वर्ष का अंतर अनिवार्य है तथा खाते में न्यूनतम 30 दिन LAP शेष रहनी चाहिए।", "explanation_facts": "• सेवानिवृत्ति/मृत्यु पर अधिकतम 300 दिन (LAP + LHAP मिलाकर) का नकदीकरण मिलता है।\n• त्यागपत्र (Resignation) देने पर अधिकतम 150 दिन की LAP का नकदीकरण अनुमन्य है।"}, {"id": 74, "question": "The family of a Railway Servant, dies while in service may be permitted to retain a Railway \nquarter on payment of normal rent for a maximum period of ______ months, if he/she does not \nown a house at the place of posting./ अगर नौकरी के दौरान किसी रेलवे कर्मचारी की मौत हो जाती है, तो उसके \nपरिवार को ज़्यादा से ज़्यादा ______ महीनों तक सामान्य किराया देकर रेलवे क्वार्टर में रहने की इजाज़त दी जा सकती है, \nबशर्ते पोस्टिंग वाली जगह पर उनका अपना कोई घर न हो।", "options": {"A": "6 Months/6 महीने", "B": "12 Months/12 महीने", "C": "24 Months/24 महीने", "D": "None of these/इनमें से कोई नहीं"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अ  for ____ sets of Privilege \nPass/05 साल की सेवा पूरी होने के बाद, लेवल-1 के कर्मचारी ____ सेट प्रिविलेज पास के लिए पात्र होते हैं।", "options": {"A": "2 Sets", "B": "1 Set", "C": "3 Sets", "D": "4 Sets"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह या बेसिक पे का 15% (जो कम हो)।\n• विधवा पास योजना 12.03.1987 से लागू हुई।\n• ग्रुप 'C' कर्मचारी को 5 वर्ष सेवा तक 1 सेट तथा 5 वर्ष बाद 3 सेट सुविधा पास प्रतिवर्ष मिलते हैं।"}, {"id": 79, "question": "How many times is the Colony Inspection Group (CIG) meeting/inspection required to be \nconducted at the Divisional level in one year in Indian Railways?/ भारतीय रेलवे में मंडल स्तर \n(Divisional Level) पर कॉलोनी निरीक्षण समूह (CIG) की बैठक/निरीक्षण एक वर्ष में कितनी बार आयोजित किया \nजाना आवश्यक है?", "options": {"A": "Once a year/वर्ष में एक बार", "B": "Twice a year/वर्ष में दो बार", "C": "Three times a year/वर्ष में तीन बार", "D": "Four times a year (once every three months)/वर्ष में चार बार (प्रत्येक तीन माह में एक बार"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 80, "question": "Howmany pay matrix level are there as per 7th CPC, and what is minimum basic pay in Level-\n2/7वें CPC के अनुसार पे मैट्रिक्स में कितने लेवल हैं और लेवल-2 में न्यूनतम बेसिक पे क्या है?", "options": {"A": "15 & \nRs. 29900/-", "B": "18 & \nRs. 19900/-", "C": "17 & \nRs. 19900/-", "D": "None of the above.\nPage 16 of \n22"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 81, "question": "In the case of voluntary retirement on medical grounds by a medically decategorised Railway \nemployee, the ward is eligible for compassionate appointment only if the employee has a \nminimum of ______ years of service left before the date of superannuation. The ward is \neligible for appointment up to which Pay Level/ चिकित्सकीय रूप से अयोग्य (Medically \nDecategorised) घोषित रेल कर्मचारी द्वारा चिकित्सीय आधार पर स्वैच्छिक सेवानिवृत्ति (Voluntary Retirement) \nलेने की स्थिति में, आश्रित (Ward) की नियुक्ति तभी की जा सकती है जब कर्मचारी की सेवानिवृत्ति की तिथि तक कम \nसे कम ______ वर्ष की सेवा शेष हो। ऐसे आश्रित को अधिकतम किस Pay Level में नियुक्ति दी जा सकती है?", "options": {"A": "2 years service remaining and appointment up to Level-2/2 वर्ष की शेष सेवा तथा अधिकतम Level-2 में \nनियुक्ति", "B": "3 years service remaining and appointment up to Level-1/3 वर्ष की शेष सेवा तथा अधिकतम Level-1 में \nनियुक्ति", "C": "5 years service remaining and appointment up to Level-2/5 वर्ष की शेष सेवा तथा अधिकतम Level-2 में \nनियुक्ति", "D": "5 years service remaining and appointment up to Level-1 /5 वर्ष की शेष सेवा तथा अधिकतम Level-1 में \nनियुक्ति"}, "answer": "D", "explanation_ref": "Establishment Book 2026, Ch. 27 & 29 (Retirement Rules), pp. 150, 159", "explanation_concept": "सामान्य सेवानिवृत्ति आयु 60 वर्ष है (30.05.1998 से लागू)। यदि जन्मतिथि महीने की 1 तारीख है, तो सेवानिवृत्ति पिछले माह के अंतिम दिन होगी; 2 या उसके बाद होने पर उसी माह के अंतिम दिन।", "explanation_facts": "• रेलवे मेडिकल अधिकारियों (IRMS डॉक्टर्स) की सेवानिवृत्ति आयु बढ़ाकर 65 वर्ष कर दी गई है।\n• पेंशन हेतु न्यूनतम अर्हकारी सेवा 10 वर्ष तथा वीआरएस हेतु 20 वर्ष है।"}, {"id": 82, "question": nt Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 97, "question": "What is the additional percentage benefit (Pay Element) allowed to Running Staff for \nsettlement benefits in Indian Railways?/ भारतीय रेलवे में रनिग स्टाफ को सेटलमेंट (Settlement) लाभों की \nगणना के लिए अतिरिक्त कितने प्रतिशत 'पे एलिमेंट' (Pay Element) का लाभ दिया जाता है?", "options": {"A": "0.3", "B": "0.4", "C": "0.55", "D": "0.75\nPage 19 of \n22"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 98, "question": "What is the maximum amount of penalty under RTI Act,2005 that can be imposed on \nCPIO?/RTI एक्ट, 2005 के तहत CPIO पर अधिकतम कितना जुर्माना लगाया जा सकता है?", "options": {"A": "Rs. 300", "B": "Rs.25000", "C": "Rs. 75000", "D": "Rs. 60000"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 99, "question": "The minimum benchmark for non-gazetted employees for grant of financial up-gradation \nunder MACPS from July, 2016 onwards is: /जुलाई 2016 से MACPS के तहत नॉन-गजेटेड कर्मचारियों को \nफाइनेंशियल अप-ग्रेडेशन देने के लिए न्यूनतम बेंचमार्क इस प्रकार है:", "options": {"A": "Outstanding for last 3 years/पिछले 3 सालों से उत्कृ ष्ट", "B": "Good for last 3 years/पिछले 3 सालों से अच्छा", "C": "Very Good for last 3 years/पिछले 3 सालों से बहुत अच्छा", "D": "None of these/इनमें से कोई नहीं"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 100, "question": "केंद्र सरकार के कर्मचारियों के लिए निर्धारित प्राथमिक हिन्दी पाठ्यक्रम क्या है?", "options": {"A": "प्रवीण", "B": "प्राग्य", "C": "प्रबोध", "D": "पारंगत"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 101, "question": "How is the seniority of employees considered under the 10% intake quota in Indian Railways \nfixed?/प्रश्न: भारतीय रेलवे में 10% इंटेक कोटा के अंतर्गत चयनित कर्मचारियों की वरिष्ठता (Seniority) किस प्रकार \nनिर्धारित की जाती है?", "options": {"A": "By the date of appointment in the previous cadre only./के वल पूर्व कै डर में नियुक्ति की तिथि के आधार पर।", "B": "By the date of absorption in the new cadre, with the benefit of 50% of continuous service rendered in \nthe previous eligible cadre./ नए कै डर में समावेशन (Absorption) की तिथि के आधार पर, तथा पूर्व पात्र कै डर में की \nगई निरंतर सेवा का 50% वरिष्ठता हेतु जोड़कर।", "C": "By the date of birth of the employee./कर्मचारी की जन्म तिथि के आधार पर।", "D": "By the total length of Railway service without any conditions./बिना किसी शर्त के रेलवे की कु ल सेवा अवधि के \nआधार पर।"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 33 (Seniority Rules / IREM Vol-I Ch. III), pp. 173-174", "explanation_concept": "एक ही तिथि पर कार्यभार ग्रहण करने पर पदोन्नत कर्मचारी (Promotee) को सीधी भर्ती (Direct Recruit) वाले से ऊपर रखा जाता है (Alternate sequence)।", "explanation_facts": "• आरआरबी/आरआरसी के माध्यम से चयनित कर्मचारियों में यदि ट्रेनिंग अनिवार्य है, तो ट्रेनिंग स्कूल की अंतिम परीक्षा का मेरिट क्रम वरिष्ठता तय करता है।"}, {"id": 102, "question": "At the Divisional level, who is the competent authority to approve Change of Category for a \nLevel-1 Railway employee declared medically decategorised?/ मंडल स्तर पर चिकित्सकीय रूप से \nडीकै टेगराइज (Medically Decategorised) घोषित लेवल-1 रेलवे कर्मचारी के श्रेणी परिवर्तन (Change of \nCategory) को स्वीकृ त करने के लिए सक्षम प्राधिकारी कौन है?", "options": {"A": "Senior Divisional Personnel Officer (Sr. DPO)/वरिष्ठ मंडल कामिक अधिकारी (Sr. DPO)", "B": "Additional Divisional Railway Manager (ADRM) \n/अपर मंडल रेल प्रबंधक (ADRM)", "C": "Divisional Railway Manager (DRM)/मंडल रेल प्रबंधक (DRM)", "D": "Chief Personnel Officer (CPO)/मुख्य कामिक अधिकारी (CPO)\nPage 20 of \n22"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 103, "question": "Consolidated funds & Public Accounts of India is Mentioned in _____ Article of Constitution \nof India./भारत के संविधान के _____ अनुच्छेद में भारत की संचित निधि और लोक लेखा का उल्लेख है।", "options": {"A": "250", "B": "266", "C": "272", "D": "280"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 104, "question": "हिन्दी दिवस कब मनाया जाता है?", "options": {"A": "5 सितंबर", "B": "14 सितंबर", "C": "16 सितंबर", "D": "14 नवेंबर"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 1 (Rajbhasha Important Dates)", "explanation_concept": "प्रतिवर्ष 14 सितंबर को 'हिन्दी दिवस' मनाया जाता है, क्योंकि 14 सितंबर 1949 को संविधान सभा ने देवनागरी लिपि में हिन्दी को संघ की आधिकारिक भाषा के रूप में स्वीकार किया था।", "explanation_facts": "• 10 जनवरी को 'विश्व हिन्दी दिवस' (World Hindi Day) मनाया जाता है।"}, {"id": 105, "question": "Prohibition of Sexual harassment of working women is mentioned in ______ rule of Railway \nService Conduct Rules./ कामकाजी महिलाओं के यौन उत्पीड़न पर रोक का जि़क्र रेलवे सेवा आचरण नियमों के \n______ नियम में किया गया है।", "options": {"A": "3", "B": "3A", "C": "3B", "D": "3C"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 106, "question": "Whether reservation in promotion is applicable to an ex-cadre post or a single post in Indian \nRailways?/ क्या भारतीय रेलवे में एक्स-कै डर (Ex-cadre) पद या एकल पद (Single Post) पर पदोन्नति में \nआरक्षण लागू होता है?", "options": {"A": "Reservation is applicable to both ex-cadre and single posts./ एक्स-कै डर एवं एकल दोनों पदों पर आरक्षण लागू \nहोता है।", "B": "Reservation is applicable only to ex-cadre posts./ के वल एक्स-कै डर पदों पर आरक्षण लागू होता है।", "C": "Reservation is not applicable to single posts and ex-cadre posts./ एकल पद (Single Post) तथा पृथक एक्स-\nकै डर पदों पर आरक्षण लागू नहीं होता।", "D": "Reservation is decided by the General Manager./आरक्षण का निर्णय महाप्रबंधक द्वारा किया जाता है।"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 107, "question": "If no administrative action is taken on the 90 days' notice of voluntary retirement submitted by \na Railway employee, what is the consequence?/ यदि रेलवे कर्मचारी द्वारा दिए गए 90 दिनों के स्वैच्छिक \nसेवानिवृत्ति (Voluntary Retirement) के नोटिस पर सक्षम प्राधिकारी द्वारा कोई प्रशासनिक कारर्वाई नहीं की जाती \nहै, तो इसका क्या परिणाम होगा?", "options": {"A": "The notice automatically stands cancelled./नोटिस स्वतः निरस्त माना जाएगा।", "B": "The employee cannot retire from service without written approval./ लिखित स्वीकृ ति के बिना कर्मचारी \nसेवानिवृत्त नहीं हो सकता।", "C": "The employee shall be deemed to have retired automatically on expiry of the 90-day notice period, \nunless permission is refused before its expiry./ यदि 90 दिनों की नोटिस अवधि समाप्त होने से पूर्व अनुमति \nअस्वीकार नहीं की जाती है, तो कर्मचारी 90 दिन पूरे होने पर स्वतः सेवानिवृत्त माना जाएगा।", "D": "The notice period is automatically extended by another 90 days./ नोटिस अवधि स्वतः 90 दिन और बढ़ \nजाएगी।\nPage 21 of \n22"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 27 & 29 (Retirement Rules), pp. 150, 159", "explanation_concept": "सामान्य सेवानिवृत्ति आयु 60 वर्ष है (30.05.1998 से लागू)। यदि जन्मतिथि महीने की 1 तारीख है, तो सेवानिवृत्ति पिछले माह के अंतिम दिन होगी; 2 या उसके बाद होने पर उसी माह के अंतिम दिन।", "explanation_facts": "• रेलवे मेडिकल अधिकारियों (IRMS डॉक्टर्स) की सेवानिवृत्ति आयु बढ़ाकर 65 वर्ष कर दी गई है।\n• पेंशन हेतु न्यूनतम अर्हकारी सेवा 10 वर्ष तथा वीआरएस हेतु 20 वर्ष है।"}, {"id": 108, "question": "How many members from each of the recognized trade unions can be members of the \nDivisional SBF Committee? / मान्यता प्राप्त प्रत्येक ट्रेड यूनियन से कितने सदस्य डिविजनल SBF समिति के \nसदस्य हो सकते हैं?", "options": {"A": "1", "B": "2", "C": "4", "D": "6"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 22 (Staff Benefit Fund), pp. 126-127", "explanation_concept": "SBF की स्थापना 1931 में हुई। प्रतिवर्ष ₹800 प्रति कर्मचारी की दर से आवंटन किया जाता है (RBE 157/2022)। यह मुख्य रूप से अराजपत्रित कर्मचारियों एवं आरपीएफ के कल्याण हेतु है।", "explanation_facts": "• निलंबित/सेवानिवृत्त कर्मचारी SBF बैठकों में भाग नहीं ले सकते।\n• SBF बैठकों के दौरान मनोरंजन पर होने वाला खर्च SBF फंड से ही वहन किया जाता है।\n• PCPO को छात्रवृत्ति व चिकित्सा मदों को छोड़कर 25% तक पुनर्विनियोजन का अधिकार है।"}, {"id": 109, "question": "In any factory or industrial establishment where less than 1000 employees are employed the \nwages shall be paid before the expiry of the ____ day. / किसी भी फ़ै क्टरी या औद्योगिक प्रतिष्ठान में, जहाँ \n1000 से कम कर्मचारी काम करते हैं, वहाँ वेतन ____ दिन के खत्म होने से पहले दिया जाएगा।", "options": {"A": "10th Day/10वां दिन", "B": "2nd Day/दूसरा दिन", "C": "7th Day/सातवाँ दिन", "D": "None of these/इनमें से कोई नहीं"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 110, "question": "Pass to widows/widower of Railway employee was implemented w.e.f. ? \n/रेलवे कर्मचारी की विधवा/विधुर के लिए पास की सुविधा कब से लागू की गई?", "options": {"A": "12.03.1987", "B": "12.03.1990", "C": "12.03.1989", "D": "12.03.1988\nPage 22 of \n22"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह  कैशलेस चिकित्सा उपचार प्रदान करने हेतु स्मार्ट मेडिकल आईडी कार्ड है।", "explanation_facts": "• UMID कार्ड में बायोमेट्रिक, विशिष्ट चिकित्सा पात्रता तथा आश्रितों का विवरण शामिल होता है।"}, {"id": 9, "question": "Login to the HRMS portal typically requires? / HRMS पोर्टल में लॉगिन के लिए सामान्यतः किसकी \nआवश्यकता होती है?", "options": {"A": "PAN card only / के वल पैन कार्ड", "B": "Employee ID and password / कर्मचारी आईडी और पासवर्ड", "C": "Voter ID / वोटर आईडी", "D": "Passport number / पासपोर्ट नंबर"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 40 (IT Applications - HRMS), p. 194", "explanation_concept": "HRMS (Human Resource Management System) का विकास CRIS द्वारा किया गया है। यह रेलवे कर्मचारियों के संपूर्ण सेवा प्रबंधन और ई-पास/लीव/एपीएआर हेतु ऑनलाइन पोर्टल है।", "explanation_facts": "• CRIS की स्थापना 1986 में हुई, मुख्यालय चाणक्यपुरी, नई दिल्ली में है।\n• HRMS ई-पास/पीटीओ मॉड्यूल 10 अगस्त 2022 से पूरे भारतीय रेल में पूर्णतः लागू है।"}, {"id": 10, "question": "Penalties under the DAR are broadly classified into/ \nडीएआर के अंतर्गत दंडों को व्यापक रूप से किसमें वर्गीकृ त किया गया है?", "options": {"A": "Minor penalties and Major penalties / लघु दंड एवं गुरु (मेजर) दंड", "B": "Only promotion denial / के वल पदोन्नति से इनकार", "C": "Only fines / के वल जुर्माना", "D": "Only transfer orders / के वल स्थानांतरण आदेश"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 11, "question": "The term 'Office Order' in railway administration generally refers to:/ \nरेलवे प्रशासन में 'कार्यालय आदेश' शब्द सामान्यतः किसे दर्शाता है?", "options": {"A": "A ticket booking receipt / टिकट बुकिग रसीद", "B": "A freight invoice / माल भाड़ा चालान", "C": "A train timetable /
