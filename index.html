(accumulation) की कोई अधिकतम सीमा नहीं है।", "explanation_facts": "• 2 दिन की LHAP को मेडिकल सर्टिफिकेट पर 1 दिन की कम्यूटेड लीव (पूर्ण वेतन पर) में बदला जा सकता है।\n• एक बार में अधिकतम 24 माह तक स्वीकृत की जा सकती है।"}, {"id": 14, "question": "Leave granted to a railway employee without pay and allowances, generally when no other \nleave is due, is called/ \nजब कोई अन्य अवकाश शेष न हो, तब रेल कर्मचारी को बिना वेतन एवं भत्तों के दिया जाने वाला अवकाश क्या कहलाता \nहै?", "options": {"A": "Casual Leave / आकस्मिक अवकाश", "B": "Earned Leave / अजित अवकाश", "C": "Compensatory Leave / प्रतिकर अवकाश", "D": "Extraordinary Leave (EOL) / असाधारण अवकाश (ईओएल)"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 15, "question": "The rules governing the grant of free/concessional travel passes to railway employees are \nknown as:/ \nरेलवे कर्मचारियों को निःशुल्क/रियायती यात्रा पास प्रदान करने से संबंधित नियम क्या कहलाते हैं?", "options": {"A": "Railway Servants (Leave) Rules / रेल कर्मचारी (अवकाश) नियम", "B": "Discipline and Appeal Rules / अनुशासन एवं अपील नियम", "C": "Railway Servants (Pass) Rules / रेल कर्मचारी (पास) नियम", "D": "Pension Rules / पेंशन नियम"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह या बेसिक पे का 15% (जो कम हो)।\n• विधवा पास योजना 12.03.1987 से लागू हुई।\n• ग्रुप 'C' कर्मचारी को 5 वर्ष सेवा तक 1 सेट तथा 5 वर्ष बाद 3 सेट सुविधा पास प्रतिवर्ष मिलते हैं।"}, {"id": 16, "question": "Earned Leave (EL) accrues to a railway employee on the basis of/अजित अवकाश (ईएल) रेल कर्मचारी \nको किस आधार पर प्राप्त होता है?", "options": {"A": "Number of transfers / स्थानांतरणों की संख्या", "B": "Number of promotions received / प्राप्त पदोन्नतियों की संख्या", "C": "Pension amount / पेंशन राशि", "D": "Duty performed during the half-year/year as per prescribed rate / निर्धारित दर के अनुसार अर्ध-वर्ष/वर्ष में की \nगई ड्यूटी के आधार पर"}, "answer": "D", "explanation_ref": "Establishment Book 2026, Ch. 5 (Leave Rules, Para 523), pp. 34-35", "explanation_concept": "LAP प्रति वर्ष 30 दिन (15-15 दिन 1 जनवरी और 1 जुलाई को) जमा होती है। अधिकतम संचय सीमा 300 + 15 दिन है।", "explanation_facts": "• स्कूल/वेकेशन स्टाफ को प्रति वर्ष केवल 10 दिन LAP मिलती है।\n• एक समय में भारत में अधिकतम 180 दिन (सामान्यतः 120 दिन) तक स्वीकृत हो सकती है।"}, {"id": 17, "question": "Find the simple interest on ₹5,000 at 8% per annum for 3 years./ \n₹5,000 पर 8% वाषिक दर से 3 वर्ष का साधारण ब्याज ज्ञात करें।", "options": {"A": "₹1,000 / ₹1,000", "B": "₹1,100 / ₹1,100", "C": "₹1,200 / ₹1,200", "D": "₹1,400 / ₹1,400"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 18, "question": "संसदीय राजभाषा समिति में कितने सदस्य होते हैं?", "options": {"A": "70", "B": "40", "C": "50", "D": "30\nPage 3 of \n20"}, "answer": "D", "explanation_ref": "Establishment Book 2026, Ch. 1 (Rajbhasha) / Section 4, OL Act 1963", "explanation_concept": "संसदीय राजभाषा समिति में कुल 30 सदस्य होते हैं (20 लोकसभा + 10 राज्यसभा)। यह अपनी रिपोर्ट राष्ट्रपति को सौंपती है।", "explanation_facts": "• केंद्रीय हिंदी समिति के अध्यक्ष प्रधानमंत्री होते हैं।\n• रेलवे हिंदी सलाहकार समिति के अध्यक्ष रेल मंत्री होते हैं।"}, {"id": 19, "question": "राजभाषा अधिनियम की धारा 3(3) कब से प्रभावी हुई?", "options": {"A": "26 फरवरी 1966", "B": "26 जनवरी 1965", "C": "26 जनवरी 1972", "D": "26 जनवरी 1959"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 1 & Official Languages Act, 1963", "explanation_concept": "राजभाषा अधिनियम 1963 की धारा 3(3) 26 जनवरी 1965 से प्रभावी हुई, जिसके अंतर्गत 14 प्रकार के सरकारी दस्तावेज़ अनिवार्य रूप से द्विभाषी (हिन्दी एवं अंग्रेजी) जारी किए जाने चाहिए।", "explanation_facts": "• संकल्प, सामान्य आदेश, नियम, अधिसूचना, प्रशासनिक व अन्य रिपोर्ट, प्रेस विज्ञप्तियाँ, संविदा, करार, अनुज्ञप्तियाँ, टेंडर नोटिस आदि द्विभाषी जारी होना अनिवार्य है।"}, {"id": 20, "question": "The headquarters of Western Railway is located at/ \nपश्चिम रेलवे का मुख्यालय कहाँ स्थित है?", "options": {"A": "New Delhi / नई दिल्ली", "B": "Chennai / चेन्नई", "C": "Mumbai / मुंबई", "D": "Kolkata / कोलकाता"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 21, "question": "GeM is administered under which ministry?/ GeM किस मंत्रालय के अधीन संचालित होता है?", "options": {"A": "Ministry of Home Affairs / गृह मंत्रालय", "B": "Ministry of Railways / रेल मंत्रालय", "C": "Ministry of Commerce and Industry / वाणिज्य एवं उद्योग मंत्रालय", "D": "Ministry of Defence / रक्षा मंत्रालय"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 40 (IT Applications - GeM), p. 196", "explanation_concept": "GeM का पूर्ण रूप Government e-Marketplace है। यह वाणिज्य एवं उद्योग मंत्रालय (Ministry of Commerce and Industry) के अधीन 09 अगस्त 2016 को सरकारी खरीद में पारदर्शिता और दक्षता बढ़ाने हेतु लॉन्च किया गया था।", "explanation_facts": "• IREPS (Indian Railways E-Procurement System) रेलवे का आधिकारिक ई-टेंडरिंग पोर्टल है।"}, {"id": 22, "question": "The period during which a newly appointed railway employee's suitability for the post is \nassessed before confirmation is called/ \nकिसी नवनियुक्त रेलवे कर्मचारी की पद हेतु उपयुक्तता का मूल्यांकन पुष्टिकरण से पूर्व जिस अवधि में किया जाता है, उसे \nक्या कहते हैं?", "options": {"A": "Furlough / फर्लो", "B": "Sabbatical / सब्बाटिकल", "C": "Probation period / परिवीक्षा अवधि (प्रोबेशन)", "D": "Deputation / प्रतिनियुक्ति"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 2 & Ch. 34 (Master Circular 19), p. 175", "explanation_concept": "पुष्टिकरण (Confirmation) कर्मचारी के पूरे सेवाकाल में केवल एक बार एंट्री ग्रेड पर सफल परिवीक्षा (Probation) के बाद किया जाता है और यह स्थायी पदों की उपलब्धता से पूरी तरह अलग (delinked) है।", "explanation_facts": "• जूनियर अकाउंट्स असिस्टेंट्स (JAA) को कन्फर्मेशन हेतु Appendix-II-A परीक्षा पास करना अनिवार्य है।"}, {"id": 23, "question": "A transfer effected on the mutual request of two railway employees willing to exchange their \nplaces of posting is called/ \nदो रेल कर्मचारियों की आपसी सहमति से अपने पदस्थापन स्थान बदलने हेतु किया गया स्थानांतरण क्या कहलाता है?", "options": {"A": "Penal Transfer / दंडात्मक स्थानांतरण", "B": "Promotion / पदोन्नति", "C": "Deputation / प्रतिनियुक्ति", "D": "Mutual Transfer / पारस्परिक स्थानांतरण (म्यूचुअल ट्रांसफर)"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 24, "question": "In e-Office, a Digital Signature Certificate (DSC) is used for?/ e-Office में डिजिटल सिग्नेचर \nसटिफिके ट (DSC) किसलिए प्रयोग होता है?", "options": {"A": "Printing documents / दस्तावेज़ प्रिट करने हेतु", "B": "Digitally authenticating and signing files / फाइलों को डिजिटल रूप से प्रमाणित एवं हस्ताक्षरित करने हेतु", "C": "Sending emails only / के वल ईमेल भेजने हेतु", "D": "Scanning documents / दस्तावेज़ स्कै न करने हेतु\nPage 4 of \n20"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 40 (IT Applications - e-Office), p. 194", "explanation_concept": "e-Office का विकास NIC (National Informatics Centre) ने किया है। इसका मुख्य उद्देश्य डिजिटल फाइल मूवमेंट, नोटिंग और पेपरलेस ऑफिस बनाना है।", "explanation_facts": "• इसमें फाइलों के प्रमाणीकरण व हस्ताक्षर हेतु Digital Signature Certificate (DSC) का प्रयोग होता है।"}, {"id": 25, "question": "The uniform date of annual increment for central government/railway employees is generally/ \nकेंद्र सरकार/रेलवे कर्मचारियों हेतु वाषिक वेतन वृद्धि की एकसमान तिथि सामान्यतः क्या है?", "options": {"A": "15th August of the year / वर्ष की 15 अगस्त", "B": "31st December of the year / वर्ष की 31 दिसंबर", "C": "1st July of the year / वर्ष की 1 जुलाई", "D": "1st April of the year / वर्ष की 1 अप्रैल"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 26, "question": "Which of the following is NOT a function of IPAS? / निम्नलिखित में से कौन सा कार्य IPAS का भाग नहीं \nहै?", "options": {"A": "Salary processing / वेतन प्रसंस्करण", "B": "Bill generation / बिल जनरेशन", "C": "Accounts maintenance / खाता रखरखाव", "D": "Video conferencing / वीडियो कॉन्फ्रें सिग"}, "answer": "D", "explanation_ref": "Establishment Book 2026, Ch. 40 (IT Applications - IPAS), p. 194", "explanation_concept": "IPAS का पूर्ण रूप Integrated Payroll and Accounting System है। इसका विकास CRIS द्वारा किया गया है और यह मुख्यतः लेखा (Accounts) विभाग द्वारा वेतन बिल और खातों के प्रबंधन हेतु उपयोग किया जाता है।", "explanation_facts": "• RESS (Railway Employee Self Service) मोबाइल ऐप IPAS डेटा से जुड़ा हुआ है।"}, {"id": 27, "question": "Which of the following can be applied through HRMS?/ निम्नलिखित में से कौन सा कार्य HRMS के \nमाध्यम से किया जा सकता है?", "options": {"A": "Grievance registration / शिकायत पंजीकरण", "B": "Procurement of goods / वस्तुओं की खरीद", "C": "Leave application / अवकाश (छु ट्टी) आवेदन", "D": "Pension for the public / आम जनता के लिए पेंशन"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 40 (IT Applications - HRMS), p. 194", "explanation_concept": "HRMS (Human Resource Management System) का विकास CRIS द्वारा किया गया है। यह रेलवे कर्मचारियों के संपूर्ण सेवा प्रबंधन और ई-पास/लीव/एपीएआर हेतु ऑनलाइन पोर्टल है।", "explanation_facts": "• CRIS की स्थापना 1986 में हुई, मुख्यालय चाणक्यपुरी, नई दिल्ली में है।\n• HRMS ई-पास/पीटीओ मॉड्यूल 10 अगस्त 2022 से पूरे भारतीय रेल में पूर्णतः लागू है।"}, {"id": 28, "question": "GeM stands for?/ GeM का पूर्ण रूप क्या है?", "options": {"A": "Government e-Management / गवर्नमेंट e- मैनिज्मन्ट", "B": "Government e-Marketplace / गवर्नमेंट e-माकिट्प्लैस", "C": "Government Employee Module / गवर्नमेंट एम्प्लोयी मॉड्यूल", "D": "General e-Marketing / जनरल e-मार्के टिग"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 40 (IT Applications - GeM), p. 196", "explanation_concept": "GeM का पूर्ण रूप Government e-Marketplace है। यह वाणिज्य एवं उद्योग मंत्रालय (Ministry of Commerce and Industry) के अधीन 09 अगस्त 2016 को सरकारी खरीद में पारदर्शिता और दक्षता बढ़ाने हेतु लॉन्च किया गया था।", "explanation_facts": "• IREPS (Indian Railways E-Procurement System) रेलवे का आधिकारिक ई-टेंडरिंग पोर्टल है।"}, {"id": 29, "question": "Reservation in recruitment on Indian Railways is provided to categories such as/ \nभारतीय रेल में भर्ती में किन श्रेणियों को आरक्षण प्रदान किया जाता है?", "options": {"A": "Only employees of other ministries / के वल अन्य मंत्रालयों के कर्मचारी", "B": "SC, ST, OBC, EWS and Persons with Benchmark Disabilities (PwBD) as per government policy / \nसरकारी न n_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 51, "question": "Casual Leave (CL) admissible to a railway employee is generally treated as/ \nरेल कर्मचारी को स्वीकार्य आकस्मिक अवकाश (सीएल) सामान्यतः किस रूप में माना जाता है?", "options": {"A": "Not debited to the leave account, treated as duty for pay purposes / अवकाश खाते में डेबिट नहीं होता, वेतन \nप्रयोजन हेतु ड्यूटी माना जाता है", "B": "Leave debited to the regular leave account / नियमित अवकाश खाते में डेबिट किया गया अवकाश", "C": "A form of suspension / निलंबन का एक रूप", "D": "A penalty / एक दंड"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 5 (Leave Rules, Master Circular 35), p. 38", "explanation_concept": "आकस्मिक अवकाश (CL) कोई सांविधिक अवकाश (Statutory Leave) नहीं है, इसे ड्यूटी पर ही माना जाता है और यह लीव अकाउंट में दर्ज नहीं होता। प्रशासनिक स्टाफ को 8 दिन और लाइन स्टाफ को 10 दिन मिलता है।", "explanation_facts": "• PwBD कर्मचारियों को 4 दिन का अतिरिक्त विशेष CL मिलता है।\n• CL को LAP/LHAP आदि के साथ नहीं जोड़ा जा सकता (केवल SCL/RH/CR के साथ मान्य)।"}, {"id": 52, "question": "At the zonal level, the Personnel Department is generally headed by the:/ \nजोनल स्तर पर कामिक विभाग का प्रमुख सामान्यतः कौन होता है?", "options": {"A": "Principal Chief Personnel Officer (PCPO) / प्रधान मुख्य कामिक अधिकारी (पीसीपीओ)", "B": "Chief Signal Engineer / मुख्य सिग्नल इंजीनियर", "C": "Chief Commercial Manager / मुख्य वाणिज्य प्रबंधक", "D": "Chief Security Commissioner / मुख्य सुरक्षा आयुक्त\nPage 9 of \n20"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 53, "question": "A railway employee who opts to retire before attaining the age of superannuation, after \ncompleting the minimum qualifying service, exercises the option of/ \nन्यूनतम अर्हकारी सेवा पूर्ण करने के बाद अधिवषिता आयु से पूर्व सेवानिवृत्त होने का विकल्प चुनने वाला रेल कर्मचारी \nकिस विकल्प का प्रयोग करता है?", "options": {"A": "Deputation / प्रतिनियुक्ति", "B": "Voluntary Retirement / स्वैच्छिक सेवानिवृत्ति", "C": "Suspension / निलंबन", "D": "Transfer / स्थानांतरण"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 27 & 29 (Retirement Rules), pp. 150, 159", "explanation_concept": "सामान्य सेवानिवृत्ति आयु 60 वर्ष है (30.05.1998 से लागू)। यदि जन्मतिथि महीने की 1 तारीख है, तो सेवानिवृत्ति पिछले माह के अंतिम दिन होगी; 2 या उसके बाद होने पर उसी माह के अंतिम दिन।", "explanation_facts": "• रेलवे मेडिकल अधिकारियों (IRMS डॉक्टर्स) की सेवानिवृत्ति आयु बढ़ाकर 65 वर्ष कर दी गई है।\n• पेंशन हेतु न्यूनतम अर्हकारी सेवा 10 वर्ष तथा वीआरएस हेतु 20 वर्ष है।"}, {"id": 54, "question": "अरुणाचल प्रदेश की आधिकारिक भाषा क्या है?", "options": {"A": "हिदी", "B": "उर्दू", "C": "अंग्रेज़ी", "D": "कश्मीरी"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 55, "question": "Under NPS, contributions towards the pension corpus are made by/ एनपीएस के अंतर्गत, पेंशन कोष \nहेतु अंशदान किसके द्वारा किया जाता है?", "options": {"A": "Only a private insurance company / के वल एक निजी बीमा कं पनी द्वारा", "B": "Both the employee and the government (employer) / कर्मचारी एवं सरकार (नियोक्ता) दोनों द्वारा", "C": "Only the employee / के वल कर्मचारी द्वारा", "D": "No contribution is required / कोई अंशदान आवश्यक नहीं है"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 29 (NPS Structure), p. 160", "explanation_concept": "NPS 01.01.2004 से लागू हुआ। कर्मचारी अंशदान 10% (बेसिक + DA) तथा सरकार का अंशदान 14% है (01.04.2019 से)। सेवानिवृत्ति पर अधिकतम 60% एकमुश्त टैक्स-फ्री निकाला जा सकता है और न्यूनतम 40% वार्षिकी (Annuity) हेतु अनिवार्य है।", "explanation_facts": "• NPS का विनियामक निकाय PFRDA है।"}, {"id": 56, "question": "Before imposing a major penalty on a railway employee under DAR, which of the following is \nmandatorily required?/ \nडीएआर के अंतर्गत किसी रेल कर्मचारी पर गुरु दंड लगाने से पूर्व निम्नलिखित में से क्या अनिवार्य रूप से आवश्यक है?", "options": {"A": "Only a verbal warning / के वल एक मौखिक चेतावनी", "B": "Immediate dismissal without process / बिना किसी प्रक्रिया के तत्काल बर्खास्तगी", "C": "No inquiry is needed / किसी जाँच की आवश्यकता नहीं है", "D": "A regular departmental inquiry with charge-sheet and opportunity to defend / आरोप-पत्र एवं बचाव के \nअवसर सहित एक नियमित विभागीय जाँच"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 57, "question": "MACP stands for/ \nएमएसीपी का पूर्ण रूप क्या है?", "options": {"A": "Manual for Assessment of Central Pay / केंद्रीय वेतन आकलन नियमावली", "B": "Ministry of Administrative Career Planning / प्रशासनिक कै रियर योजना मंत्रालय", "C": "Major Annual Career Programme / प्रमुख वाषिक कै रियर कार्यक्रम", "D": "Modified Assured Career Progression / संशोधित सुनिश्चित कै रियर प्रगति\nPage 10 of \n20"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 58, "question": "Reservation for Persons with Benchmark Disabilities (PwBD) in central government/railway \nrecruitment is applicable as per/ \nकेंद्र सरकार/रेलवे भर्ती में बेंचमार्क दिव्यांगजन (पीडब्ल्यूबीडी) हेतु आरक्षण किसके अनुसार लागू होता है?", "options": {"A": "Only state government rules / के वल राज्य सरकार के नियम", "B": "Only for gazetted posts / के वल राजपत्रित पदों हेतु", "C": "The Rights of Persons with Disabilities Act and related government orders / दिव्यांगजन अधिकार \nअधिनियम एवं संबंधित सरकारी आदेश", "D": "No such provision exists / ऐसा कोई प्रावधान नहीं है"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 59, "question": "RESS stands for?/ RESS का पूर्ण रूप क्या है?", "options": {"A": "Regional Employee Support System / रेल्वे कर्मचारी सपोर्ट सिस्टम", "B": "Railway Enterprise Software System / रेलवे एं टरप्राइज़ सॉफ़्टवेयर सिस्टम", "C": "Remote Employee Self Service / रीमोट कर्मचारी स्व-सेवा", "D": "Railway Employee Self Service / रेलवे कर्मचारी स्व-सेवा"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 60, "question": "The Railway Servants (Discipline and Appeal) Rules primarily provide the procedure for/ \nरेल कर्मचारी (अनुशासन एवं अपील) नियम मुख्यतः किसकी प्रक्रिया प्रदान करते हैं?", "options": {"A": "Sanctioning leave / अवकाश स्वीकृ त करना", "B": ढ़"}, "answer": "B", "explanation_ref": "Establishment Book 2026, Ch. 1 & Official Languages Rules 1976", "explanation_concept": "राजभाषा नियम 1976 के अनुसार राज्यों को तीन क्षेत्रों (क, ख, ग) में बाँटा गया है। गुजरात, महाराष्ट्र, पंजाब और चंडीगढ़ 'ख' क्षेत्र में आते हैं। अंडमान और निकोबार द्वीप समूह विशिष्ट रूप से 'क' क्षेत्र में आता है।", "explanation_facts": "• क्षेत्र 'क': बिहार, हरियाणा, हिमाचल प्रदेश, मध्य प्रदेश, राजस्थान, उत्तर प्रदेश, उत्तराखंड, झारखंड, छत्तीसगढ़, दिल्ली एवं अंडमान-निकोबार।\n• क्षेत्र 'ख': गुजरात, महाराष्ट्र, पंजाब, और यू.टी. चंडीगढ़, दमन-दीव, दादरा-नगर हवेली।\n• क्षेत्र 'ग': शेष सभी राज्य एवं संघ राज्य क्षेत्र (तमिलनाडु पर यह नियम लागू नहीं होते)।"}, {"id": 89, "question": "Recruitment, seniority, promotion and other service matters of non-gazetted railway staff are \nprimarily governed by the:/ \nअराजपत्रित रेलवे कर्मचारियों की भर्ती, वरिष्ठता, पदोन्नति आदि सेवा संबंधी मामले मुख्यतः किसके द्वारा शासित होते हैं?", "options": {"A": "Indian Railway Establishment Code (IREC) / Manual / भारतीय रेल स्थापना संहिता (आईआरईसी) / नियमावली", "B": "Motor Vehicles Act / मोटर वाहन अधिनियम", "C": "Companies Act / कं पनी अधिनियम", "D": "Indian Penal Code / भारतीय दंड संहिता"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 33 (Seniority Rules / IREM Vol-I Ch. III), pp. 173-174", "explanation_concept": "एक ही तिथि पर कार्यभार ग्रहण करने पर पदोन्नत कर्मचारी (Promotee) को सीधी भर्ती (Direct Recruit) वाले से ऊपर रखा जाता है (Alternate sequence)।", "explanation_facts": "• आरआरबी/आरआरसी के माध्यम से चयनित कर्मचारियों में यदि ट्रेनिंग अनिवार्य है, तो ट्रेनिंग स्कूल की अंतिम परीक्षा का मेरिट क्रम वरिष्ठता तय करता है।"}, {"id": 90, "question": "Which of the following can register as a seller on GeM?/ निम्नलिखित में से कौन GeM पर विक्रे ता के \nरूप में पंजीकरण कर सकता है?", "options": {"A": "Manufacturers, service providers, and authorized resellers / निर्माता, सेवा प्रदाता और अधिकृ त रीसेलर", "B": "Only government employees / के वल सरकारी कर्मचारी", "C": "Only foreign companies / के वल विदेशी कं पनियां", "D": "Only individuals with no registered business / बिना पंजीकृ त व्यवसाय वाले के वल व्यक्ति\nPage 16 of \n20"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 40 (IT Applications - GeM), p. 196", "explanation_concept": "GeM का पूर्ण रूप Government e-Marketplace है। यह वाणिज्य एवं उद्योग मंत्रालय (Ministry of Commerce and Industry) के अधीन 09 अगस्त 2016 को सरकारी खरीद में पारदर्शिता और दक्षता बढ़ाने हेतु लॉन्च किया गया था।", "explanation_facts": "• IREPS (Indian Railways E-Procurement System) रेलवे का आधिकारिक ई-टेंडरिंग पोर्टल है।"}, {"id": 91, "question": "A pass granted to a railway employee for personal/recreational travel during service, as \ndistinct from duty travel, is called a/ \nसेवा के दौरान ड्यूटी यात्रा से भिन्न, व्यक्तिगत/मनोरंजन यात्रा हेतु रेल कर्मचारी को दिया जाने वाला पास क्या कहलाता \nहै?", "options": {"A": "Parcel Way Bill / पार्सल वे-बिल", "B": "Duty Pass / ड्यूटी पास", "C": "Freight Pass / माल पास", "D": "Privilege Pass / प्रिविलेज पास"}, "answer": "D", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह या बेसिक पे का 15% (जो कम हो)।\n• विधवा पास योजना 12.03.1987 से लागू हुई।\n• ग्रुप 'C' कर्मचारी को 5 वर्ष सेवा तक 1 सेट तथा 5 वर्ष बाद 3 सेट सुविधा पास प्रतिवर्ष मिलते हैं।"}, {"id": 92, "question": "A Railway Division is headed by a/ \nएक रेलवे मंडल का प्रमुख कौन होता है?", "options": {"A": "Chairman Railway Board / अध्यक्ष रेलवे बोर्ड", "B": "General Manager / महाप्रबंधक", "C": "Zonal Officer / जोनल अधिकारी", "D": "Divisional Railway Manager (DRM) / मंडल रेल प्रबंधक (डीआरएम)"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 93, "question": "Fill in the blank with the correct verb form: \"She ______ to school every day.\"/ \nसही क्रिया रूप से रिक्त स्थान भरें: \"She ______ to school every day.\"", "options": {"A": "go", "B": "goes", "C": "going", "D": "gone"}, "answer": "B", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (B) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 94, "question": "Misuse of a railway pass by an employee is treated as/ \nकिसी कर्मचारी द्वारा रेलवे पास का दुरुपयोग किस रूप में माना जाता है?", "options": {"A": "A promotion criterion / पदोन्नति मानदंड", "B": "A pay increment ground / वेतन वृद्धि का आधार", "C": "A minor courtesy issue with no consequence / बिना किसी परिणाम की एक मामूली शिष्टाचार समस्या", "D": "A disciplinary/misconduct matter attracting action under DAR / डीएआर के अंतर्गत कारर्वाई हेतु \nअनुशासनात्मक/कदाचार का मामला"}, "answer": "D", "explanation_ref": "Establishment Book 2026, Ch. 4 (Railway Servants Pass Rules, 1986), pp. 24-31", "explanation_concept": "सुविधा पास में परिवार के साथ अधिकतम 2 आश्रितों को शामिल किया जा सकता है, तथा कुल सदस्यों की संख्या 5 से अधिक नहीं हो सकती।", "explanation_facts": "• आश्रित की आय सीमा: ₹9,000/- प्रतिमाह या बेसिक पे का 15% (जो कम हो)।\n• विधवा पास योजना 12.03.1987 से लागू हुई।\n• ग्रुप 'C' कर्मचारी को 5 वर्ष सेवा तक 1 सेट तथा 5 वर्ष बाद 3 सेट सुविधा पास प्रतिवर्ष मिलते हैं।"}, {"id": 95, "question": "A Zonal Railway is headed by a:/ \nएक जोनल रेलवे का प्रमुख कौन होता है?", "options": {"A": "Chief Commercial Manager / मुख्य वाणिज्य प्रबंधक", "B": "Divisional Railway Manager (DRM) / मंडल रेल प्रबंधक (डीआरएम)", "C": "General Manager (GM) / महाप्रबंधक (जीएम)", "D": "Station Superintendent / स्टेशन अधीक्षक"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 96, "question": "Promotions to NON-selection posts on Indian Railways are generally made on the principle of/ \nभारतीय रेल में गैर-चयन (नॉन-सिलेक्शन) पदों पर पदोन्नति सामान्यतः किस सिद्धांत पर की जाती है?", "options": {"A": "Merit alone regardless of seniority / वरिष्ठता की परवाह किए बिना के वल योग्यता", "B": "Lottery / लॉटरी", "C": "Seniority-cum-fitness / वरिष्ठता-सह-उपयुक्तता", "D": "Reverse seniority only / के वल विपरीत वरिष्ठता\nPage 17 of \n20"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 24 (Selection vs Non-Selection), pp. 134-135", "explanation_concept": "गैर-चयन (Non-Selection) पद Seniority-cum-Suitability के आधार पर 1:1 के अनुपात में भरे जाते हैं। इसके लिए 12 माह (1 वर्ष) की रिक्तियों का आकलन किया जाता है।", "explanation_facts": "• चयन पदों (Selection Posts) हेतु 15 माह की रिक्तियों का आकलन 3x पात्रता दायरे के साथ किया जाता है और पैनल वैधता 2 वर्ष होती है।"}, {"id": 97, "question": "Roster points and cadre strength for implementing reservation in recruitment are maintained \nthrough a/ \nभर्ती में आरक्षण लागू करने हेतु रोस्टर बिदु एवं संवर्ग शक्ति किसके माध्यम से बनाए रखे जाते हैं?", "options": {"A": "Signal Register / सिग्नल रजिस्टर", "B": "Freight Register / माल भाड़ा रजिस्टर", "C": "Timetable Chart / समय सारणी चार्ट", "D": "Reservation Roster Register / आरक्षण रोस्टर रजिस्टर"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्राव s / 60 वर्ष", "D": "62 years / 62 वर्ष"}, "answer": "C", "explanation_ref": "Establishment Book 2026, Ch. 27 & 29 (Retirement Rules), pp. 150, 159", "explanation_concept": "सामान्य सेवानिवृत्ति आयु 60 वर्ष है (30.05.1998 से लागू)। यदि जन्मतिथि महीने की 1 तारीख है, तो सेवानिवृत्ति पिछले माह के अंतिम दिन होगी; 2 या उसके बाद होने पर उसी माह के अंतिम दिन।", "explanation_facts": "• रेलवे मेडिकल अधिकारियों (IRMS डॉक्टर्स) की सेवानिवृत्ति आयु बढ़ाकर 65 वर्ष कर दी गई है।\n• पेंशन हेतु न्यूनतम अर्हकारी सेवा 10 वर्ष तथा वीआरएस हेतु 20 वर्ष है।"}, {"id": 104, "question": "A key feature of the Unified Pension Scheme (UPS) is that it assures a pension amount linked \nmainly to/ \nएकीकृ त पेंशन योजना (यूपीएस) की एक प्रमुख विशेषता यह है कि यह मुख्यतः किससे जुड़ी एक सुनिश्चित पेंशन राशि \nप्रदान करती है?", "options": {"A": "Average basic pay drawn in the last months before retirement, subject to minimum qualifying \nservice / सेवानिवृत्ति से पूर्व अंतिम महीनों के औसत मूल वेतन से, न्यूनतम अर्हकारी सेवा के अधीन", "B": "Number of transfers during service / सेवाकाल के दौरान स्थानांतरणों की संख्या से", "C": "Number of railway passes used / प्रयुक्त रेलवे पासों की संख्या से", "D": "Market performance of shares only / के वल शेयरों के बाज़ार प्रदर्शन से"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 29 (UPS Core Features), pp. 160-161", "explanation_concept": "UPS 01.04.2025 से प्रभावी (RBE 22/2025)। न्यूनतम 25 वर्ष की सेवा पर अंतिम 12 माह के औसत बेसिक पे का 50% सुनिश्चित पेंशन तथा न्यूनतम 10 वर्ष सेवा पर ₹10,000/माह गारंटीकृत पेंशन मिलती है।", "explanation_facts": "• सरकार का अंशदान 18.5% (14% मैचिंग + 4.5% पूल फंड)।\n• पारिवारिक पेंशन: मृत्यु के समय कर्मचारी की पेंशन का 60% देय।"}, {"id": 105, "question": "The cost price of an article is ₹800 and it is sold for ₹920. Find the profit \npercentage/ \nएक वस्तु का क्रय मूल्य ₹800 है और उसे ₹920 में बेचा जाता है। लाभ प्रतिशत ज्ञात करें।", "options": {"A": "10% / 10%", "B": "12% / 12%", "C": "15% / 15%", "D": "20% / 20%"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 106, "question": "Confirmation of a railway employee in service after appointment is generally governed under/ \nनियुक्ति के पश्चात रेलवे कर्मचारी की सेवा-पुष्टि (कन्फर्मेशन) सामान्यतः किसके अंतर्गत शासित होती है?", "options": {"A": "Establishment rules relating to probation and confirmation / परिवीक्षा एवं पुष्टिकरण संबंधी स्थापना नियम", "B": "Reservation Rules / आरक्षण नियम", "C": "Signal Rules / सिग्नल नियम", "D": "Pass Rules / पास नियम"}, "answer": "A", "explanation_ref": "Establishment Book 2026, Ch. 2 & Ch. 34 (Master Circular 19), p. 175", "explanation_concept": "पुष्टिकरण (Confirmation) कर्मचारी के पूरे सेवाकाल में केवल एक बार एंट्री ग्रेड पर सफल परिवीक्षा (Probation) के बाद किया जाता है और यह स्थायी पदों की उपलब्धता से पूरी तरह अलग (delinked) है।", "explanation_facts": "• जूनियर अकाउंट्स असिस्टेंट्स (JAA) को कन्फर्मेशन हेतु Appendix-II-A परीक्षा पास करना अनिवार्य है।"}, {"id": 107, "question": "An employee against whom a penalty is imposed under DAR has the right to/ डीएआर के अंतर्गत \nजिस कर्मचारी पर दंड लगाया गया है, उसे किसका अधिकार प्राप्त है?", "options": {"A": "Transfer the penalty to a colleague / दंड को किसी सहकर्मी पर स्थानांतरित करना", "B": "Automatically get promoted / स्वतः पदोन्नत हो जाना", "C": "Ignore the order without any recourse / बिना किसी उपाय के आदेश की अनदेखी करना", "D": "File an appeal before the prescribed appellate authority / निर्धारित अपीलीय प्राधिकारी के समक्ष अपील दायर \nकरना\nPage 19 of \n20"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 108, "question": "Under the MACP Scheme, financial upgradation is granted to an employee on completion of \nhow many years of regular service without promotion (for the first upgradation)?/ \nएमएसीपी योजना के अंतर्गत, बिना पदोन्नति के नियमित सेवा के कितने वर्ष पूर्ण होने पर कर्मचारी को (प्रथम उन्नयन \nहेतु) वित्तीय उन्नयन दिया जाता है?", "options": {"A": "5 years / 5 वर्ष", "B": "15 years / 15 वर्ष", "C": "10 years / 10 वर्ष", "D": "25 years / 25 वर्ष"}, "answer": "C", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (C) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 109, "question": "Through the RESS portal, railway employees can view online?/ RESS पोर्टल के माध्यम से रेलवे \nकर्मचारी ऑनलाइन क्या देख सकते हैं?", "options": {"A": "Freight rates / माल भाड़ा दरें", "B": "Only train timetables / के वल ट्रेन समय सारणी", "C": "Ticket reservations / टिकट आरक्षण", "D": "Pay slips and service details / वेतन पर्ची और सेवा विवरण"}, "answer": "D", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (D) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}, {"id": 110, "question": "The Old Pension Scheme (OPS), a defined benefit pension scheme, generally applies to railway \nemployees who joined service/ \nपुरानी पेंशन योजना (ओपीएस), जो एक निर्धारित लाभ पेंशन योजना है, सामान्यतः उन रेल कर्मचारियों पर लागू होती है \nजो सेवा में शामिल हुए:", "options": {"A": "Before 1 January 2004 / 1 जनवरी 2004 से पूर्व", "B": "After 2010 only / के वल 2010 के बाद", "C": "Only in 2020 / के वल 2020 में", "D": "After 1 January 2004 / 1 जनवरी 2004 के बाद\nPage 20 of \n20"}, "answer": "A", "explanation_ref": "Establishment Book 2026 (Group B & C), SECR", "explanation_concept": "आधिकारिक उत्तर विकल्प (A) है। यह भारतीय रेल स्थापना नियमावली एवं सेवा नियमों के प्रावधानों के अंतर्गत पूरी तरह सत्यापित है।", "explanation_facts": "• संबंधित विस्तृत नियमों हेतु स्थापना पुस्तक 2026 के निर्दिष्ट अध्याय का अवलोकन करें।"}]}, {"id": "paper_sr_clerk_engg_2026", "title": "Sr Clerk 66.67% PQ Engineering (10 Aug 2026 S2)", "subtitle": "Engineering Dept 66.67% Promotional Quota CBT Exam", "total_questions": 110, "questions": [{"id": 1, "question": "Sole Arbitrator is appointed in claims not exceeding the value of… / के मूल्य से अधिक नही होने वाले \nदावो मे एकमात्र मध्यस्थ नियुक्त किया जाता है ।", "options": {"A": "Rs. 50 Lakhs / रु. 50 लाख", "B": "Rs. 1 Crore / रु. 1 करोड़", "C": "Rs. 5 Crore / रु. 5 करोड़", "D": "Rs. 10 Crore / रु. 10 करोड़"}, "answer": "B", "explanation_ref": "General Conditions of Contract (GCC) & Arbitration Act / Establishment Manual Ch. 41", "explanation_concept": "रेलवे GCC (General Conditions of Contract) के अनुसार ₹1 करोड़ तक के दावों/विवादों में एकमात्र मध्यस्थ (Sole Arbitrator) की नियुक्ति की जाती है।", "explanation_facts": "• ₹1 करोड़ से अधिक के दावों हेतु 3-सदस्यीय मध्यस्थता ट्रिब्यूनल (Arbitral Tribunal) का गठन किया जाता है।\n• मध्यस्थता मांग प्राप्त होने के 60 दिनों के भीतर महाप्रबंधक (GM) द्वारा नियुक्ति की जानी अनिवार्य है।"}, {"id": 2, "question": "As per Rule 18(3) Railway Service (Conduct) Rules, 1966 where a railway servant enters into \ntransaction in respect of movable property either in his own name or in the name of member \nof his family, he shall within one month from the date of such transaction, report the same to \nthe Government, if the value of such property exceeds ………. pay of the Railway Servant. / रेल \nसेवा आचरण नियम, 1966 के नियम 18 let currentPaperIdx = 0;
let currentIndex = 0;
let mode = 'practice';
let answers = {};
let reviews = {};
let submitted = {};

function init() {
  renderQuestion();
  renderPalette();
}

function onPaperChange(val) {
  currentPaperIdx = parseInt(val, 10);
  currentIndex = 0;
  if (!answers[currentPaperIdx]) answers[currentPaperIdx] = {};
  if (!reviews[currentPaperIdx]) reviews[currentPaperIdx] = new Set();
  renderQuestion();
  renderPalette();
}

function renderQuestion() {
  const paper = PAPERS[currentPaperIdx];
  const q = paper.questions[currentIndex];
  document.getElementById('qBadge').textContent = `Q.${q.id} of ${paper.questions.length}`;

  let en = q.question;
  let hi = '';
  if (en.includes(' / ')) {
    const parts = en.split(' / ');
    en = parts[0];
    hi = parts.slice(1).join(' / ');
  }
  document.getElementById('qTextEn').textContent = en;
  const hiEl = document.getElementById('qTextHi');
  if (hi) {
    hiEl.style.display = 'block';
    hiEl.textContent = hi;
  } else {
    hiEl.style.display = 'none';
  }

  const optBox = document.getElementById('optionsBox');
  optBox.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  const pAns = answers[currentPaperIdx] || {};
  const userAns = pAns[q.id];
  const isSub = submitted[currentPaperIdx];

  letters.forEach(let => {
    const rawVal = q.options[let] || '';
    let optEn = rawVal;
    let optHi = '';
    if (rawVal.includes(' / ')) {
      const parts = rawVal.split(' / ');
      optEn = parts[0];
      optHi = parts.slice(1).join(' / ');
    }

    const btn = document.createElement('div');
    btn.className = 'opt-btn';
    if (userAns === let) btn.classList.add('selected');

    if ((mode === 'practice' && userAns) || isSub) {
      if (let === q.answer) btn.classList.add('correct');
      else if (userAns === let) btn.classList.add('wrong');
    }

    btn.onclick = () => selectOption(let);

    btn.innerHTML = `
      <span class="opt-letter">(${let})</span>
      <div class="opt-text">
        <span class="opt-en">${optEn}</span>
        ${optHi ? `<span class="opt-hi">${optHi}</span>` : ''}
      </div>
    `;
    optBox.appendChild(btn);
  });

  const expCard = document.getElementById('expCard');
  if ((mode === 'practice' && userAns) || isSub) {
    expCard.classList.add('visible');
    document.getElementById('ansLetter').textContent = q.answer;
    document.getElementById('expRef').textContent = q.explanation_ref || 'Establishment Manual 2026';
    document.getElementById('expCon').textContent = q.explanation_concept || '';
    const factBox = document.getElementById('expFacts');
    if (q.explanation_facts) {
      factBox.style.display = 'block';
      factBox.textContent = q.explanation_facts;
    } else {
      factBox.style.display = 'none';
    }
  } else {
    expCard.classList.remove('visible');
  }

  const revSet = reviews[currentPaperIdx] || new Set();
  const revBtn = document.getElementById('reviewBtn');
  if (revSet.has(q.id)) revBtn.classList.add('active');
  else revBtn.classList.remove('active');

  renderPalette();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectOption(let) {
  if (!answers[currentPaperIdx]) answers[currentPaperIdx] = {};
  const q = PAPERS[currentPaperIdx].questions[currentIndex];
  answers[currentPaperIdx][q.id] = let;
  renderQuestion();
}

function nextQ() {
  const paper = PAPERS[currentPaperIdx];
  if (currentIndex < paper.questions.length - 1) {
    currentIndex++;
    renderQuestion();
  }
}

function prevQ() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function toggleReview() {
  if (!reviews[currentPaperIdx]) reviews[currentPaperIdx] = new Set();
  const q = PAPERS[currentPaperIdx].questions[currentIndex];
  if (reviews[currentPaperIdx].has(q.id)) reviews[currentPaperIdx].delete(q.id);
  else reviews[currentPaperIdx].add(q.id);
  renderQuestion();
}

function toggleMode() {
  mode = (mode === 'practice') ? 'exam' : 'practice';
  document.getElementById('modePill').textContent = (mode === 'practice') ? 'Practice' : 'Exam Mode';
  renderQuestion();
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
}

function openSheet() {
  document.getElementById('sheetOverlay').classList.add('active');
  document.getElementById('bottomSheet').classList.add('active');
}

function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('active');
  document.getElementById('bottomSheet').classList.remove('active');
}

function renderPalette() {
  const grid = document.getElementById('sheetGrid');
  grid.innerHTML = '';
  const paper = PAPERS[currentPaperIdx];
  const pAns = answers[currentPaperIdx] || {};
  const revSet = reviews[currentPaperIdx] || new Set();
  const isSub = submitted[currentPaperIdx];

  paper.questions.forEach((q, idx) => {
    const btn = document.createElement('div');
    btn.className = 'pal-btn';
    btn.textContent = q.id;

    if (idx === currentIndex) btn.classList.add('current');

    const uAns = pAns[q.id];
    if (isSub) {
      if (uAns === q.answer) btn.classList.add('answered');
      else if (uAns) btn.classList.add('wrong');
    } else {
      if (revSet.has(q.id)) btn.classList.add('review');
      else if (uAns) btn.classList.add('answered');
    }

    btn.onclick = () => {
      currentIndex = idx;
      renderQuestion();
      closeSheet();
    };

    grid.appendChild(btn);
  });
}

function submitExam() {
  const paper = PAPERS[currentPaperIdx];
  const pAns = answers[currentPaperIdx] || {};
  const answered = Object.keys(pAns).length;
  if (!confirm(`Submit ${paper.title}?\n\n• Answered: ${answered} / ${paper.questions.length}\n• Unanswered: ${paper.questions.length - answered}\n\nClick OK to see score.`)) return;
  submitted[currentPaperIdx] = true;
  closeSheet();
  renderQuestion();
}

window.onload = init;
</script>
